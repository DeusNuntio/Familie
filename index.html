<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<style>
:root{
  --bg:#eef3fb; --surface:#ffffff; --ink:#172033; --ink2:#647089;
  --line:#dde5f2; --accent:#1d4ed8; --accent-2:#2563eb; --accent-soft:#dfe9fd;
  --warm:#d97706; --warm-soft:#fef0dc; --ok:#1d8a52; --ok-soft:#dcf2e6;
  --danger:#dc2626; --r:16px;
  --shadow:0 1px 3px rgba(23,32,51,.06),0 8px 22px rgba(29,78,216,.07);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0e1626;--surface:#16203400;--surface:#172034;--ink:#e8edf7;--ink2:#8b97b0;
  --line:#26324a;--accent:#5b8def;--accent-2:#6d9bf5;--accent-soft:#1c2c4d;
  --warm:#e0934a;--warm-soft:#32261a;--ok:#5cc08a;--ok-soft:#1a2e24;--danger:#f06464;
  --shadow:0 1px 3px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.5;overscroll-behavior-y:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ---- Login-Gate ---- */
.gate{position:fixed;inset:0;background:linear-gradient(160deg,#1d4ed8,#2563eb 55%,#1e3a8a);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;padding:30px;text-align:center}
.gate h1{color:#fff;font-size:30px;font-weight:700;margin:0 0 6px;letter-spacing:-.5px}
.gate p{color:rgba(255,255,255,.85);font-size:15px;margin:0 0 40px}
.gate .who{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.gate .person{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
  backdrop-filter:blur(8px);border-radius:20px;padding:24px 28px;cursor:pointer;
  transition:.15s;min-width:120px}
.gate .person:active{transform:scale(.95);background:rgba(255,255,255,.25)}
.gate .av{width:60px;height:60px;border-radius:50%;background:#fff;color:var(--accent);
  font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px}
.gate .nm{color:#fff;font-weight:600;font-size:16px}

/* ---- Header ---- */
.topbar{padding:16px 20px 10px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:20}
.topbar .ti-wrap{display:flex;flex-direction:column}
.topbar h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.5px}
.topbar .sync{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:5px;margin-top:2px;cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.me{display:flex;align-items:center;gap:8px;cursor:pointer}
.me .av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ---- Countdown-Banner ---- */

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 16px 100px}

.list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:13px;

.row .cb.on{background:var(--accent);border-color:var(--accent)}

  text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}

/* ---- Karten-Eintrag (To-do, Reparatur, Urlaub) ---- */

.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;

#qrbox{display:flex;justify-content:center;padding:18px;background:#fff;border-radius:12px;margin:10px 0}

.btn{width:100%;border:none;background:var(--accent);color:#fff;border-radius:13px;

.maplink{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:12.5px;font-weight:600;text-decoration:none}

svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}

<body>
<div class="app">

  <!-- LOGIN-GATE: wer bin ich? -->

    <h1>Familie Nadig</h1>
    <p>Wer bist du?</p>
    <div class="who" id="whoList"></div>
  </div>

  <!-- HOME -->
  <div id="home">
    <div class="topbar">
      <div class="ti-wrap">
        <h1>Familie Nadig</h1>
        <div class="sync" onclick="syncTap()"><span class="dot"></span><span id="syncTxt">Verbinde…</span> <span id="verTxt" style="opacity:.6;margin-left:4px"></span></div>
      </div>
      <div class="me" onclick="meMenu()">
        <div class="av" id="meAv">?</div>

<!-- verstecktes Datei-Input für Fotos -->
<input type="file" id="photoInput" accept="image/*" style="display:none">

<script>
// ============================================================
//  Datenhaltung — Prototyp: localStorage. Schema = OneDrive-JSON.
// ============================================================
const APP_VERSION = "1.2.0";
const KEY = "familienapp.v2";
const now = () => new Date().toISOString();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id"+Math.random().toString(36).slice(2));

// Aktueller Nutzer (wer bin ich auf diesem Handy)
let ME = localStorage.getItem("familienapp.me") || null;

function seed(){
  return {
    nutzer: ["Ellen","Alexander","Julia","Isabella"],
    todos: [], todoListen: [], reparaturen: [], urlaub: [], ideen: [], keller: [], rezepte: [],
    listen: [ {id:uid(),name:"Allgemein",artikel:[],createdAt:now(),updatedAt:now()} ],
    einkaufStamm: ["Äpfel","Bananen","Tomaten","Gurke","Salat","Kartoffeln","Zwiebeln","Karotten","Paprika",
      "Hackfleisch","Hähnchen","Wurst","Schinken","Lachs",
      "Nudeln","Reis","Mehl","Zucker","Öl","Tomaten in der Dose","Müsli","Brot","Brötchen",
      "Schokolade","Kekse","Chips",
      "Wasser","Saft","Kaffee","Tee",
      "Bier","Wein",
      "Toilettenpapier","Küchenrolle","Deo","Zahnpasta","Spülmittel","Müllbeutel klein","Müllbeutel groß","Gummihandschuhe",
      "Milch","Butter","Eier","Joghurt","Quark","Sahne","Käse",
      "TK-Pizza","TK-Gemüse"],
    ideenKategorien: ["Urlaubsort/Ziel","Kaufen","Aktivität","Restaurant","Sonstiges"],
    wohnmobil: [
      {kat:"Fahrzeugtechnik",pkte:["Reifendruck geprüft","Ölstand","Gas abgedreht","Außenspiegel eingestellt","Stützen eingefahren"]},
      {kat:"Innenraum",pkte:["Kühlschrank","Fenster geschlossen","Dachluken zu","lose Gegenstände verstaut","Türen verriegelt"]},
      {kat:"Versorgung",pkte:["Frischwasser gefüllt","Abwasser geleert","Strom getrennt","Markise eingefahren"]},
      {kat:"Dokumente",pkte:["Führerschein","Fahrzeugschein","Stellplatzbestätigung","Versicherungskarte"]},
      {kat:"Sicherheit",pkte:["Verbandskasten","Feuerlöscher","Warndreieck","Gaswarnmelder"]},
    ],
    wohnmobilCheck: {},
    _sync: now(),
  };
}

function load(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); return d || seed(); }
  catch { return seed(); }
}
function save(){
  DB._sync = now();
  localStorage.setItem(KEY, JSON.stringify(DB));
  if(window.Sync) Sync.scheduleSave();
}
let DB = load();
// Migrationen für fehlende Felder
if(!DB.nutzer) DB.nutzer = ["Ellen","Alexander","Julia","Isabella"];
if(!DB.listen) DB.listen = [{id:uid(),name:"Allgemein",artikel:[],createdAt:now(),updatedAt:now()}];
if(!DB.ideenKategorien) DB.ideenKategorien = ["Urlaubsort/Ziel","Kaufen","Aktivität","Restaurant","Sonstiges"];
if(!DB.todoListen) DB.todoListen = [];
if(!DB.rezepte) DB.rezepte = [];
// Reparatur: Städte, deren Name versehentlich ein Link ist
(DB.urlaub||[]).forEach(r=>{
  (r.staedte||[]).forEach(c=>{
    if(typeof c.name==="string" && /^https?:\/\//.test(c.name.trim())){
      if(!c.link) c.link = c.name.trim();
      c.name = "Unbenannter Ort";   // bitte über „Bearbeiten" benennen
    }
  });
});

const initials = n => (n||"?").trim().slice(0,1).toUpperCase();

// ---- Foto: nativ (Capacitor) oder Web-Datei-Dialog ----
function pickPhoto(useCamera, cb){
  // Native App? Dann echte Kamera/Galerie via Capacitor.
  if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()){
    pickPhotoNative(useCamera, cb);
    return;
  }
  // Web-Fallback: Datei-Dialog (bietet auf dem Handy Kamera/Galerie an)
  const inp = document.getElementById("photoInput");
  inp.value = "";
  if(useCamera) inp.setAttribute("capture","environment"); else inp.removeAttribute("capture");
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = e => downscale(e.target.result, cb);
    r.readAsDataURL(f);
  };
  inp.click();
}
async function pickPhotoNative(useCamera, cb){
  try{
    const { Camera } = window.Capacitor.Plugins;
    const photo = await Camera.getPhoto({
      quality: 75, resultType: "dataUrl", allowEditing: false,
      source: useCamera ? "CAMERA" : "PHOTOS",
      saveToGallery: false
    });
    downscale(photo.dataUrl, cb);
  }catch(e){ /* Nutzer hat abgebrochen */ }
}
function downscale(dataUrl, cb){
  const img = new Image();
  img.onload = () => {
    const max = 1000, sc = Math.min(1, max/Math.max(img.width,img.height));
    const c = document.createElement("canvas");
    c.width = img.width*sc; c.height = img.height*sc;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg",0.75));
  };
  img.src = dataUrl;
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function empty(ic,txt){ return `<div class="empty"><div class="ei">${ICON[ic]||""}</div>${txt}</div>`; }
function mapsLink(addr){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(addr); }
// Schneidet alles vor dem ersten http(s):// ab und liefert einen sauberen Link – oder "" wenn keiner drin ist.
function cleanLink(text){
  if(!text) return "";
  const m = String(text).match(/https?:\/\/\S+/);
  return m ? m[0] : "";
}
// Liefert das beste Ziel zum Öffnen: echter Link bevorzugt, sonst Maps-Suche aus Adresse/Koordinaten/Name.
function openTarget(obj){
  const lk = cleanLink(obj.link);
  if(lk) return lk;
  if(obj.adresse) return mapsLink(obj.adresse);
  if(obj.lat!=null) return mapsLink(obj.lat+","+obj.lon);
  if(obj.name) return mapsLink(obj.name);
  return "";
}
function fmtDate(iso){ if(!iso)return ""; const d=new Date(iso); return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function daysUntil(iso){ if(!iso)return null; const d=new Date(iso); d.setHours(0,0,0,0); const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }

// ---- Kalender-Export ----
// Google-Kalender-Link für einen einzelnen Termin (ganztägig oder mit Zeitraum).
function gcalLink(titel, startISO, endISO, details){
  const fmt = d => { const x=new Date(d); return x.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z"; };
  const fmtDay = d => { const x=new Date(d); return x.getFullYear()+String(x.getMonth()+1).padStart(2,"0")+String(x.getDate()).padStart(2,"0"); };
  let dates;
  if(startISO && startISO.length<=10){ // reines Datum -> ganztägig
    const end = endISO ? new Date(endISO) : new Date(startISO);
    end.setDate(end.getDate()+1); // Google: Enddatum exklusiv
    dates = fmtDay(startISO)+"/"+fmtDay(end);
  } else {
    const s = startISO ? fmt(startISO) : fmt(new Date());
    const e = endISO ? fmt(endISO) : fmt(new Date(new Date(startISO||Date.now()).getTime()+3600000));
    dates = s+"/"+e;
  }
  const p = new URLSearchParams({ action:"TEMPLATE", text:titel||"Termin", dates, details:details||"" });
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
// ICS-Datei (für mehrere Termine / universellen Import) als Download
function downloadICS(events, filename){
  const pad=n=>String(n).padStart(2,"0");
  const dt=d=>{const x=new Date(d);return x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate());};
  const dtStamp=()=>{const x=new Date();return x.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";};
  let ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FamilieNadig//DE\r\nCALSCALE:GREGORIAN\r\n";
  events.forEach(ev=>{
    const endExcl=ev.end?new Date(ev.end):new Date(ev.start);
    endExcl.setDate(endExcl.getDate()+1);
    ics+="BEGIN:VEVENT\r\n";
    ics+="UID:"+(ev.uid||uid())+"@familienadig\r\n";
    ics+="DTSTAMP:"+dtStamp()+"\r\n";
    ics+="DTSTART;VALUE=DATE:"+dt(ev.start)+"\r\n";
    ics+="DTEND;VALUE=DATE:"+dt(endExcl)+"\r\n";
    ics+="SUMMARY:"+(ev.titel||"Termin").replace(/[\r\n,;]/g," ")+"\r\n";
    if(ev.details) ics+="DESCRIPTION:"+ev.details.replace(/[\r\n]/g," ").replace(/[,;]/g," ")+"\r\n";
    ics+="END:VEVENT\r\n";
  });
  ics+="END:VCALENDAR";
  const blob=new Blob([ics],{type:"text/calendar"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=(filename||"termine")+".ics";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// nächste Reise für Countdown
function nextTrip(){
  const fut = DB.urlaub
    .filter(u=>u.von && daysUntil(u.von)>=0)
    .sort((a,b)=>new Date(a.von)-new Date(b.von));
  return fut[0] || null;
}

function renderHome(){
  // Countdown
  const slot = document.getElementById("countdownSlot");
  const trip = nextTrip();
  if(trip){
    const d = daysUntil(trip.von);
    slot.innerHTML = `<div class="countdown" onclick="open_('urlaub')">
      <div class="big">${d===0?"Heute":d}</div>
      <div><div class="ct-tx">${d===0?"Es geht los:":"Tage bis"}</div>
      <div class="ct-nm">${esc(trip.titel||trip.ziel||"nächste Reise")}</div></div></div>`;
  } else slot.innerHTML = "";
  // "Für dich": dringende/bald fällige offene Aufgaben der angemeldeten Person
  renderFuerDich();
  // Kacheln
  document.getElementById("tiles").innerHTML = MODULES.map(m=>`
    <div class="tile" onclick="open_('${m.id}')">
      <div class="ic">${m.ic}</div>
      <div><div class="nm">${m.nm}</div><div class="ct">${m.count()}</div></div>
    </div>`).join("");
}
function renderFuerDich(){
  let slot = document.getElementById("fuerDichSlot");
  if(!slot){
    slot = document.createElement("div"); slot.id="fuerDichSlot";
    document.getElementById("countdownSlot").after(slot);
  }
  // relevante Aufgaben: mir zugewiesen ODER von mir, offen, und (überfällig | ≤3 Tage | Priorität hoch)
  const relevant = DB.todos.filter(t=>{
    if(t.done) return false;
    const mir = (t.wer===ME) || (!t.wer && t.autor===ME);
    if(!mir) return false;
    const d = t.faellig ? daysUntil(t.faellig) : null;
    return (d!==null && d<=3) || t.prio==="hoch";
  }).sort((a,b)=>{
    const da=a.faellig?daysUntil(a.faellig):999, db=b.faellig?daysUntil(b.faellig):999;
    return da-db;
  });
  if(!relevant.length){ slot.innerHTML=""; return; }
  slot.innerHTML = `<div class="fd-head">Für dich, ${esc(ME)}</div>
    <div class="fd-list">${relevant.slice(0,5).map(t=>{
      const d = t.faellig?daysUntil(t.faellig):null;
      const when = d===null?"" : d<0?"überfällig" : d===0?"heute" : d===1?"morgen" : "in "+d+" Tagen";
      const urgent = (d!==null&&d<=0) || t.prio==="hoch";
      const listLink = t.listeId && DB.listen.find(l=>l.id===t.listeId);
      return `<div class="fd-item ${urgent?'urgent':''}" onclick="${listLink?`oeffneListe('${t.listeId}')`:`open_('todos')`}">
        <div class="fd-dot ${urgent?'u':''}"></div>
        <div class="fd-tx"><div class="fd-titel">${esc(t.titel)}</div>
          <div class="fd-meta">${when}${t.prio==="hoch"?" · dringend":""}${listLink?" · "+esc(DB.listen.find(l=>l.id===t.listeId).name):""}</div></div>
        ${listLink?`<div class="fd-go">${ICON.cart}</div>`:`<div class="fd-go">›</div>`}
      </div>`;
    }).join("")}</div>`;
}

window.segPick = el => { el.parentNode.querySelectorAll(".opt").forEach(o=>o.classList.remove("on")); el.classList.add("on"); };
window.whoPick = el => {
  const on = el.classList.contains("on");
  el.parentNode.querySelectorAll(".w").forEach(o=>o.classList.remove("on"));
  if(!on) el.classList.add("on");
};
function renderFotoSlot(){
  const slot = document.getElementById("fotoSlot"); if(!slot) return;
  if(window._formFoto){
    slot.innerHTML = `<div class="photo-thumb"><img src="${window._formFoto}">
      <button class="rm" onclick="window._formFoto='';renderFotoSlot()">×</button></div>`;
  } else {
    slot.innerHTML = `<div class="photo-pick">
      <button onclick="pickPhoto(true,d=>{window._formFoto=d;renderFotoSlot()})">${ICON.cam}Kamera</button>
      <button onclick="pickPhoto(false,d=>{window._formFoto=d;renderFotoSlot()})">${ICON.image}Galerie</button></div>`;
  }
}
window.saveAufgabe = (typ, id) => {
  const titel = document.getElementById("f_titel").value.trim(); if(!titel) return;
  const prioEl = document.querySelector("#f_prio .opt.on");
  const werEl = document.querySelector("#f_wer .w.on");
  const obj = {
    titel,
    notiz: document.getElementById("f_notiz").value.trim(),
    faellig: document.getElementById("f_faellig").value,
    prio: prioEl ? prioEl.dataset.v : "mittel",
    wer: werEl ? werEl.dataset.v : "",
    foto: window._formFoto || "",
    listeId: (document.getElementById("f_liste") ? document.getElementById("f_liste").value : "") || "",
    updatedAt: now(),
  };
  const arr = typ==="todo" ? DB.todos : DB.reparaturen;
  if(id){ const ex = arr.find(x=>x.id===id); Object.assign(ex, obj); }
  else { arr.push({id:uid(), done:false, autor:ME, createdAt:now(), ...obj}); }
  save(); closeModal();
  typ==="todo" ? RENDER.todos() : RENDER.reparaturen();
};

  return `<div class="card ${e.done?'done':''}">
    <div class="cdel" onclick="delAufgabe('${typ}','${e.id}')">×</div>
    <div class="ch">
      <div class="cbx ${e.done?'on':''}" onclick="toggleAufgabe('${typ}','${e.id}')">${e.done?'✓':''}</div>
      <div style="flex:1" onclick="editAufgabe('${typ}','${e.id}')">
        <div class="cttl">${esc(e.titel)}</div>
        ${e.notiz?`<div class="cdesc">${esc(e.notiz)}</div>`:""}
        ${e.foto?`<img class="cphoto" src="${e.foto}">`:""}
        <div class="cmeta">
          ${e.faellig?`<span class="pill due ${over?'over':''}">${ICON.checklist} ${over?'überfällig ':''}${fmtDate(e.faellig)}</span>`:""}
          <span class="pill prio-${e.prio||'mittel'}">${(e.prio||'mittel').toUpperCase()}</span>

function foodIcon(name){ for(const [re,ic] of FOOD_ICONS) if(re.test(name)) return ic; return "🛒"; }
// Welche Warengruppe? Gibt den Index zurück (für Sortierung), sonst hoch (ans Ende).
function warenGruppeIndex(name){
  // Sonderfall: alles mit "Dose/Konserve/in der ..." zuerst zu Konserven
  if(/dose|konserve|in der dose|eingelegt|passierte/i.test(name)){
    const ki=WARENGRUPPEN.findIndex(g=>g.key==="konserven"); if(ki>=0)return ki;
  }
  for(let i=0;i<WARENGRUPPEN.length;i++) if(WARENGRUPPEN[i].match.test(name)) return i;
  return WARENGRUPPEN.length;
}
function warenGruppeTitel(name){
  const i=warenGruppeIndex(name);
  return i<WARENGRUPPEN.length ? WARENGRUPPEN[i].titel : "Sonstiges";
}

RENDER.einkauf = () => {

  // Stammartikel nach Warengruppe gruppieren (in definierter Reihenfolge)
  const grouped = {};
  DB.einkaufStamm.forEach(s=>{ const t=warenGruppeTitel(s); (grouped[t]=grouped[t]||[]).push(s); });
  const ordered = [...WARENGRUPPEN.map(g=>g.titel), "Sonstiges"].filter(t=>grouped[t]);

  const offen = liste.artikel.filter(a=>!a.d).sort((a,b)=>warenGruppeIndex(a.tx)-warenGruppeIndex(b.tx));

  vBody().innerHTML =

       <div class="list">${offen.map(einRow).join("")}${erledigt.map(einRow).join("")}</div>` : empty("cart","Liste ist leer"));

// ============================================================
//  Geo-Hilfen: Adresse -> Koordinaten, Routing (kostenlos)
// ============================================================
// Google-Teilen-Links auflösen wir nicht serverseitig (CORS),
// aber wir extrahieren Koordinaten, falls im Link enthalten,
// sonst wird der Klartext an Nominatim geschickt.
function parseGeo(input){
  const s = (input||"").trim();
  // @lat,lng  oder  /lat,lng  in Google-Links
  let m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || s.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/)
       || s.match(/(-?\d+\.\d{3,}),\s*(-?\d+\.\d{3,})/);
  if(m) return { lat:parseFloat(m[1]), lon:parseFloat(m[2]), label:null, raw:s };
  return { lat:null, lon:null, label:s, raw:s };
}
async function geocode(text){
  // bereits Koordinaten?
  const g = parseGeo(text);
  if(g.lat!=null) return { lat:g.lat, lon:g.lon, name:text };
  // Nominatim (OpenStreetMap) – kostenlos. Sprache als URL-Parameter,
  // KEIN Custom-Header (würde CORS-Preflight auslösen und scheitern).
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=de&q="+encodeURIComponent(g.label);
  const r = await fetch(url);
  if(!r.ok) throw new Error("Geocoding fehlgeschlagen");
  const j = await r.json();
  if(!j.length) throw new Error("Adresse nicht gefunden");
  return { lat:parseFloat(j[0].lat), lon:parseFloat(j[0].lon), name:j[0].display_name.split(",")[0] };
}
// Routing zwischen zwei Punkten. Standard: OSRM (kostenlos, PKW).
// Optional: OpenRouteService mit Schlüssel -> Wohnmobil-Profil (hgv).
async function routeBetween(a, b){
  const orsKey = localStorage.getItem("familienapp.orsKey");
  if(orsKey){
    const url = "https://api.openrouteservice.org/v2/directions/driving-hgv";
    const r = await fetch(url, { method:"POST",
      headers:{ "Authorization":orsKey, "Content-Type":"application/json" },
      body: JSON.stringify({ coordinates:[[a.lon,a.lat],[b.lon,b.lat]] }) });
    if(r.ok){ const j=await r.json(); const sum=j.routes[0].summary;
      return { km: sum.distance/1000, min: sum.duration/60, profil:"Wohnmobil" }; }
  }
  // OSRM-Demo (PKW)
  const url = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;
  const r = await fetch(url);
  if(!r.ok) throw new Error("Route fehlgeschlagen");
  const j = await r.json();
  if(!j.routes || !j.routes.length) throw new Error("keine Route");
  return { km: j.routes[0].distance/1000, min: j.routes[0].duration/60, profil:"PKW" };
}
function fmtDauer(min){ const h=Math.floor(min/60), m=Math.round(min%60); return h?`${h} h ${m} min`:`${m} min`; }

let URLAUB_ARCHIV = false;
RENDER.urlaub = () => {
  // Eine Reise ist "vergangen", wenn ihr Bis-Datum (sonst Von) vor heute liegt
  const istVergangen = u => {
    const ref = u.bis || u.von; if(!ref) return false;
    return daysUntil(ref) < 0;
  };
  const aktiv = DB.urlaub.filter(u=>!istVergangen(u));
  const archiv = DB.urlaub.filter(istVergangen);
  const liste = (URLAUB_ARCHIV ? archiv : aktiv).sort((a,b)=>{
    if(!a.von)return 1; if(!b.von)return -1;
    return URLAUB_ARCHIV ? new Date(b.von)-new Date(a.von) : new Date(a.von)-new Date(b.von);
  });
  setHead("Urlaubsplanung", (URLAUB_ARCHIV?archiv.length+" archiviert":aktiv.length+" geplant"), {label:"⚙︎", fn:routingSettings});
  let html = `<div class="seg" style="margin:0 16px 12px">
    <div class="opt ${!URLAUB_ARCHIV?'on':''}" onclick="urlaubTab(false)">Geplant${aktiv.length?" ("+aktiv.length+")":""}</div>
    <div class="opt ${URLAUB_ARCHIV?'on':''}" onclick="urlaubTab(true)">Archiv${archiv.length?" ("+archiv.length+")":""}</div></div>`;
  html += liste.length
    ? `<div class="list">${liste.map(reiseKarte).join("")}</div>`
    : empty("plane", URLAUB_ARCHIV?"Noch keine vergangenen Reisen":"Noch keine Reise geplant");
  vBody().innerHTML = html;
  if(!URLAUB_ARCHIV) showFab(()=>openReise(null)); else document.getElementById("fab").style.display="none";
};
window.urlaubTab = a => { URLAUB_ARCHIV=a; RENDER.urlaub(); };
function reiseKarte(u){
  const d = daysUntil(u.von);
  const badge = (d!==null && d>=0) ? `<span class="pill who">${d===0?"heute":"in "+d+" Tagen"}</span>` : "";
  const orte = (u.staedte||[]).map(s=>s.name).join(" · ");
  return `<div class="card" onclick="openReiseDetail('${u.id}')">
    <div class="cttl">${esc(u.titel||"Reise")}</div>
    <div class="cmeta">
      <span class="pill cat">${u.art==="tour"?"Tour":"Trip"}</span>
      ${u.unterkunft==="wohnmobil"?'<span class="pill cat">Wohnmobil</span>':'<span class="pill cat">Hotel</span>'}
      ${badge}</div>
    ${(u.von||u.bis)?`<div class="cdesc">${fmtDate(u.von)}${u.bis?" – "+fmtDate(u.bis):""}</div>`:""}
    ${orte?`<div class="cdesc">${esc(orte)}</div>`:""}
    ${u.autor?`<div class="byline">angelegt von ${esc(u.autor)}</div>`:""}
  </div>`;
}

function renderLeg(r,i){
  const a=r.staedte[i], b=r.staedte[i+1];
  r._legs = r._legs||{};
  const key = a.lat+","+a.lon+">"+b.lat+","+b.lon;
  const cached = r._legs[key];
  let info;
  if(a.lat==null||b.lat==null) info = `<span class="linfo">Etappe nicht berechenbar – Koordinaten fehlen</span>`;
  else if(cached==="err") info = `<span class="linfo" id="leg_${i}" onclick="calcLeg('${r.id}',${i})" style="cursor:pointer;color:var(--accent)">Berechnung fehlgeschlagen – erneut ›</span>`;
  else if(cached) info = `<span class="linfo">${ICON.car} ${cached.km.toFixed(0)} km · ${fmtDauer(cached.min)} <small>(${cached.profil})</small></span>`;
  else info = `<span class="linfo" id="leg_${i}" style="color:var(--ink2)">berechne…</span>`;
  return `<div class="leg"><div class="lline"></div>${info}<div class="lline"></div></div>`;
}
// Alle noch nicht berechneten Etappen automatisch nacheinander rechnen
window.autoCalcLegs = async rid => {
  const r=DB.urlaub.find(x=>x.id===rid); if(!r||!r.staedte)return;
  for(let i=0;i<r.staedte.length-1;i++){
    const a=r.staedte[i], b=r.staedte[i+1];
    if(a.lat==null||b.lat==null) continue;
    const key=a.lat+","+a.lon+">"+b.lat+","+b.lon;
    if(r._legs && r._legs[key] && r._legs[key]!=="err") continue;
    try{
      const res=await routeBetween(a,b);
      r._legs=r._legs||{}; r._legs[key]=res;
    }catch(e){ r._legs=r._legs||{}; r._legs[key]="err"; }
    if(CURRENT==="urlaub" && DETAIL_OPEN===rid) renderReiseDetail(r);
  }
};
window.calcLeg = async (rid,i) => {
  const r=DB.urlaub.find(x=>x.id===rid); const a=r.staedte[i], b=r.staedte[i+1];
  const el=document.getElementById("leg_"+i); if(el)el.textContent="berechne…";
  const key=a.lat+","+a.lon+">"+b.lat+","+b.lon;
  try{
    const res = await routeBetween(a,b);
    r._legs = r._legs||{}; r._legs[key] = res;
    renderReiseDetail(r);
  }catch(e){ r._legs=r._legs||{}; r._legs[key]="err"; renderReiseDetail(r); }
};

// Drag&Drop Sortierung (nur Tour)
function enableCityDrag(r){
  const list=document.getElementById("cityList"); if(!list)return;
  let dragIdx=null;
  list.querySelectorAll(".cdrag").forEach(h=>{
    const card=h.closest(".city");
    h.addEventListener("pointerdown", e=>{
      e.preventDefault(); dragIdx=+h.dataset.drag; card.classList.add("dragging");
      const move=ev=>{
        const el=document.elementFromPoint(ev.clientX,ev.clientY);
        const tc=el&&el.closest(".city"); list.querySelectorAll(".city").forEach(c=>c.classList.remove("drop-target"));
        if(tc&&tc!==card) tc.classList.add("drop-target");
      };
      const up=ev=>{
        document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up);
        card.classList.remove("dragging");
        const el=document.elementFromPoint(ev.clientX,ev.clientY);
        const tc=el&&el.closest(".city");
        list.querySelectorAll(".city").forEach(c=>c.classList.remove("drop-target"));
        if(tc&&tc!==card){ const to=+tc.dataset.i;
          const [m]=r.staedte.splice(dragIdx,1); r.staedte.splice(to,0,m);
          r._legs={}; r.updatedAt=now(); save(); renderReiseDetail(r); }
      };
      document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
    });
  });
}

        <select id="rz_kat">${REZEPT_KATEGORIEN.map(k=>`<option ${r.kategorie===k?'selected':''}>${esc(k)}</option>`).join("")}</select></div>
      <div style="flex:1"><label>Art</label>
        <select id="rz_einst"><option value="">—</option><option value="leicht" ${r.einstufung==='leicht'?'selected':''}>leicht</option><option value="herzhaft" ${r.einstufung==='herzhaft'?'selected':''}>herzhaft</option></select></div></div>
    <div class="fld"><label>Link (optional)</label>
      <textarea id="rz_link" rows="2" placeholder="https://… (Text davor wird automatisch entfernt)">${esc(r.link||"")}</textarea></div>
    ${lk?`<a class="maplink" href="${esc(lk)}" target="_blank" rel="noopener" style="margin-bottom:12px">${ICON.link} Rezept öffnen</a>`:""}
    <div class="fld"><label>Zutaten</label><div id="zutatenSlot"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input id="rz_zutat" placeholder="Zutat, z.B. 500 g Hackfleisch" style="flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:14px" enterkeyhint="done">
        <button class="addbtn" style="position:static" onclick="addZutat()">+</button></div></div>
    <div class="fld"><label>Zubereitung</label>
      <textarea id="rz_zub" rows="5" placeholder="Schritt für Schritt…">${esc(r.zubereitung||"")}</textarea></div>
    <button class="btn" onclick="saveRezept()">Speichern</button>
    ${!r.neu?`<button class="btn ghost" onclick="zutatenZuEinkauf('${r.id}')">${ICON.cart} Zutaten zur Einkaufsliste</button>
      <button class="btn danger" onclick="delRezept('${r.id}')">Rezept löschen</button>`:""}`);
  const inp=document.getElementById("rz_zutat");
  if(inp) inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addZutat();}});
}
function renderZutaten(){
  const el=document.getElementById("zutatenSlot"); if(!el)return;
  el.innerHTML = REZEPT.zutaten.length
    ? REZEPT.zutaten.map((z,i)=>`<div class="itemrow"><div class="it">${esc(z)}</div><div class="del" onclick="rmZutat(${i})">×</div></div>`).join("")
    : `<div style="color:var(--ink2);font-size:13px;padding:4px 0">Noch keine Zutaten</div>`;
}
window.addZutat = () => { const inp=document.getElementById("rz_zutat"); const v=inp.value.trim(); if(!v)return; REZEPT.zutaten.push(v); inp.value=""; renderZutaten(); inp.focus(); };
window.rmZutat = i => { REZEPT.zutaten.splice(i,1); renderZutaten(); };
window.saveRezept = () => {
  REZEPT.titel = document.getElementById("rz_titel").value.trim() || "Rezept";
  REZEPT.kategorie = document.getElementById("rz_kat").value;
  REZEPT.einstufung = document.getElementById("rz_einst").value;
  REZEPT.link = cleanLink(document.getElementById("rz_link").value);   // ab https: starten
  REZEPT.zubereitung = document.getElementById("rz_zub").value.trim();
  REZEPT.updatedAt = now();
  if(REZEPT.neu){ delete REZEPT.neu; REZEPT.autor=ME; REZEPT.createdAt=now(); DB.rezepte.push(REZEPT); }
  else { const ex=DB.rezepte.find(x=>x.id===REZEPT.id); Object.assign(ex,REZEPT); }
  save(); closeModal(); RENDER.rezepte();
};
window.delRezept = id => { if(confirm("Rezept löschen?")){ DB.rezepte=DB.rezepte.filter(x=>x.id!==id); save(); closeModal(); RENDER.rezepte(); } };

// Zutaten auswählen und in gewählte Einkaufsliste übernehmen
window.zutatenZuEinkauf = id => {
  const r = DB.rezepte.find(x=>x.id===id); if(!r || !r.zutaten.length){ alert("Keine Zutaten vorhanden."); return; }
  window._zSel = new Set(r.zutaten.map((_,i)=>i));  // alle vorausgewählt
  openSheet(zutatenAuswahlHtml(r));
};
function zutatenAuswahlHtml(r){
  return `<h3>Zutaten übernehmen</h3><div class="ml">Auswählen und Ziel-Liste bestimmen</div>
    <div class="fld"><label>Ziel-Einkaufsliste</label>
      <select id="z_ziel">${DB.listen.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join("")}</select></div>
    <div class="fld"><label>Zutaten</label>
      <div id="zauswahl">${r.zutaten.map((z,i)=>`
        <div class="row" style="margin-bottom:6px" onclick="toggleZ(${i})">
          <div class="cb on" id="zcb_${i}">✓</div><div class="tx">${esc(z)}</div></div>`).join("")}</div></div>
    <button class="btn" onclick="commitZutaten('${r.id}')">Ausgewählte hinzufügen</button>`;
}
window.toggleZ = i => {
  const cb=document.getElementById("zcb_"+i);
  if(window._zSel.has(i)){ window._zSel.delete(i); cb.classList.remove("on"); cb.textContent=""; }
  else { window._zSel.add(i); cb.classList.add("on"); cb.textContent="✓"; }
};
window.commitZutaten = id => {
  const r=DB.rezepte.find(x=>x.id===id);
  const zielId=document.getElementById("z_ziel").value;
  const liste=DB.listen.find(l=>l.id===zielId); if(!liste)return;
  let n=0;
  r.zutaten.forEach((z,i)=>{ if(window._zSel.has(i)){
    liste.artikel.push({id:uid(),tx:z,menge:"",d:false,createdAt:now(),updatedAt:now()}); n++; }});
  liste.updatedAt=now(); save(); closeModal();
  alert(n+" Zutat(en) zu „"+liste.name+"“ hinzugefügt.");
};

// ============================================================
//  OneDrive-Synchronisation (Microsoft Graph, PKCE)
// ============================================================
window.Sync = (() => {
  const CLIENT_ID = "5459e1ad-51b7-4d2c-8470-f3869baabcfb";
  const SCOPES = ["Files.ReadWrite", "User.Read"];
  const FOLDER = "FamilienApp";
  const GRAPH = "https://graph.microsoft.com/v1.0";
  const LISTEN = ["todos","todoListen","reparaturen","urlaub","ideen","keller","listen","rezepte"];
  const OBJEKTE = ["nutzer","einkaufStamm","ideenKategorien","wohnmobil","wohnmobilCheck"];
  let app=null, account=null, saveTimer=null, busy=false, online=false, pollTimer=null, _lastSync=null;

  function setStatus(t,ok){ const e=document.getElementById("syncTxt"); if(e)e.textContent=t;
    const d=document.querySelector(".sync .dot"); if(d)d.style.background=ok?"var(--ok)":"var(--ink2)"; }

  async function start(){
    if(!window.msal){ setStatus("Nur lokal", false); return; }
    app = new window.msal.PublicClientApplication({
      auth:{ clientId:CLIENT_ID, authority:"https://login.microsoftonline.com/consumers", redirectUri:location.origin+location.pathname },
      cache:{ cacheLocation:"localStorage" },
    });
    await app.initialize();
    try{ const r=await app.handleRedirectPromise(); if(r&&r.account)account=r.account; }catch(e){console.warn(e);}
    const a=app.getAllAccounts(); if(!account&&a.length)account=a[0];
    if(account){ online=true; setStatus("Verbunden",true); await fullSync(); startPolling(); }
    else setStatus("Antippen zum Anmelden", false);
  }
  async function login(){
    if(!app){ alert("Anmeldung offline nicht möglich."); return; }
    try{ const r=await app.loginPopup({scopes:SCOPES}); account=r.account; online=true; setStatus("Verbunden",true); await fullSync(); startPolling(); }
    catch(e){ try{ await app.loginRedirect({scopes:SCOPES}); }catch(e2){ alert("Anmeldung fehlgeschlagen: "+e2.message); } }
  }
  async function logout(){ if(app&&account)await app.logoutPopup({account}); account=null; online=false; setStatus("Abgemeldet",false); }
  async function token(){ if(!app||!account)throw new Error("nicht angemeldet");
    try{ return (await app.acquireTokenSilent({scopes:SCOPES,account})).accessToken; }
    catch(e){ const r=await app.acquireTokenPopup({scopes:SCOPES}); account=r.account; return r.accessToken; } }
  async function readFile(name){ const t=await token();
    const r=await fetch(`${GRAPH}/me/drive/root:/${FOLDER}/${name}:/content`,{headers:{Authorization:"Bearer "+t}});
    if(r.status===404)return null; if(!r.ok)throw new Error("Lesen "+r.status);
    try{ return JSON.parse(await r.text()); }catch{ return null; } }
  async function writeFile(name,data){ const t=await token();
    const r=await fetch(`${GRAPH}/me/drive/root:/${FOLDER}/${name}:/content`,{method:"PUT",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify(data)});
    if(!r.ok)throw new Error("Schreiben "+r.status); return true; }
  function mergeListe(lokal=[],fern=[]){ const m=new Map();
    for(const e of lokal)if(e&&e.id)m.set(e.id,e);
    for(const e of fern){ if(!e||!e.id)continue; const d=m.get(e.id);
      if(!d||new Date(e.updatedAt||0)>new Date(d.updatedAt||0))m.set(e.id,e); }
    return [...m.values()].filter(e=>!e.deleted); }
  // POI-Listen einer Stadt eintragsweise zusammenführen (id-basiert, sonst nach Name)
  function mergePois(lokal=[],fern=[]){
    const m=new Map();
    const keyOf=p=>p.id||("n:"+(p.name||"")+(p.adresse||""));
    for(const p of lokal) m.set(keyOf(p),p);
    for(const p of fern){ const k=keyOf(p); if(!m.has(k)) m.set(k,p); }
    return [...m.values()];
  }
  // Reisen tief mergen: gleiche Reise -> Städte & deren POIs zusammenführen statt überschreiben
  function mergeReisen(lokal=[],fern=[]){
    const m=new Map();
    for(const r of lokal) if(r&&r.id) m.set(r.id,r);
    for(const fr of fern){ if(!fr||!fr.id)continue;
      const lr=m.get(fr.id);
      if(!lr){ m.set(fr.id,fr); continue; }
      // jüngere Grunddaten gewinnen
      const base = new Date(fr.updatedAt||0)>new Date(lr.updatedAt||0) ? {...fr} : {...lr};
      // Städte zusammenführen
      const cityMap=new Map();
      (lr.staedte||[]).forEach(c=>cityMap.set(c.id||c.name,{...c}));
      (fr.staedte||[]).forEach(c=>{ const k=c.id||c.name; const ex=cityMap.get(k);
        if(!ex){ cityMap.set(k,{...c}); }
        else { // POIs jeder Gruppe mergen
          ["stellplaetze","sehens","restaurants"].forEach(g=>{ ex[g]=mergePois(ex[g]||[], c[g]||[]); });
          if(new Date(c.updatedAt||0)>new Date(ex.updatedAt||0)){ ex.name=c.name; ex.lat=c.lat; ex.lon=c.lon; ex.link=c.link; ex.plz=c.plz; ex.land=c.land; }
        }
      });
      base.staedte=[...cityMap.values()];
      // Packliste eintragsweise
      base.packliste = mergePois(lr.packliste||[], fr.packliste||[]);
      m.set(fr.id, base);
    }
    return [...m.values()].filter(r=>!r.deleted);
  }
  async function fullSync(){ if(!online||busy)return; busy=true; setStatus("Synchronisiere…",true);
    try{
      const fern=(await readFile("daten.json"))||{};
      for(const k of LISTEN){
        if(k==="urlaub") DB.urlaub = mergeReisen(DB.urlaub||[], fern.urlaub||[]);
        else DB[k]=mergeListe(DB[k]||[], fern[k]||[]);
      }
      if(fern._sync && new Date(fern._sync)>new Date(DB._sync||0))
        for(const k of OBJEKTE) if(fern[k]!==undefined) DB[k]=fern[k];
      localStorage.setItem(KEY,JSON.stringify(DB));
      await writeFile("daten.json", DB);
      _lastSync = new Date();
      setStatus("Verbunden",true);
      if(CURRENT&&RENDER[CURRENT]&&!DETAIL_OPEN)RENDER[CURRENT](); else if(ME&&!CURRENT)renderHome();
    }catch(e){ console.warn("Sync:",e); setStatus("Sync-Fehler",false); }
    finally{ busy=false; } }
  function scheduleSave(){ if(!online)return; clearTimeout(saveTimer); setStatus("Speichere…",true); saveTimer=setTimeout(()=>fullSync(),1200); }
  function startPolling(){ clearInterval(pollTimer); pollTimer=setInterval(()=>{if(!busy)fullSync();},20000);
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&online&&!busy)fullSync(); }); }
  return { start, login, logout, scheduleSave, fullSync, isOnline:()=>online,
    lastSync:()=> _lastSync ? _lastSync.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) : null };
})();

window.syncTap = () => {
  if(Sync.isOnline()){
    const last = Sync.lastSync();
    openSheet(`<h3>Synchronisierung</h3>
      <div class="ml">Alle Familienmitglieder teilen denselben Stand über das gemeinsame Microsoft-Konto. Beim Abgleich wird nichts gelöscht – Einträge anderer bleiben erhalten und sind im Reise-Bereich farbig als „von …" markiert.</div>
      <div class="fld" style="background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:14px">
        <div style="font-size:13px;color:var(--ink2)">Status</div>
        <div style="font-weight:650">Verbunden${last?" · zuletzt "+last:""}</div></div>
      <button class="btn" onclick="Sync.fullSync();closeModal()">Jetzt abgleichen</button>
      <button class="btn ghost" onclick="Sync.logout();closeModal()">Von OneDrive abmelden</button>`);
  } else {
    openSheet(`<h3>Synchronisierung einrichten</h3>
      <div class="ml">Melde dich mit dem gemeinsamen Microsoft-Konto an, damit alle Handys denselben Stand sehen. Die Daten liegen geschützt in eurem OneDrive.</div>
      <button class="btn" onclick="closeModal();Sync.login()">Mit Microsoft anmelden</button>`);
  }
};

//  Start
// ============================================================
const _verEl = document.getElementById("verTxt");
if(_verEl) _verEl.textContent = "v"+APP_VERSION;
if(ME){
  document.getElementById("gate").style.display="none";
  document.getElementById("meAv").textContent=initials(ME);
  renderHome();
} else {
  renderGate();
}
Sync.start();
</script>

<script>
// ── PWA: Versions-Check + saubere Service-Worker-Bereinigung ──
(function(){
  // Alte Service Worker und Caches entfernen (vermeidet veraltete Stände)
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister().catch(()=>{}))).catch(()=>{});
  }
  if ('caches' in window) {
    caches.keys().then(ks=>ks.forEach(k=>caches.delete(k).catch(()=>{}))).catch(()=>{});
  }
  // Bei neuer App-Version einmalig hart neu laden
  try {
    const v = localStorage.getItem("familienapp.version");
    if (v && v !== APP_VERSION) { localStorage.setItem("familienapp.version", APP_VERSION); location.reload(); }
    else localStorage.setItem("familienapp.version", APP_VERSION);
  } catch(e){}
})();
</script>
