// Rezept direkt von einer Adresse holen.
// WICHTIG: Browser dürfen fremde Seiten nur abrufen, wenn diese es per
// CORS-Kopfzeile ausdrücklich erlauben. Die meisten Rezeptseiten tun das
// nicht – das ist eine Grenze des Browsers, kein Fehler der App. Deshalb
// erklärt die Fehlermeldung den funktionierenden Weg, statt nur zu scheitern.
window.rezImportVonUrl = async () => {
  const feld = document.getElementById("rz_url");
  const knopf = document.getElementById("rz_urlBtn");
  const url = sichereUrl((feld && feld.value) || "");
  if(!url){ toast("Bitte eine gültige Adresse eingeben (https://…)"); return; }
  knopf.disabled = true; knopf.textContent = "Lade…";
  try{
    const antwort = await holeMitZeitlimit(url, { mode:"cors", credentials:"omit" }, 12000);
    if(!antwort.ok) throw new Error("Status " + antwort.status);
    const text = await antwort.text();
    const erg = rezeptAusJsonLd(text) || rezeptAusMicrodata(text);
    if(erg && erg.zutaten.length){
      if(!erg.quelle) erg.quelle = url;
      rezeptUebernehmen(erg);
      return;
    }
    // Seite erreichbar, aber ohne maschinenlesbares Rezept: Text zum Prüfen anbieten
    const ta = document.getElementById("rz_import");
    if(ta){
      ta.value = text.replace(/<script[\s\S]*?<\/script>/gi," ")
                     .replace(/<style[\s\S]*?<\/style>/gi," ")
                     .replace(/<[^>]+>/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
    }
    toast("Kein strukturiertes Rezept gefunden – Text eingefügt, bitte „Aufteilen“ nutzen");
  }catch(e){
    Fehlerlog.erfasse("rezImportVonUrl", e);
    toast("Diese Seite erlaubt keinen direkten Abruf. Bitte die Seite öffnen, den Text kopieren und oben einfügen.");
  }finally{
    knopf.disabled = false; knopf.textContent = "Rezept von dieser Adresse holen";
  }
};

// ============================================================
//  Strukturierter Rezeptimport (schema.org/Recipe)
// ============================================================
// Nahezu alle Rezeptseiten (Chefkoch, Essen & Trinken, Lecker, AllRecipes …)
// betten ihr Rezept maschinenlesbar als JSON-LD nach schema.org/Recipe ein.
// Wird der SEITENQUELLTEXT eingefügt, lesen wir daraus Titel, Portionen,
// Zutaten und Zubereitung exakt aus – statt sie zu erraten.
// Enthält der eingefügte Text kein JSON-LD, greift danach die bisherige
// Heuristik für reinen Text.
function rezeptAusJsonLd(text){
  if(!text || text.indexOf("application/ld+json") === -1) return null;
  const treffer = [...text.matchAll(
    /<script[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi)];
  for(const m of treffer){
    let daten;
    try{ daten = JSON.parse(m[1].trim()); }catch(e){ continue; }
    const gefunden = findeRezept(daten);
    if(gefunden) return normalisiereRezept(gefunden);
  }
  return null;
}

// Rezept in verschachtelten JSON-LD-Strukturen aufspüren (@graph, Arrays …)
function findeRezept(knoten, tiefe){
  tiefe = tiefe || 0;
  if(!knoten || typeof knoten !== "object" || tiefe > 6) return null;
  if(Array.isArray(knoten)){
    for(const k of knoten){ const t = findeRezept(k, tiefe+1); if(t) return t; }
    return null;
  }
  const typ = knoten["@type"];
  const istRezept = typ === "Recipe" ||
    (Array.isArray(typ) && typ.includes("Recipe"));
  if(istRezept) return knoten;
  for(const feld of ["@graph","mainEntity","mainEntityOfPage","itemListElement"]){
    if(knoten[feld]){ const t = findeRezept(knoten[feld], tiefe+1); if(t) return t; }
  }
  return null;
}

// Löst HTML-Entitäten auf. Deutsche Rezeptseiten liefern Umlaute regelmäßig
// als &uuml; & Co. – ohne Auflösung stünde "w&uuml;rfeln" in der Zubereitung.
const ENTITAETEN = {
  nbsp:" ", amp:"&", lt:"<", gt:">", quot:'"', apos:"'",
  auml:"ä", ouml:"ö", uuml:"ü", Auml:"Ä", Ouml:"Ö", Uuml:"Ü", szlig:"ß",
  eacute:"é", egrave:"è", agrave:"à", ccedil:"ç", ntilde:"ñ",
  deg:"°", euro:"€", frac12:"½", frac14:"¼", frac34:"¾",
  ndash:"–", mdash:"—", hellip:"…", laquo:"«", raquo:"»",
  bdquo:"„", ldquo:"“", rdquo:"”", sbquo:"‚", lsquo:"‘", rsquo:"’",
  times:"×", middot:"·", bull:"•", shy:""
};
function entitaetenAufloesen(text){
  return String(text||"")
    // numerisch, dezimal und hexadezimal
    .replace(/&#(\d+);/g, (_,n) => {
      const c = parseInt(n,10);
      return (c>0 && c<1114112) ? String.fromCodePoint(c) : "";
    })
    .replace(/&#[xX]([0-9a-fA-F]+);/g, (_,h) => {
      const c = parseInt(h,16);
      return (c>0 && c<1114112) ? String.fromCodePoint(c) : "";
    })
    // benannte
    .replace(/&([a-zA-Z][a-zA-Z0-9]{1,9});/g,
      (treffer,name) => Object.prototype.hasOwnProperty.call(ENTITAETEN,name)
        ? ENTITAETEN[name] : treffer);
}

// Vereinheitlicht die sehr unterschiedlichen Ausprägungen des Formats
function normalisiereRezept(r){
  const text = v => {
    if(v == null) return "";
    if(typeof v === "string") return v;
    if(Array.isArray(v)) return v.map(text).filter(Boolean).join("\n");
    if(typeof v === "object") return text(v.text || v.name || v.itemListElement || "");
    return String(v);
  };
  const entkodieren = t => entitaetenAufloesen(String(t||"").replace(/<[^>]+>/g," "))
    .replace(/\s+/g," ").trim();

  const zutaten = (Array.isArray(r.recipeIngredient) ? r.recipeIngredient
                  : Array.isArray(r.ingredients)     ? r.ingredients : [])
    .map(z => entkodieren(text(z))).filter(Boolean);

  let schritte = [];
  const anleitung = r.recipeInstructions;
  if(Array.isArray(anleitung)){
    anleitung.forEach(a => {
      if(a && a["@type"] === "HowToSection" && Array.isArray(a.itemListElement)){
        a.itemListElement.forEach(x => schritte.push(entkodieren(text(x))));
      } else schritte.push(entkodieren(text(a)));
    });
  } else if(anleitung){
    schritte = entkodieren(text(anleitung)).split(/\n+/);
  }
  schritte = schritte.map(x=>x.trim()).filter(Boolean);

  // Portionsangabe kann Zahl, Zeichenkette oder Liste sein
  let portionen = r.recipeYield;
  if(Array.isArray(portionen)) portionen = portionen[0];
  portionen = entkodieren(text(portionen));

  // Sprache der Quelle merken: Ein niederländisches Rezept soll bei deutscher
  // Anzeige übersetzt werden – und umgekehrt.
  let sprache = entkodieren(text(r.inLanguage)).toLowerCase();
  if(sprache.indexOf("nl") === 0) sprache = "nl";
  else if(sprache.indexOf("de") === 0) sprache = "de";
  else sprache = spracheRaten(zutaten.join(" ") + " " + schritte.join(" "));

  return {
    titel: entkodieren(text(r.name)),
    zutaten,
    zubereitung: schritte.join("\n"),
    portionen,
    sprache,
    quelle: entkodieren(text(r.url)) || ""
  };
}

// Grobe Spracherkennung anhand häufiger Funktionswörter. Reicht aus, um
// Deutsch von Niederländisch zu unterscheiden, wenn die Seite keine
// Sprachangabe mitliefert.
function spracheRaten(text){
  const w = " " + String(text||"").toLowerCase().replace(/[^a-zäöüßë]+/g," ") + " ";
  const zaehle = liste => liste.reduce((n,x)=> n + (w.split(" "+x+" ").length-1), 0);
  const nl = zaehle(["de","het","een","en","met","voor","van","toevoegen","snijden",
                     "koken","roeren","ui","kaas","boter","eetlepel","theelepel"]);
  const de = zaehle(["der","die","das","ein","eine","und","mit","für","von",
                     "hinzufügen","schneiden","kochen","rühren","zwiebel","käse","butter"]);
  return nl > de ? "nl" : "de";
}

// Rückfallebene: Microdata (itemprop) – seltener, aber noch verbreitet
function rezeptAusMicrodata(text){
  if(!text || text.indexOf("recipeIngredient") === -1) return null;
  const hole = prop => [...text.matchAll(
    new RegExp('itemprop=["\']'+prop+'["\'][^>]*>([\\s\\S]*?)<\\/', "gi"))]
    .map(m => entitaetenAufloesen(m[1].replace(/<[^>]+>/g," ")).replace(/\s+/g," ").trim())
    .filter(Boolean);
  const zutaten = hole("recipeIngredient");
  if(!zutaten.length) return null;
  const titelTreffer = text.match(/itemprop=["']name["'][^>]*>([\s\S]*?)<\//i);
  return {
    titel: titelTreffer
      ? entitaetenAufloesen(titelTreffer[1].replace(/<[^>]+>/g," ")).replace(/\s+/g," ").trim() : "",
    zutaten,
    zubereitung: hole("recipeInstructions").join("\n"),
    portionen: "",
    quelle: ""
  };
}

// Übernimmt ein strukturiert erkanntes Rezept in das offene Formular
function rezeptUebernehmen(erg){
  REZEPT.zutaten = REZEPT.zutaten.concat(erg.zutaten);
  if(erg.sprache) REZEPT.sprache = erg.sprache;
  const titelFeld = document.getElementById("rz_titel");
  if(titelFeld && !titelFeld.value.trim() && erg.titel) titelFeld.value = erg.titel;
  const zubFeld = document.getElementById("rz_zub");
  if(zubFeld && erg.zubereitung){
    const vorspann = erg.portionen ? "Für " + erg.portionen + "\n\n" : "";
    zubFeld.value = (zubFeld.value.trim() ? zubFeld.value.trim()+"\n\n" : "") + vorspann + erg.zubereitung;
  }
  const linkFeld = document.getElementById("rz_link");
  if(linkFeld && !linkFeld.value.trim() && erg.quelle) linkFeld.value = erg.quelle;
  renderZutaten();
  const ta = document.getElementById("rz_import"); if(ta) ta.value = "";
  toggleRezImport();
  toast(erg.zutaten.length + " Zutaten übernommen – bitte prüfen");
}

// Heuristische Aufteilung eines eingefügten Rezepts in Zutaten + Zubereitung
window.rezImportSplit = () => {
  const ta = document.getElementById("rz_import"); if(!ta) return;
  const raw = ta.value; if(!raw.trim()){ toast("Bitte zuerst ein Rezept einfügen."); return; }

  // Zuerst versuchen, das Rezept strukturiert zu lesen (Seitenquelltext).
  // Das liefert exakte Werte statt geratener – inklusive Titel und Portionen.
  try{
    const strukturiert = rezeptAusJsonLd(raw) || rezeptAusMicrodata(raw);
    if(strukturiert && strukturiert.zutaten.length){ rezeptUebernehmen(strukturiert); return; }
  }catch(e){ Fehlerlog.erfasse("rezeptImportStruktur", e); }

  // Einheiten in Deutsch UND Niederländisch – dieselbe Heuristik erkennt dadurch
  // auch Rezepte niederländischer Seiten (ah.nl, Allerhande, 24Kitchen).
  const EINHEITEN = ["g","kg","mg","l","ml","el","tl","msp","prise","prisen","stück","stk","stange","stangen","zehe","zehen","bund","dose","dosen","packung","pck","pkg","tasse","tassen","becher","scheibe","scheiben","blatt","blätter","kopf","köpfe","zweig","zweige","cl","dl","tropfen","handvoll","portion","portionen",
    "gram","kilo","eetlepel","eetlepels","theelepel","theelepels","snufje","snufjes",
    "teentje","teentjes","bosje","bosjes","stuk","stuks","blik","blikje","blikjes",
    "pak","pakje","pakjes","zakje","zakjes","pot","potje","bakje","plak","plakken",
    "krop","kroppen","druppel","druppels","mespunt","scheutje","handje",
    "portie","porties","liter","kopje","kopjes"];
  const reMenge = /^\s*(?:[½¼¾⅓⅔⅛]|\d+[.,/]?\d*)\s*(?:[½¼¾⅓⅔⅛])?/;
  const reEinheitStart = new RegExp("^\\s*(?:"+EINHEITEN.join("|")+")\\b","i");
  // Überschriften, die einen Abschnittswechsel markieren
  const reZubHead = /^\s*(zubereitung|anleitung|anweisung|zubereitungsschritte|schritte|so geht'?s|so wird'?s gemacht|kochanleitung|arbeitsschritte|bereidingswijze|bereiding|zo maak je het|werkwijze|stappen|instructies)\s*:?\s*$/i;
  const reZutHead = /^\s*(zutaten|einkaufsliste|du brauchst|man braucht|für (?:das|die|den)\b.*|ingredi[eë]nten|boodschappen|nodig|je hebt nodig|voor (?:de|het)\b.*)\s*:?\s*$/i;
  const reSchrittNr = /^\s*(?:schritt\s*)?\d+\s*[.):]\s+/i;

  // 1) normalisieren: Zeilen, Aufzählungszeichen entfernen
  const lines = raw.replace(/\r/g,"")
    .split("\n")
    .map(l => l.replace(/^\s*[-•*▢□●○‣·–—]\s*/,"").replace(/\u00a0/g," ").trimEnd())
    .filter(l => l.trim().length);

  const zutaten = [];
  const zubLines = [];
  // mode: null = unbekannt, "zut" = Zutatenabschnitt, "zub" = Zubereitungsabschnitt
  let mode = null;

  const istZutatZeile = (l) => {
    const t = l.trim();
    if(t.length > 90) return false;                 // lange Sätze = eher Anleitung
    if(/[.!?]$/.test(t) && t.split(" ").length > 7) return false; // ganzer Satz
    if(reMenge.test(t)) return true;                // beginnt mit Menge/Zahl
    if(reEinheitStart.test(t)) return true;         // beginnt mit Einheit
    if(EINHEITEN.some(e => new RegExp("\\b"+e+"\\b","i").test(t)) && t.split(" ").length <= 6) return true;
    return false;
  };

  for(const l of lines){
    if(reZubHead.test(l)){ mode="zub"; continue; }   // Überschrift selbst nicht übernehmen
    if(reZutHead.test(l)){ mode="zut"; continue; }

    if(mode==="zub"){ zubLines.push(l); continue; }
    if(mode==="zut"){
      if(istZutatZeile(l) || l.trim().split(" ").length <= 5){ zutaten.push(l.trim()); }
      else { zubLines.push(l); }                      // langer Satz im Zutatenblock -> Anleitung
      continue;
    }
    // Kein Abschnitt erkannt: pro Zeile entscheiden
    if(istZutatZeile(l)){ zutaten.push(l.trim()); }
    else if(reSchrittNr.test(l)){ zubLines.push(l.replace(reSchrittNr,"")); }
    else if(zutaten.length || zubLines.length){ zubLines.push(l); } // Fließtext nach erstem Inhalt = Anleitung
    // sonst (kurze Kopfzeile vor jeglichem Inhalt, z.B. Titel) verwerfen
  }

  if(!zutaten.length && !zubLines.length){ toast("Konnte nichts erkennen. Bitte Text prüfen."); return; }

  // Ergebnis übernehmen (anhängen, nicht überschreiben)
  REZEPT.zutaten = REZEPT.zutaten.concat(zutaten);
  const neueZub = zubLines.join("\n").trim();
  if(neueZub){
    const feld = document.getElementById("rz_zub");
    if(feld){ feld.value = (feld.value.trim() ? feld.value.trim()+"\n\n" : "") + neueZub; }
  }
  renderZutaten();
  ta.value = "";
  toggleRezImport();
  toast(zutaten.length+" Zutat(en) und "+(neueZub?zubLines.length:0)+" Zeile(n) Zubereitung übernommen.");
};

let ESSEN_WOCHE = 0;   // 0 = aktuelle Woche, -1 = letzte, +1 = nächste …
function wochenStart(offset){
  const d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7)+offset*7);   // Montag der Zielwoche
  return d;
}
function essenWochenTage(offset){
  const s=wochenStart(offset); const out=[];
  for(let i=0;i<7;i++){ const d=new Date(s); d.setDate(s.getDate()+i); out.push(isoLokal(d)); }
  return out;
}

window.Sync = (() => {
  const CLIENT_ID = "5459e1ad-51b7-4d2c-8470-f3869baabcfb";
  const SCOPES = ["Files.ReadWrite", "User.Read"];
  const FOLDER = "FamilienApp";

  const LISTEN = ["todos","todoListen","wiederkehrend","reparaturen","urlaub","ideen","keller","listen","rezepte","nachrichten","essensplan","termine"];
  const OBJEKTE = ["nutzer","nutzerRollen","einkaufStamm","ideenKategorien","wohnmobil","wohnmobilCheck","empfaengerStandard"];
  let app=null, account=null, saveTimer=null, busy=false, online=false, pollTimer=null, _lastSync=null;

  function setStatus(t,ok){ const e=document.getElementById("syncTxt"); if(e)e.textContent=t;
    const d=document.querySelector(".sync .dot"); if(d)d.style.background=ok?"var(--ok)":"var(--ink2)"; }

  // Laedt die MSAL-Bibliothek bei Bedarf nach (asynchron, mit CDN-Fallback).
  // Frueher wurde sie blockierend im <head> geladen und die App startete erst danach.
  function warteAufMsal(){
    return (window.ladeMsal ? window.ladeMsal() : Promise.resolve(!!window.msal))
      .catch(e=>{ Fehlerlog.erfasse("ladeMsal", e); return false; });
  }
  // Initialisiert die MSAL-App (einmalig). Gibt true bei Erfolg.
  async function ensureApp(){
    if(app) return true;
    const ok = await warteAufMsal();
    if(!ok || !window.msal) return false;
    app = new window.msal.PublicClientApplication({
      auth:{ clientId:CLIENT_ID, authority:"https://login.microsoftonline.com/consumers", redirectUri:location.origin+location.pathname },
      cache:{ cacheLocation:"localStorage" },
    });
    await app.initialize();
    return true;
  }
  async function start(){
    const ok = await ensureApp();
    if(!ok){ setStatus("Antippen zum Anmelden", false); return; }
    try{ const r=await app.handleRedirectPromise(); if(r&&r.account)account=r.account; }catch(e){console.warn(e);}
    const a=app.getAllAccounts(); if(!account&&a.length)account=a[0];
    if(account){ online=true; setStatus("Verbunden",true); await fullSync(); startPolling(); }
    else setStatus("Antippen zum Anmelden", false);
  }
  async function login(){
    const ok = await ensureApp();
    if(!ok){ alert("Die Anmelde-Komponente konnte nicht geladen werden. Bitte Internetverbindung prüfen und die Seite neu laden."); return; }
    try{ const r=await app.loginPopup({scopes:SCOPES}); account=r.account; online=true; setStatus("Verbunden",true); await fullSync(); startPolling(); }
    catch(e){ try{ await app.loginRedirect({scopes:SCOPES}); }catch(e2){ alert("Anmeldung fehlgeschlagen: "+e2.message); } }
  }
  async function logout(){ if(app&&account)await app.logoutPopup({account}); account=null; online=false; setStatus("Abgemeldet",false); }
  async function token(){ if(!app||!account)throw new Error("nicht angemeldet");
    try{ return (await app.acquireTokenSilent({scopes:SCOPES,account})).accessToken; }
    catch(e){ const r=await app.acquireTokenPopup({scopes:SCOPES}); account=r.account; return r.accessToken; } }
  // ETag der zuletzt gelesenen/geschriebenen Fassung. Grundlage fuer den
  // Konfliktschutz (If-Match) und fuer die Pruefung, ob sich fern etwas geaendert hat.
  let _etag = null;
  async function readFile(name){ const t=await token();
    const r=await fetch(`${GRAPH}/me/drive/root:/${FOLDER}/${name}:/content`,{headers:{Authorization:"Bearer "+t}});
    if(r.status===404){ _etag=null; return null; }
    if(!r.ok)throw new Error("Lesen "+r.status);
    _etag = r.headers.get("ETag") || null;
    try{ return JSON.parse(await r.text()); }catch{ return null; } }
  async function writeFile(name,data){ const t=await token();
    const h={Authorization:"Bearer "+t,"Content-Type":"application/json"};
    // Nur schreiben, wenn die Datei seit dem Lesen unveraendert ist -> verhindert
    // verlorene Aenderungen (Lost Update) bei gleichzeitigem Zugriff mehrerer Geraete.
    if(_etag) h["If-Match"]=_etag;
    const r=await fetch(`${GRAPH}/me/drive/root:/${FOLDER}/${name}:/content`,{method:"PUT",headers:h,body:JSON.stringify(data)});
    if(r.status===412 || r.status===409){ _etag=null; throw new Error("KONFLIKT"); }
    if(!r.ok)throw new Error("Schreiben "+r.status);
    _etag = r.headers.get("ETag") || null;
    return true; }
  // Metadaten statt Inhalt lesen (wenige hundert Byte statt der kompletten Datei).
  // Liefert true, wenn sich der Fernstand seit dem letzten Abgleich geaendert hat.
  async function fernGeaendert(){
    if(!_etag) return true;
    try{
      const t=await token();
      const r=await fetch(`${GRAPH}/me/drive/root:/${FOLDER}/daten.json`,{headers:{Authorization:"Bearer "+t}});
      if(!r.ok) return true;
      const meta=await r.json();
      return (meta.eTag||meta.cTag||"") !== _etag;
    }catch(e){ return true; }
  }
  // Verschachtelte Arrays, die eintragsweise zusammengefuehrt werden muessen.
  // Ohne das ersetzt der juengere Datensatz den aelteren komplett: Hakt Ellen
  // zwei Artikel ab, waehrend Alexander einen hinzufuegt, geht eine der beiden
  // Aenderungen still verloren. Beide Arrays haben id, updatedAt und Tombstones,
  // erfuellen also alle Voraussetzungen fuer einen sauberen Merge.
  // Nicht aufgenommen: keller[].items und rezepte[].zutaten – das sind reine
  // Zeichenketten ohne id; ein eintragsweiser Merge waere dort nicht eindeutig.
  const KIND_ARRAYS = { listen:["artikel"], todoListen:["punkte"] };

  // Eintragsweiser Merge fuer Kind-Arrays (Artikel, Punkte).
  // Schluessel ist die id; fuer Altbestaende ohne id dient der Text als Ersatz.
  function mergeKinder(lokal=[],fern=[]){
    const m=new Map();
    const keyOf = p => p && (p.id || ("t:"+String(p.tx||p.t||p.name||"").toLowerCase()));
    for(const p of lokal){ if(p) m.set(keyOf(p),p); }
    for(const p of fern){
      if(!p) continue;
      const k=keyOf(p), ex=m.get(k);
      if(!ex || new Date(p.updatedAt||0)>new Date(ex.updatedAt||0)) m.set(k,p);
    }
    return [...m.values()].filter(p=>!(p.deleted && (p.deletedAt||p.updatedAt) &&
      (Date.now()-new Date(p.deletedAt||p.updatedAt).getTime())>30*86400000));
  }

  function mergeListe(schluessel,lokal=[],fern=[]){
    const kinder = KIND_ARRAYS[schluessel] || [];
    const m=new Map();
    for(const e of lokal)if(e&&e.id)m.set(e.id,e);
    for(const e of fern){
      if(!e||!e.id)continue;
      const d=m.get(e.id);
      if(!d){ m.set(e.id,e); continue; }
      if(!kinder.length){
        if(new Date(e.updatedAt||0)>new Date(d.updatedAt||0)) m.set(e.id,e);
        continue;
      }
      // Grunddaten: juengerer Stand gewinnt. Kind-Arrays: eintragsweise mergen.
      const basis = new Date(e.updatedAt||0)>new Date(d.updatedAt||0) ? {...e} : {...d};
      for(const feld of kinder) basis[feld] = mergeKinder(d[feld]||[], e[feld]||[]);
      m.set(e.id, basis);
    }
    // Tombstones (deleted) BEHALTEN, sonst kehren gelöschte Einträge beim Sync von anderen
    // Geräten zurück und der Papierkorb wäre nach jedem Abgleich leer.
    // Nur sehr alte Tombstones (>30 Tage) werden endgültig entfernt.
    return [...m.values()].filter(e=>!(e.deleted && (e.deletedAt||e.updatedAt) && (Date.now()-new Date(e.deletedAt||e.updatedAt).getTime())>30*86400000)); }
  // POI-Listen einer Stadt eintragsweise zusammenführen (id-basiert, sonst nach Name).
  // Bei gleicher id gewinnt der zuletzt geänderte Eintrag (Last-Write-Wins über updatedAt).
  function mergePois(lokal=[],fern=[]){
    const m=new Map();
    const keyOf=p=>p.id||("n:"+(p.name||"")+(p.adresse||""));
    for(const p of lokal) m.set(keyOf(p),p);
    for(const p of fern){ const k=keyOf(p); const ex=m.get(k);
      if(!ex){ m.set(k,p); }
      else if(new Date(p.updatedAt||0) > new Date(ex.updatedAt||0)){ m.set(k,p); }
    }
    // Tombstones (deleted) bleiben erhalten, damit die Löschung auf alle Geräte propagiert.
    // Sehr alte Tombstones (>30 Tage) werden entfernt.
    return [...m.values()].filter(p=>!(p.deleted && p.deletedAt && (Date.now()-new Date(p.deletedAt).getTime())>30*86400000));
  }
  // Tagesplan zweier Städte zusammenführen (pro Datum die Einträge per Last-Write-Wins mergen)
  function mergeTagesplan(lokal={},fern={}){
    const out={};
    const tage=new Set([...Object.keys(lokal||{}),...Object.keys(fern||{})]);
    tage.forEach(d=>{ out[d]=mergePois(lokal[d]||[], fern[d]||[]); });
    return out;
  }
  // Reisen tief mergen: gleiche Reise -> Städte & deren Inhalte zusammenführen statt überschreiben
  function mergeReisen(lokal=[],fern=[]){
    const m=new Map();
    for(const r of lokal) if(r&&r.id) m.set(r.id,r);
    for(const fr of fern){ if(!fr||!fr.id)continue;
      const lr=m.get(fr.id);
      if(!lr){ m.set(fr.id,fr); continue; }
      // jüngere Grunddaten gewinnen
      const base = new Date(fr.updatedAt||0)>new Date(lr.updatedAt||0) ? {...fr} : {...lr};
      // Städte zusammenführen
      const cityMap=new Map();
      (lr.staedte||[]).forEach(c=>cityMap.set(c.id||c.name,{...c}));
      (fr.staedte||[]).forEach(c=>{ const k=c.id||c.name; const ex=cityMap.get(k);
        if(!ex){ cityMap.set(k,{...c}); }
        else {
          // POI-Gruppen (inkl. Altdaten) eintragsweise mergen
          ["stellplaetze","sehens","restaurants","stopps"].forEach(g=>{ ex[g]=mergePois(ex[g]||[], c[g]||[]); });
          // Tagesplan datums- und eintragsweise mergen
          ex.tagesplan = mergeTagesplan(ex.tagesplan||{}, c.tagesplan||{});
          // jüngere Stadt-Grunddaten gewinnen (alle Felder, nicht nur name/lat/lon)
          if(new Date(c.updatedAt||0)>new Date(ex.updatedAt||0)){
            ["name","lat","lon","link","plz","land","von","bis","hinweis","foto","updatedAt"].forEach(f=>{ if(c[f]!==undefined) ex[f]=c[f]; });
          }
        }
      });
      // Gelöschte Städte bleiben als Tombstone erhalten, damit die Löschung propagiert.
      base.staedte=[...cityMap.values()].filter(c=>
        !(c.deleted && c.deletedAt && (Date.now()-new Date(c.deletedAt).getTime())>30*86400000));
      // Packliste eintragsweise
      base.packliste = mergePois(lr.packliste||[], fr.packliste||[]);
      m.set(fr.id, base);
    }
    // Reise-Tombstones behalten (Löschung propagiert, Papierkorb funktioniert), >30 Tage endgültig weg
    return [...m.values()].filter(r=>!(r.deleted && (r.deletedAt||r.updatedAt) && (Date.now()-new Date(r.deletedAt||r.updatedAt).getTime())>30*86400000));
  }
  // Serialisierter Stand des letzten Schreibvorgangs – verhindert unnoetige Uploads.
  let _letzterUpload = null;
  // Lokale Aenderung seit dem letzten Abgleich? Wird von scheduleSave() gesetzt.
  let _lokalGeaendert = false;

  async function fullSync(wiederholung){ if(!online||busy)return; busy=true;
    try{
      // Ruhezustand: weder lokal noch fern etwas geaendert -> nichts zu tun.
      // Spart im Regelfall die vollstaendige Uebertragung der Datei.
      if(!_lokalGeaendert && !wiederholung && !(await fernGeaendert())){
        setStatus("Verbunden",true); busy=false; return;
      }
      setStatus("Synchronisiere…",true);
      // Vor dem Abgleich merken, welche Nachrichten ich schon kenne
      const bekannteNachrichten = new Set((DB.nachrichten||[]).map(n=>n.id));
      const fern=(await readFile("daten.json"))||{};
      for(const k of LISTEN){
        if(k==="urlaub") DB.urlaub = mergeReisen(DB.urlaub||[], fern.urlaub||[]);
        else DB[k]=mergeListe(k, DB[k]||[], fern[k]||[]);
      }
      if(fern._sync && new Date(fern._sync)>new Date(DB._sync||0))
        for(const k of OBJEKTE) if(fern[k]!==undefined) DB[k]=fern[k];
      // Artikelzaehler: Last-Write-Wins waere falsch – Zaehler muessen zusammengefuehrt
      // werden, sonst erreicht kein Artikel je die Schwelle fuer die Schnellauswahl.
      if(fern.artikelZaehler){
        DB.artikelZaehler = DB.artikelZaehler || {};
        Object.entries(fern.artikelZaehler).forEach(([k,v])=>{
          DB.artikelZaehler[k] = Math.max(DB.artikelZaehler[k]||0, v||0);
        });
      }
      // Neu eingegangene, für mich bestimmte ungelesene Nachrichten -> Handy-Benachrichtigung
      try{
        const neue = (DB.nachrichten||[]).filter(n=>
          !bekannteNachrichten.has(n.id) &&
          n.von!==ME &&
          (!n.ziel || n.ziel===ME) &&
          !(n.gelesenVon||[]).includes(ME)
        );
        neue.forEach(n=> handyBenachrichtigung("Familie Nadig", n.text));
      }catch(e){}
      localStorage.setItem(KEY,JSON.stringify(DB));
      // Unbekannte Schluessel des Fernstands erhalten. Ohne das wuerde ein Geraet
      // mit aelterer App-Version Module, die es nicht kennt (z.B. Essensplan),
      // beim Zurueckschreiben aus der gemeinsamen Datei entfernen.
      const bekannt = new Set([...LISTEN, ...OBJEKTE, "_sync", "artikelZaehler", "_minVersion"]);
      const zuSchreiben = { ...DB };
      Object.keys(fern).forEach(k=>{
        if(!bekannt.has(k) && zuSchreiben[k]===undefined) zuSchreiben[k]=fern[k];
      });
      // Mindestversion mitfuehren: aeltere Geraete erkennen daran, dass sie nicht
      // schreiben duerfen, bis sie aktualisiert sind.
      zuSchreiben._minVersion = APP_VERSION;
      const serialisiert = JSON.stringify(zuSchreiben);
      if(serialisiert !== _letzterUpload){
        await writeFile("daten.json", zuSchreiben);
        _letzterUpload = serialisiert;
      }
      _lokalGeaendert = false;
      _lastSync = new Date();
      setStatus("Verbunden",true);
      if(CURRENT&&RENDER[CURRENT]&&!DETAIL_OPEN)RENDER[CURRENT](); else if(ME&&!CURRENT)renderHome();
    }catch(e){
      if(e && e.message==="KONFLIKT" && !wiederholung){
        // Ein anderes Geraet war schneller: neu lesen, erneut zusammenfuehren, dann schreiben.
        console.info("Sync-Konflikt – erneuter Versuch");
        busy=false; return fullSync(true);
      }
      console.warn("Sync:",e); setStatus("Sync-Fehler",false);
    }
    finally{ busy=false; } }
  function scheduleSave(){ _lokalGeaendert=true; if(!online)return;
    clearTimeout(saveTimer); setStatus("Speichere…",true); saveTimer=setTimeout(()=>fullSync(),1200); }
  // Adaptives Abgleichsintervall: haeufig bei aktiver Nutzung, seltener im
  // Leerlauf, Pause bei verborgenem Tab. Frueher fest alle 20 Sekunden – das
  // kostete auch dann Akku und Datenvolumen, wenn niemand die App benutzte.
  function syncIntervall(){
    if(document.visibilityState !== "visible") return 0;
    const untaetig = Date.now() - _letzteAktion;
    if(untaetig <  60000) return 15000;
    if(untaetig < 300000) return 60000;
    return 300000;
  }
  function startPolling(){
    clearInterval(pollTimer);
    let aktuell = 0;
    const takt = () => {
      const ms = syncIntervall();
      if(ms !== aktuell){
        aktuell = ms;
        clearInterval(pollTimer);
        if(ms > 0) pollTimer = setInterval(()=>{ if(!busy) fullSync(); }, ms);
      }
    };
    takt();
    clearInterval(window._syncTaktTimer);
    window._syncTaktTimer = setInterval(takt, 10000);
    document.addEventListener("visibilitychange",()=>{
      takt();
      if(document.visibilityState==="visible"&&online&&!busy)fullSync();
    });
  }
  return { start, login, logout, scheduleSave, fullSync, isOnline:()=>online,
    lastSync:()=> _lastSync ? _lastSync.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) : null };
})();

      <div class="fld" style="background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:14px">
        <div style="font-size:13px;color:var(--ink2)">Status</div>
        <div style="font-weight:650">Verbunden${last?" · zuletzt "+last:""}</div></div>
      ${benachrichtigungStatusHtml()}
      <button class="btn" onclick="Sync.fullSync();closeModal()">Jetzt abgleichen</button>
      <button class="btn ghost" onclick="datenExport()">Alle Daten sichern (Datei)</button>
      <button class="btn ghost" onclick="fehlerprotokollZeigen()">Fehlerprotokoll</button>

  } else {

// ============================================================
//  Datensicherung: vollstaendiger Export als JSON-Datei
// ============================================================
// Absicherung gegen Kontoverlust und Voraussetzung fuer groessere Umbauten
// (z. B. den Wechsel des OneDrive-Ordners). Laeuft rein lokal.
window.datenExport = () => {
  try{
    const daten = JSON.stringify(DB, null, 2);
    const blob = new Blob([daten], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "familie-nadig-sicherung-" + heuteISO() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    const kb = Math.round(daten.length/1024);
    toast(`Sicherung erstellt (${kb} KB)`);
  }catch(e){
    Fehlerlog.erfasse("datenExport", e);
    toast("Sicherung fehlgeschlagen. Bitte erneut versuchen.");
  }
};

// Fehlerprotokoll einsehen und teilen – macht Stoerungen nachvollziehbar,
// statt sie stillschweigend verschwinden zu lassen.
window.fehlerprotokollZeigen = () => {
  const eintraege = Fehlerlog.laden().slice().reverse();
  const liste = eintraege.length
    ? eintraege.map(e=>`<div class="subitem"><div class="it">
         <strong>${esc(e.kontext)}</strong><small>${esc(fmtDate(e.zeit))} · v${esc(e.version||"?")}</small>
         <small>${esc(e.nachricht)}</small></div></div>`).join("")
    : `<div class="ml">Keine Fehler protokolliert.</div>`;
  openSheet(`<h3>Fehlerprotokoll</h3>
    <div class="ml">Die letzten ${eintraege.length} Meldungen dieses Geräts. Hilft bei der Fehlersuche.</div>
    <div style="max-height:46vh;overflow-y:auto">${liste}</div>
    ${eintraege.length?`<button class="btn ghost" onclick="fehlerprotokollKopieren()">Protokoll kopieren</button>
    <button class="btn danger" onclick="Fehlerlog.leeren();closeModal();toast('Protokoll geleert')">Protokoll leeren</button>`:""}`);
};
window.fehlerprotokollKopieren = () => {
  const txt = Fehlerlog.laden().map(e=>`${e.zeit} [${e.kontext}] ${e.nachricht}`).join("\n");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast("Protokoll kopiert"))
      .catch(()=>toast("Kopieren nicht möglich"));
  } else toast("Kopieren wird auf diesem Gerät nicht unterstützt");
};

// Die Oberflaeche ist bereits gezeichnet. Der Sync (und damit das Nachladen der
// Anmeldebibliothek) laeuft erst im Leerlauf an – die App ist dadurch spuerbar
// frueher bedienbar.
// typeof-Pruefung statt "in": manche Umgebungen legen die Eigenschaft an,
// ohne eine Funktion bereitzustellen – dann schlug der Aufruf fehl und der

if(typeof window.requestIdleCallback === "function")
  window.requestIdleCallback(()=>Sync.start(), { timeout:2500 });

<script>
// ============================================================
//  PWA: Service Worker mit ausdruecklichem Aktualisierungshinweis
// ============================================================
// Frueher wurden Service Worker und Caches beim Start geloescht und die Seite
// bei neuer Version hart neu geladen. Das loeste zwar das Problem veralteter
// Staende, nahm der App aber jede Offline-Faehigkeit: Ohne Netz startete sie
// gar nicht - ausgerechnet im Wohnmobil und auf Reisen.
//
// Der Service Worker holt das Dokument jetzt bevorzugt aus dem Netz
// (immer aktuell) und faellt nur bei fehlender Verbindung auf den
// Zwischenspeicher zurueck (offline bedienbar). Eine neue Version wird nie
// heimlich uebernommen, sondern angeboten.
(function(){
  if(!("serviceWorker" in navigator)) return;
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then(reg => {

      // Bereits wartende Version sofort anbieten
      if(reg.waiting && navigator.serviceWorker.controller) neueVersionAnbieten(reg.waiting);

      reg.addEventListener("updatefound", () => {
        const neuer = reg.installing;
        if(!neuer) return;
        neuer.addEventListener("statechange", () => {
          // "installed" + vorhandener Controller = echte Aktualisierung.
          // Beim allerersten Besuch gibt es keinen Controller - dann nichts melden.
          if(neuer.state === "installed" && navigator.serviceWorker.controller){
            neueVersionAnbieten(neuer);
          }
        });
      });

      // Stuendlich und bei Rueckkehr in den Vordergrund nach Neuem sehen
      setInterval(() => reg.update().catch(()=>{}), 3600000);
      document.addEventListener("visibilitychange", () => {
        if(document.visibilityState === "visible") reg.update().catch(()=>{});
      });
    }).catch(e => {
      // Fehlgeschlagene Registrierung ist kein Beinbruch: Die App laeuft weiter,
      // nur ohne Offline-Faehigkeit.
      if(window.Fehlerlog) Fehlerlog.erfasse("sw-register", e);
    });
  });

  let _neuladenLaeuft = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if(_neuladenLaeuft) return;
    _neuladenLaeuft = true;
    location.reload();
  });

  function neueVersionAnbieten(worker){
    const laden = () => { worker.postMessage({ typ:"jetztUebernehmen" }); };
    if(window.toast) toast("Neue Version verfügbar", { label:"Jetzt laden", fn: laden });
    else laden();
  }
})();

// ============================================================
//  Verbindungsstatus sichtbar machen
// ============================================================
// Ohne Rueckmeldung wirkt eine offline nicht abgleichende App defekt.
(function(){
  function status(){
    const el = document.getElementById("syncTxt");
    const knopf = document.querySelector(".sync");
    if(!el) return;
    if(!navigator.onLine){
      if(!el.dataset.vorher) el.dataset.vorher = el.textContent;
      el.textContent = "Offline – Änderungen werden gespeichert";
      if(knopf) knopf.classList.add("offline");
    } else if(el.dataset.vorher){
      el.textContent = el.dataset.vorher;
      delete el.dataset.vorher;
      if(knopf) knopf.classList.remove("offline");
    }
  }
  window.addEventListener("online",  () => { status(); if(window.Sync) Sync.fullSync(); });
  window.addEventListener("offline", status);
  if(!navigator.onLine) status();
})();
</script>
