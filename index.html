<script>
// MSAL wird NICHT mehr blockierend geladen. Die App startet sofort aus dem lokalen
// Bestand; die Anmeldebibliothek kommt asynchron nach (mit CDN-Fallback).
// Frueher: <script src=...> + document.write-Fallback -> blockierte den Seitenaufbau
// und wurde von Chrome bei langsamer Verbindung ausgerechnet dann unterdrueckt,
// wenn der Fallback gebraucht wurde.
window.ladeSkript = function(src){
  return new Promise(function(res, rej){
    var s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = function(){ res(true); };
    s.onerror = function(){ rej(new Error("Laden fehlgeschlagen: " + src)); };
    document.head.appendChild(s);
  });
};
window.ladeMsal = (function(){
  var laeuft = null;
  return function(){
    if (window.msal) return Promise.resolve(true);
    return laeuft || (laeuft = (async function(){
      var quellen = [
        "https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js",
        "https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"
      ];
      for (var i = 0; i < quellen.length; i++) {
        try { await window.ladeSkript(quellen[i]); if (window.msal) return true; }
        catch (e) { /* naechste Quelle versuchen */ }
      }
      laeuft = null;   // erneuter Versuch bei spaeterem Anmeldeklick moeglich
      return false;
    })());
  };
})();
</script>
<style>
:root{
  /* --ink2 und --warm wurden abgedunkelt: die alten Werte (#647089 / #d97706)
     erreichten auf weissem Grund nur ~4,3:1 bzw. ~3,1:1 und verfehlten damit
     die von WCAG 1.4.3 (AA) geforderten 4,5:1 fuer kleine Schrift. */
  --bg:#eef3fb; --surface:#ffffff; --ink:#172033; --ink2:#5a6478;
  --line:#dde5f2; --accent:#1d4ed8; --accent-2:#2563eb; --accent-soft:#dfe9fd;
  --warm:#b45309; --warm-soft:#fef0dc; --ok:#15803d; --ok-soft:#dcf2e6;
  --danger:#b91c1c; --r:16px;
  /* Stationsfarben: reihum je Position, damit sich benachbarte Stationen
     beim Scrollen klar voneinander abheben. Alle Werte erreichen auf
     weissem Grund mindestens 4,5:1 (WCAG 1.4.3 AA). */
  --stat1:#1d4ed8; --stat2:#0f766e; --stat3:#b45309; --stat4:#6d28d9; --stat5:#15803d;
  /* Kategorien der Tagesplanung */
  --kat-sehen:#6d28d9;      --kat-sehen-soft:#ece2fd;
  --kat-restaurant:#b45309; --kat-restaurant-soft:#fef0dc;
  --kat-wanderung:#15803d;  --kat-wanderung-soft:#dcf2e6;
  --kat-aktivitaet:#0f766e; --kat-aktivitaet-soft:#d6f2ee;
  --shadow:0 1px 3px rgba(23,32,51,.06),0 8px 22px rgba(29,78,216,.07);
}
/* Nutzer, die im Betriebssystem reduzierte Bewegung eingestellt haben,
   bekommen keine Animationen (WCAG 2.3.3). */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0e1626;--surface:#16203400;--surface:#172034;--ink:#e8edf7;--ink2:#8b97b0;
  --line:#26324a;--accent:#5b8def;--accent-2:#6d9bf5;--accent-soft:#1c2c4d;
  --warm:#e0934a;--warm-soft:#32261a;--ok:#5cc08a;--ok-soft:#1a2e24;--danger:#f06464;
  --stat1:#5b8def;--stat2:#3fb5a8;--stat3:#e0934a;--stat4:#a78bfa;--stat5:#5cc08a;
  --kat-sehen:#a78bfa;      --kat-sehen-soft:#2a2142;
  --kat-restaurant:#e0934a; --kat-restaurant-soft:#32261a;
  --kat-wanderung:#5cc08a;  --kat-wanderung-soft:#1a2e24;
  --kat-aktivitaet:#3fb5a8; --kat-aktivitaet-soft:#122b29;
  --shadow:0 1px 3px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.5;overscroll-behavior-y:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ---- Login-Gate ---- */
.gate{position:fixed;inset:0;background:linear-gradient(160deg,#1d4ed8,#2563eb 55%,#1e3a8a);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;padding:30px;text-align:center}
.gate h1{color:#fff;font-size:30px;font-weight:700;margin:0 0 6px;letter-spacing:-.5px}
.gate p{color:rgba(255,255,255,.85);font-size:15px;margin:0 0 40px}
.gate .who{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.gate .person{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
  backdrop-filter:blur(8px);border-radius:20px;padding:24px 28px;cursor:pointer;
  transition:.15s;min-width:120px}
.gate .person:active{transform:scale(.95);background:rgba(255,255,255,.25)}
.gate .av{width:60px;height:60px;border-radius:50%;background:#fff;color:var(--accent);
  font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px}
.gate .nm{color:#fff;font-weight:600;font-size:16px}

/* ---- Header ---- */
.topbar{padding:16px 20px 10px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:20}
.topbar .ti-wrap{display:flex;flex-direction:column}
.topbar h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.5px}
.topbar .sync{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:5px;margin-top:2px;cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.me{display:flex;align-items:center;gap:8px;cursor:pointer}
.me .av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ---- Countdown-Banner ---- */
.countdown{margin:4px 16px 12px;background:linear-gradient(120deg,var(--accent),var(--accent-2));
  border-radius:var(--r);padding:16px 18px;color:#fff;display:flex;align-items:center;
  gap:14px;box-shadow:var(--shadow);cursor:pointer}
.countdown .big{font-size:30px;font-weight:750;line-height:1}
.countdown .ct-tx{font-size:13px;opacity:.92}
.countdown .ct-nm{font-size:15px;font-weight:600;margin-top:1px}
.fd-head{padding:4px 18px 6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.fd-list{padding:0 16px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.fd-item{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:11px;box-shadow:var(--shadow);cursor:pointer}
.fd-item:active{transform:scale(.99)}
.fd-item.urgent{border-color:var(--danger)}
.fd-dot{width:9px;height:9px;border-radius:50%;background:var(--warm);flex-shrink:0}
.fd-dot.u{background:var(--danger)}
.fd-tx{flex:1;min-width:0}
.fd-titel{font-weight:600;font-size:14.5px}
.fd-meta{font-size:12px;color:var(--ink2);margin-top:1px}
.fd-go{color:var(--ink2);font-size:16px;flex-shrink:0}
.notice{margin:4px 16px 10px;background:linear-gradient(120deg,#fef0dc,#fde8c8);border:1px solid var(--warm);
  border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:11px;cursor:pointer;box-shadow:var(--shadow)}
@media(prefers-color-scheme:dark){.notice{background:#332615;border-color:var(--warm)}}
.notice-ic{font-size:20px;flex-shrink:0}
.notice-tx{flex:1;min-width:0}
.notice-titel{font-weight:650;font-size:14px;color:var(--ink)}
.notice-meta{font-size:12px;color:var(--ink2);margin-top:1px}
.notice-x{color:var(--ink2);font-size:18px;flex-shrink:0}
.kal-nav{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px}
.kal-nav>div{font-weight:700;font-size:16px;text-transform:capitalize}
.kal-nav button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer}
.kal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 12px}
.kal-head{margin-bottom:4px}
.kal-wt{text-align:center;font-size:11px;font-weight:700;color:var(--ink2);padding:4px 0}
.kal-zelle{aspect-ratio:1;border-radius:9px;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px;cursor:pointer;position:relative}
.kal-zelle.leer{background:transparent;border:none;cursor:default}
.kal-zelle.heute{border-color:var(--accent);border-width:2px}
.kal-zelle.hat{background:var(--accent-soft)}
.kal-num{font-size:13px;font-weight:600}
.kal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.kal-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.kal-legende{display:flex;flex-wrap:wrap;gap:12px;padding:14px 16px 4px;font-size:12px;color:var(--ink2)}
.kal-legende span{display:inline-flex;align-items:center;gap:5px}
.gsuche-wrap{padding:0 16px 12px}
.gsuche{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 14px}
.gsuche-ic{color:var(--ink2);display:flex}
.gsuche input{flex:1;border:none;background:transparent;color:var(--ink);font-size:15px;outline:none}
.gsuche-x{color:var(--ink2);font-size:20px;cursor:pointer;padding:0 4px}

/* ---- Home grid ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 16px 100px}
.tile{background:var(--surface);border-radius:var(--r);padding:17px 16px;position:relative;
  box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;
  transition:transform .12s;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);
  color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:21px}
.tile .nm{font-weight:650;font-size:15px;margin-top:13px;line-height:1.2}
.tile .ct{font-size:12.5px;color:var(--ink2);margin-top:3px}

/* ---- Detail view ---- */
.view{display:none;flex-direction:column;flex:1;padding-bottom:100px}
.view.active{display:flex}
.vhead{padding:6px 16px 12px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;background:var(--bg);z-index:15}
.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vhead h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.3px}
.vhead .sub{font-size:12.5px;color:var(--ink2);margin-top:1px}

.list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.row .cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#fff;transition:.12s}
.row .cb.on{background:var(--accent);border-color:var(--accent)}
.row .tx{flex:1;font-size:15px}
.row.done .tx{text-decoration:line-through;color:var(--ink2)}
.row .meta{font-size:12px;color:var(--ink2)}
.row .qty{font-size:13px;font-weight:600;padding:5px 11px;border-radius:20px;cursor:pointer;
  white-space:nowrap;border:1px solid var(--line);color:var(--ink2);transition:.12s}
.row .qty.set{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.row .qty:active{transform:scale(.93)}
.row.done .qty{opacity:.5}
.row .del{color:var(--ink2);font-size:18px;cursor:pointer;opacity:.5;padding:4px}
.row .del:active{opacity:1}

.section-label{padding:16px 18px 6px;font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}

/* ---- Karten-Eintrag (To-do, Reparatur, Urlaub) ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:14px 15px;box-shadow:var(--shadow);position:relative}
.card .ch{display:flex;align-items:flex-start;gap:11px}
.card .cbx{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:1px}
.card .cbx.on{background:var(--accent);border-color:var(--accent)}
.card .cttl{font-weight:650;font-size:15.5px;flex:1}
.card.done .cttl{text-decoration:line-through;color:var(--ink2)}
.card .cdesc{font-size:13.5px;color:var(--ink2);margin-top:5px;white-space:pre-wrap}
.card .cmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
.pill{font-size:11.5px;padding:3px 10px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.pill.due{background:var(--warm-soft);color:var(--warm)}
.pill.due.over{background:#fde8e8;color:var(--danger)}
.pill.prio-hoch{background:#fde8e8;color:var(--danger)}
.pill.prio-mittel{background:var(--warm-soft);color:var(--warm)}
.pill.prio-niedrig{background:var(--ok-soft);color:var(--ok)}
.pill.who{background:var(--accent-soft);color:var(--accent)}
.pill.cat{background:var(--accent-soft);color:var(--accent)}
.card .cphoto{margin-top:10px;border-radius:10px;width:100%;max-height:200px;object-fit:cover;display:block}
.card .cdel{position:absolute;top:12px;right:12px;color:var(--ink2);opacity:.5;font-size:18px;cursor:pointer}
.wieder-bar{margin-top:10px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.wieder-fill{height:100%;border-radius:6px;transition:width .3s}

/* ---- Add bar / FAB ---- */
.addbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 72%,transparent);display:flex;gap:9px;z-index:18}
.addbar input{flex:1;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);border-radius:13px;padding:13px 15px;font-size:15px;font-family:inherit}
.addbar input:focus{outline:none;border-color:var(--accent)}
.addbtn{width:50px;border:none;background:var(--accent);color:#fff;border-radius:13px;
  font-size:24px;cursor:pointer;flex-shrink:0}
.addbtn:active{opacity:.85}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));right:max(22px,calc(50% - 218px));
  width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;border:none;
  font-size:30px;box-shadow:0 6px 18px rgba(29,78,216,.4);cursor:pointer;z-index:19;
  display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.92)}

/* ---- Chips ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 12px}
.wg-titel{padding:10px 18px 2px;font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:9px 15px;font-size:14px;cursor:pointer;transition:.12s;color:var(--ink)}
.chip:active{transform:scale(.94);background:var(--accent-soft);border-color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip-added{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important;transform:scale(1.06);transition:.15s}
.chip-dup{background:var(--warm-soft)!important;border-color:var(--warm)!important;transition:.15s}

/* ---- Keller ---- */
.boxcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:15px;box-shadow:var(--shadow);cursor:pointer}
.boxcard .bn{font-weight:700;font-size:16px}
.boxcard .bl{font-size:12.5px;color:var(--ink2);margin-top:2px}
.boxcard .items{font-size:13px;color:var(--ink2);margin-top:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.boxcard .qr{font-size:11.5px;color:var(--accent);margin-top:8px;font-weight:600}

/* ---- Modal ---- */
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;
  align-items:flex-end;justify-content:center}
.modal.active{display:flex}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
.handle{width:40px;height:4px;background:var(--line);border-radius:2px;margin:8px auto 16px}
.sheet h3{margin:0 0 4px;font-size:21px;font-weight:700}
.sheet .ml{font-size:13px;color:var(--ink2);margin-bottom:16px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);background:var(--bg);
  color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.fld textarea{resize:none}
.seg{display:flex;gap:8px}
.seg .opt{flex:1;text-align:center;padding:11px;border:1px solid var(--line);border-radius:12px;
  font-size:14px;font-weight:600;cursor:pointer;color:var(--ink2);background:var(--bg)}
.seg .opt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.whopick{display:flex;gap:8px;flex-wrap:wrap}
.whopick .w{padding:9px 15px;border:1px solid var(--line);border-radius:20px;font-size:14px;
  cursor:pointer;color:var(--ink2);background:var(--bg);display:flex;align-items:center;gap:6px}
.whopick .w.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#qrbox{display:flex;justify-content:center;padding:18px;background:#fff;border-radius:12px;margin:10px 0}
.label-preview{border:1.5px dashed var(--line);border-radius:8px;padding:10px;display:flex;gap:12px;align-items:center;margin:12px 0}
.label-preview .lqr{width:54px;height:54px;flex-shrink:0;background:#fff;border-radius:4px;padding:3px}
.label-preview .lqr img,.label-preview .lqr canvas{width:100%!important;height:100%!important}
.label-preview .ltx .lh{font-weight:700;font-size:14px}
.label-preview .ltx .ls{font-size:11px;color:var(--ink2);margin-top:2px}
.btn{width:100%;border:none;background:var(--accent);color:#fff;border-radius:13px;
  padding:14px;font-size:15px;font-weight:650;cursor:pointer;margin-top:8px}
.btn:active{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.photo-pick{display:flex;gap:10px;margin-bottom:12px}
.photo-pick button{flex:1;border:1px dashed var(--line);background:var(--bg);color:var(--accent);
  border-radius:12px;padding:14px;font-size:14px;font-weight:600;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:6px}
.photo-thumb{position:relative;margin-bottom:12px}
.photo-thumb img{width:100%;border-radius:12px;max-height:220px;object-fit:cover;display:block}
.photo-thumb .rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;
  width:30px;height:30px;border-radius:50%;border:none;font-size:18px;cursor:pointer}
.subitem{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.subitem .it{flex:1;font-size:14px}
.subitem .it small{color:var(--ink2);display:block}
.itemrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.itemrow .it{flex:1}
.maplink{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:12.5px;font-weight:600;text-decoration:none}

/* ---- Ideen ---- */
.idea{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);position:relative}
.idea .ih{font-weight:650;font-size:16px}
.idea .id{font-size:13.5px;color:var(--ink2);margin-top:4px}
.idea a.lnk{display:inline-flex;align-items:center;gap:5px;margin-top:10px;color:var(--accent);font-size:13.5px;font-weight:600;text-decoration:none}
.idea .tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
.idea .tag{background:var(--accent-soft);color:var(--accent);font-size:11px;padding:3px 9px;border-radius:20px}
.idea .cdel{position:absolute;top:12px;right:12px;color:var(--ink2);opacity:.5;font-size:18px;cursor:pointer}

.empty{text-align:center;color:var(--ink2);padding:50px 30px;font-size:14.5px}
.empty .ei{font-size:34px;opacity:.4;margin-bottom:10px}
.toolbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--accent);
  border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.byline{font-size:11.5px;color:var(--ink2);margin-top:8px;font-style:italic}

/* ---- Städte / Etappen ---- */
.city{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);margin-bottom:0;overflow:hidden}
.city .chead{padding:14px 15px;display:flex;align-items:center;gap:11px;cursor:pointer}
.city .cnum{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.city .cname{font-weight:650;font-size:16px;flex:1;min-width:0;word-break:break-word;overflow-wrap:anywhere}
.city .cname .cdate{display:block;font-size:12px;font-weight:600;color:var(--accent);margin-top:2px}
.city .cname .cdate.offen{color:var(--ink2);font-weight:500}
/* Jede Station traegt ihre Positionsfarbe über --st */
.city{border-left:4px solid var(--st,var(--accent))}
.city .cnum{background:var(--st,var(--accent))}
.city .cname .cdate{color:var(--st,var(--accent))}
.city .tagesplan-h,.city .subgroup .sgh,.city .pdist-h{color:var(--st,var(--accent))}
.city .city-actions .cbtn{color:var(--st,var(--accent))}
.city .cdel{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--ink2);font-size:20px;cursor:pointer;background:var(--bg)}
.city .cdel:active{background:var(--line)}
.city .ccount{font-size:12px;color:var(--ink2)}
.city .cdrag{color:var(--ink2);font-size:18px;cursor:grab;padding:0 4px;touch-action:none}
.city .cbody{padding:0 15px 14px;border-top:1px solid var(--line)}
.city.collapsed .cbody{display:none}
.city-actions{display:flex;gap:8px;margin:12px 0 4px}
.city-foto{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:12px;cursor:pointer;display:block}
.cbtn{text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;
  font-size:13px;font-weight:600;color:var(--accent);background:var(--bg);cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.cbtn:active{background:var(--accent-soft)}
.city-actions .cbtn{flex:1}
.leg{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 16px;margin:0}
.leg .legrow{display:flex;align-items:center;gap:10px;width:100%}
.leg .lline{flex:1;height:0;border-top:1px dashed var(--line)}
.leg .linfo{font-size:12px;color:var(--ink2);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;opacity:.85}
.leg .legacts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
/* Etappen sind Verbindungen, keine Hauptelemente: dezent halten, damit die
   Stationskarten und die rote Datumswarnung hervortreten. */
.leg .legacts a{font-size:11.5px;color:var(--ink2);cursor:pointer;text-decoration:none;font-weight:600}
.leg .legacts a:active{color:var(--accent)}
.leg .legacts a.muted{color:var(--ink2);opacity:.75}
.leg .legwarn{width:100%;display:flex;gap:7px;align-items:flex-start;border-radius:10px;
  padding:7px 10px;font-size:12px;font-weight:600;line-height:1.35;
  background:rgba(220,38,38,.10);border:1px solid var(--danger);color:var(--danger)}
.leg .legwarn .lw-ic{flex-shrink:0}
/* Zwischenstopps auf einer Etappe */
.stops{width:100%;display:flex;flex-direction:column;gap:6px;margin:2px 0}
.stop{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px dashed var(--line);
  border-radius:10px;padding:7px 10px;font-size:13px}
.stop .si{color:var(--accent);flex-shrink:0;margin-top:1px}
.stop .sn{flex:1;min-width:0;word-break:break-word}
.stop .sn small{display:block;color:var(--ink2);font-size:11.5px;margin-top:1px;white-space:pre-wrap}
.stop .sdel{color:var(--ink2);opacity:.5;cursor:pointer;font-size:15px;flex-shrink:0}
.stop .smap{font-size:11.5px;color:var(--accent);text-decoration:none;font-weight:600}
.stop .sconv{font-size:11.5px;color:var(--ink2);font-weight:600;cursor:pointer;margin-left:12px}
.leg .stopadd{font-size:12px;color:var(--ink2);cursor:pointer;font-weight:600}
.cdur{font-size:12.5px;color:var(--accent);font-weight:600;margin:6px 0 2px;display:flex;align-items:center;gap:6px}
.chint{font-size:12.5px;color:var(--ink2);background:var(--line);padding:6px 9px;border-radius:8px;
  margin:8px 0 2px;white-space:pre-wrap;display:flex;gap:6px}
.chint .hi{flex-shrink:0}
.poi-hint{display:block;color:var(--ink2);font-size:11.5px;margin-top:2px;white-space:pre-wrap}
.pdist{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.pdist-h{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.pdist-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
.pdist-n{flex:1;min-width:0;word-break:break-word}
.pdist-v{color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:5px;font-weight:600}
.subgroup{margin-top:12px}
.subgroup .sgh{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.subgroup .sgh span.add{cursor:pointer;font-size:18px;line-height:1}
/* Warnsymbol fehlende Adresse */
.warn-adr{display:inline-flex;align-items:center;margin-left:6px;font-size:13px;line-height:1;cursor:help;vertical-align:middle}
/* Reservierungsstatus-Buttons */
.res-toggle{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.res-toggle button{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer}
.res-toggle button.on-ja{background:#16a34a;border-color:#16a34a;color:#fff}
.res-toggle button.on-nein{background:#dc2626;border-color:#dc2626;color:#fff}
/* Tagesplanung */
.tagesplan{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.tagesplan-h{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.tag-card{background:var(--line);border-radius:10px;padding:10px 11px;margin-bottom:10px}
.tag-titel{font-size:13px;font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:6px}
/* Jede Kategorie traegt ihre Farbe über --kat / --kat-soft */
.tag-zeile{display:flex;gap:7px;align-items:flex-start;font-size:13px;padding:4px 0 4px 8px;
  border-left:3px solid var(--kat,var(--accent));margin-bottom:3px}
.tag-zeile .tz-ic{flex-shrink:0;width:24px;text-align:center;border-radius:6px;
  background:var(--kat-soft,var(--accent-soft));padding:2px 0}
.tag-zeile .tz-tx{flex:1;min-width:0;word-break:break-word}
.tag-zeile .tz-tx small{display:block;color:var(--ink2);font-size:11.5px}
.tag-zeile .tz-del{color:var(--ink2);opacity:.5;cursor:pointer;font-size:15px;flex-shrink:0}
.tag-add{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag-abreise{display:flex;align-items:center;gap:6px;margin-top:8px;padding:7px 10px;
  border:1px dashed var(--accent);border-radius:10px;font-size:12.5px;font-weight:600;
  color:var(--accent);cursor:pointer}
.tag-abreise small{color:var(--ink2);font-weight:500}
.tag-add button{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;
  border:1px solid var(--kat,var(--accent));background:var(--surface);
  color:var(--kat,var(--accent));cursor:pointer}
.poi{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.poi:last-child{border-bottom:none}
.poi .pn{flex:1;font-size:14px}
.poi .pn small{display:block;color:var(--ink2);font-size:12px;margin-top:1px}
.poi .pdel{color:var(--ink2);opacity:.5;cursor:pointer;font-size:16px}
.poi-foto{width:48px;height:48px;border-radius:8px;object-fit:cover;cursor:pointer;flex-shrink:0}
.poi-autor{font-style:italic;opacity:.8;margin-top:3px!important}
.poi-fremd{border-left:3px solid var(--highlight,#85b7eb);padding-left:8px;background:var(--highlight-bg,#e8f2fb);border-radius:0 8px 8px 0}
@media(prefers-color-scheme:dark){.poi-fremd{background:rgba(91,141,239,.12)}}
.geo-status{font-size:12px;color:var(--ink2);margin-top:6px;min-height:16px}
.dragging{opacity:.5}
.drop-target{border-top:2px solid var(--accent)!important}
/* ---- Kartenansicht (Leaflet) ---- */
#kartePanel{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
.karte-top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.karte-titel{font-weight:700;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#karteMap{flex:1;background:#dde5f2}
.karte-hint{padding:8px 14px calc(10px + env(safe-area-inset-bottom));font-size:11.5px;color:var(--ink2);text-align:center}
.kmark{background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:13px;border:2px solid #fff;
  box-shadow:0 1px 4px rgba(0,0,0,.4)}
.kemoji{font-size:20px;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.leaflet-popup-content{font-family:inherit;font-size:13.5px}
/* ---- Budget ---- */
.budget-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.budget-row .bn{flex:1;min-width:0}
.budget-row .bv{font-weight:650;white-space:nowrap}
.budget-row.sum{border-bottom:none;font-weight:700;font-size:15px;padding-top:10px}
/* ---- Essensplan ---- */
.essen-tag{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow)}
.essen-tag.heute{border-color:var(--accent);border-width:2px}

/* ============================================================
   Barrierefreiheit
   ============================================================ */
/* Elemente, die von <div>/<span> auf <button> umgestellt wurden, brauchen
   ein Zuruecksetzen der Browser-Standardstile. */
/* ---- Wischgesten ---- */
.wischbar{position:relative;overflow:hidden;touch-action:pan-y}
.wischbar .row-inhalt{display:flex;align-items:center;gap:10px;width:100%;
  background:var(--surface);position:relative;z-index:1}
.wischbar.wischt{will-change:transform}
.wisch-hint{position:absolute;top:0;bottom:0;display:flex;align-items:center;
  padding:0 18px;font-size:13px;font-weight:700;color:#fff;z-index:0;
  pointer-events:none;opacity:.85}
.wisch-hint.rechts{left:0;background:var(--ok)}
.wisch-hint.links{right:0;background:var(--danger);justify-content:flex-end}
.wischbar.bereit .wisch-hint{opacity:1}
.row .cb,.row .qty,.row .del{font:inherit;color:inherit;cursor:pointer}
.row .cb{border:2px solid var(--line);background:var(--surface)}
.row .cb.on{border-color:var(--accent)}
.row .qty,.row .del{background:none;border:0}
.kopf-rechts{display:flex;align-items:center;gap:8px}
.flaggen{display:flex;gap:3px;background:rgba(255,255,255,.16);
  border-radius:999px;padding:3px}
.flagge{background:none;border:0;font-size:17px;line-height:1;cursor:pointer;
  padding:7px 8px;min-width:38px;min-height:38px;border-radius:999px;
  opacity:.45;transition:opacity .15s,background .15s}
.flagge.on{opacity:1;background:rgba(255,255,255,.28)}
.flagge:focus-visible{outline:2px solid #fff;outline-offset:1px}
.sprach-hinweis{font-size:12px;color:var(--ink2);margin-top:4px}
.zutat-uebersetzt{color:var(--ink2);font-size:12.5px}
.sync,.me,.gsuche-x{font:inherit;color:inherit;background:none;border:0;
  padding:0;text-align:inherit;cursor:pointer}
.sync{margin-top:2px}
.sync.offline .dot{background:var(--warm);animation:none}

/* ============================================================
   Kalender: Umschalter Monat/Woche + Wochenliste
   ============================================================ */
.kal-modus{display:flex;gap:6px;margin:0 16px 10px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:4px}
.kal-modus .km{flex:1;background:none;border:0;font:inherit;font-size:13.5px;
  font-weight:650;color:var(--ink2);padding:9px 6px;min-height:40px;
  border-radius:8px;cursor:pointer}
.kal-modus .km.on{background:var(--accent);color:#fff}
.kal-modus .km:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.kal-heute-btn{display:block;margin:0 16px 10px;background:none;border:0;
  font:inherit;font-size:13.5px;font-weight:600;color:var(--accent);
  padding:9px 2px;min-height:44px;cursor:pointer;text-align:left}

.wochenliste{display:flex;flex-direction:column;gap:8px;margin:0 16px 14px}
.wtag{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:11px 13px;min-height:60px;font:inherit;color:inherit;cursor:pointer}
.wtag.heute{border-color:var(--accent);border-width:2px;padding:10px 12px}
.wtag:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wt-kopf{display:flex;align-items:baseline;gap:8px}
.wt-name{font-size:14px;font-weight:700;color:var(--ink)}
.wtag.heute .wt-name{color:var(--accent)}
.wt-num{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.wt-body{display:flex;flex-direction:column;gap:4px}
.wt-eintrag{display:flex;align-items:center;gap:7px;min-width:0}
.wt-tx{font-size:13.5px;color:var(--ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.wt-leer{font-size:13px;color:var(--ink2)}

/* ============================================================
   Tagesübersicht auf dem Startbildschirm
   ============================================================ */
.heute{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 14px 12px;margin:0 16px 12px;box-shadow:var(--shadow)}
.heute-kopf{display:flex;align-items:baseline;justify-content:space-between;
  gap:10px;margin-bottom:10px}
.heute-kopf h2{font-size:17px;font-weight:700;margin:0;color:var(--ink)}
.heute-datum{font-size:12.5px;color:var(--ink2)}
.heute-zeile{display:flex;align-items:center;gap:9px;width:100%;
  background:none;border:0;font:inherit;color:inherit;text-align:left;
  padding:9px 4px;min-height:44px;cursor:pointer;border-radius:9px}
.heute-zeile+.heute-zeile{border-top:1px solid var(--line)}
.heute-zeile:hover{background:var(--accent-soft)}
.hz-punkt{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hz-zeit{font-size:12.5px;color:var(--ink2);min-width:38px;font-variant-numeric:tabular-nums}
.hz-titel{flex:1;min-width:0;font-size:14.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hz-typ{font-size:11.5px;color:var(--ink2);flex-shrink:0}
.heute-leer{font-size:14px;color:var(--ink2);padding:6px 4px 10px}
.heute-mehr,.heute-offen{display:block;width:100%;background:none;border:0;
  font:inherit;font-size:13.5px;color:var(--accent);font-weight:600;
  text-align:left;padding:10px 4px;min-height:44px;cursor:pointer}
.heute-offen{border-top:1px solid var(--line)}
.qa-reihe{display:flex;gap:8px;margin-top:10px;padding-top:11px;
  border-top:1px solid var(--line)}
.qa{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:var(--accent-soft);border:0;border-radius:12px;padding:11px 6px;
  min-height:64px;font:inherit;font-size:12.5px;font-weight:600;
  color:var(--accent);cursor:pointer}
.qa .i{width:20px;height:20px}
.qa:hover{background:#cfe0fc}

/* Modulliste: aufklappbar statt dauerhaft sichtbar */
.bereiche{margin:4px 16px 0}
.bereiche>summary{display:flex;align-items:center;justify-content:space-between;
  list-style:none;cursor:pointer;padding:13px 2px;min-height:44px;
  font-size:14.5px;font-weight:650;color:var(--ink2)}
.bereiche>summary::-webkit-details-marker{display:none}
.bereiche>summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.bereiche .chev{transition:transform var(--zeit-normal,200ms) ease;font-size:13px}
.bereiche[open] .chev{transform:rotate(180deg)}
.bereiche .grid{margin:0 0 8px}
@media(prefers-color-scheme:dark){.qa:hover{background:#25406e}}
.sync.offline{color:var(--warm)}
/* Sichtbarer Fokusring fuer Tastatur- und Screenreader-Bedienung (WCAG 2.4.7).
   :focus-visible zeigt ihn nur bei Tastaturnutzung, nicht bei Mausklick. */
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:5px}
.gate .person:focus-visible,.tile:focus-visible{outline-offset:3px}

/* Mindestgroesse fuer Beruehrungsziele: 44x44 px (WCAG 2.5.8).
   Negativer Aussenabstand vergroessert die Trefferflaeche, ohne das Layout
   zu veraendern. Betrifft vor allem Loeschkreuze - dort sind Fehlklicks teuer. */
.row .del,.card .cdel,.idea .cdel,.stop .sdel,.poi .pdel,.tag-zeile .tz-del,
.gsuche-x,.city .cdel,.subitem .rm,.itemrow .rm{
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;
  justify-content:center;margin:-10px;padding:10px;box-sizing:border-box}
.res-toggle button,.tag-add button{min-height:32px;padding-inline:12px}

/* Nur fuer Screenreader sichtbarer Text */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Feldbezogene Fehlermeldung in Formularen */
.feld-fehler{color:var(--danger);font-size:12.5px;margin-top:5px;font-weight:600}
.fld input[aria-invalid="true"],.fld textarea[aria-invalid="true"],
.fld select[aria-invalid="true"]{border-color:var(--danger)}

/* ============================================================
   Toast: nicht blockierende Rueckmeldung mit Rueckgaengig-Funktion
   (ersetzt blockierende alert()/confirm()-Dialoge)
   ============================================================ */
.toast-halter{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(96px + env(safe-area-inset-bottom));z-index:90;
  display:flex;flex-direction:column;gap:8px;align-items:center;
  width:max-content;max-width:92vw;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:13px;
  padding:12px 16px;display:flex;gap:16px;align-items:center;
  font-size:14px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.28);
  pointer-events:auto;animation:toast-auf .18s ease-out}
@media(prefers-color-scheme:dark){.toast{background:#2b3852}}
.toast.weg{opacity:0;transition:opacity .35s}
.toast-tx{flex:1;min-width:0}
.toast-btn{background:none;border:none;color:#8ab4ff;font-weight:700;
  font-size:14px;cursor:pointer;padding:8px;margin:-8px;flex-shrink:0;
  font-family:inherit;white-space:nowrap}
.toast-btn:focus-visible{outline:2px solid #8ab4ff;outline-offset:1px}
@keyframes toast-auf{from{opacity:0;transform:translateY(14px)}
                     to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app">

  <!-- LOGIN-GATE: wer bin ich? -->
  <div class="gate" id="gate">
    <h1>Familie Nadig</h1>
    <p>Wer bist du?</p>
    <div class="who" id="whoList"></div>
  </div>

  <!-- HOME -->
  <div id="home">
    <div class="topbar">
      <div class="ti-wrap">
        <h1>Familie Nadig</h1>
        <button type="button" class="sync" onclick="syncTap()" aria-label="Synchronisierung"><span class="dot" aria-hidden="true"></span><span id="syncTxt" role="status" aria-live="polite">Verbinde…</span> <span id="verTxt" style="opacity:.6;margin-left:4px"></span></button>
      </div>
      <div class="kopf-rechts">
        <div class="flaggen" role="group" aria-label="Sprache wählen / Taal kiezen">
          <button type="button" class="flagge" data-lang="de" onclick="spracheSetzen('de')"
            aria-label="Deutsch" title="Deutsch">🇩🇪</button>
          <button type="button" class="flagge" data-lang="nl" onclick="spracheSetzen('nl')"
            aria-label="Nederlands" title="Nederlands">🇳🇱</button>
        </div>
        <button type="button" class="me" onclick="meMenu()" aria-label="Angemeldeter Nutzer, Menü öffnen">
          <div class="av" id="meAv" aria-hidden="true">?</div>
        </button>
      </div>
    </div>
    <div class="gsuche-wrap"><div class="gsuche">
      <span class="gsuche-ic"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>
      <label for="gsuche" class="sr-only">Alle Bereiche durchsuchen</label>
      <input id="gsuche" type="search" placeholder="Alles durchsuchen…" oninput="globalSuche(this.value)" autocomplete="off">
      <button type="button" id="gsuche-x" class="gsuche-x" style="display:none" onclick="globalSucheClear()" aria-label="Suche zurücksetzen">×</button>
    </div></div>
    <div id="gsuche-ergebnis"></div>
    <div id="countdownSlot"></div>
    <div id="heuteSlot"></div>
    <div id="fuerDichSlot"></div>
    <div id="nachrichtenSlot"></div>
    <details class="bereiche" id="bereiche">
      <summary><span id="bereicheLabel">Alle Bereiche</span><span class="chev" aria-hidden="true">&#8964;</span></summary>
      <div class="grid" id="tiles"></div>
    </details>
  </div>

  <!-- DETAIL -->
  <div class="view" id="view">
    <div class="vhead">
      <button class="back" onclick="goBack()" aria-label="Zurück">‹</button>
      <div style="flex:1">
        <h2 id="vtitle"></h2>
        <div class="sub" id="vsub"></div>
      </div>
      <button class="toolbtn" id="vtool" style="display:none"></button>
    </div>
    <div id="vbody"></div>
  </div>
</div>

<!-- ADD BAR (einfache Listen) -->
<div class="addbar" id="addbar" style="display:none">
  <label for="addinput" class="sr-only">Neuer Eintrag</label>
  <input id="addinput" placeholder="Hinzufügen…" enterkeyhint="done" autocomplete="off">
  <button class="addbtn" onclick="addCurrent()" aria-label="Hinzufügen">+</button>
</div>

<!-- FAB (Karten-Module mit Formular) -->
<button class="fab" id="fab" style="display:none" onclick="fabAction()" aria-label="Neu anlegen">+</button>

<!-- MODAL -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Eingabe"></div>
</div>

<!-- TOAST: nicht blockierende Hinweise mit Rückgängig-Funktion -->
<div class="toast-halter" id="toastHalter" aria-live="polite" aria-atomic="false"></div>

<!-- KARTE (Reise-Kartenansicht, Vollbild) -->
<div id="kartePanel">
  <div class="karte-top">
    <div class="karte-titel" id="karteTitel">Karte</div>
    <button class="back" onclick="karteSchliessen()" aria-label="Karte schließen">×</button>
  </div>
  <div id="karteMap"></div>

// ---- Foto: nativ (Capacitor) oder Web-Datei-Dialog ----
function pickPhoto(useCamera, cb){
  // Native App? Dann echte Kamera/Galerie via Capacitor.
  if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()){
    pickPhotoNative(useCamera, cb);
    return;
  }
  // Web-Fallback: Datei-Dialog (bietet auf dem Handy Kamera/Galerie an)
  const inp = document.getElementById("photoInput");
  inp.value = "";
  if(useCamera) inp.setAttribute("capture","environment"); else inp.removeAttribute("capture");
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = e => downscale(e.target.result, cb);
    r.readAsDataURL(f);
  };
  inp.click();
}
async function pickPhotoNative(useCamera, cb){
  try{
    const { Camera } = window.Capacitor.Plugins;
    const photo = await Camera.getPhoto({
      quality: 75, resultType: "dataUrl", allowEditing: false,
      source: useCamera ? "CAMERA" : "PHOTOS",
      saveToGallery: false
    });
    downscale(photo.dataUrl, cb);
  }catch(e){ /* Nutzer hat abgebrochen */ }
}
function downscale(dataUrl, cb){
  const img = new Image();
  img.onload = () => {
    const max = 1000, sc = Math.min(1, max/Math.max(img.width,img.height));
    const c = document.createElement("canvas");
    c.width = img.width*sc; c.height = img.height*sc;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg",0.75));
  };
  img.src = dataUrl;
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ============================================================
//  Sichere Links
// ============================================================
// esc() verhindert das Ausbrechen aus dem href-Attribut, filtert aber keine
// gefaehrlichen Schemata. Ein ueber den Sync eingespielter Link "javascript:…"
// wuerde sonst beim Antippen Code im App-Kontext ausfuehren – mit Zugriff auf
// die OneDrive-Anmeldedaten. Deshalb: Positivliste erlaubter Schemata.
function sichereUrl(u){
  const roh = String(u==null?"":u).trim();
  if(!roh) return "";
  try{
    const url = new URL(roh, location.href);
    return ["http:","https:","mailto:","tel:"].includes(url.protocol) ? url.href : "";
  }catch(e){ return ""; }
}

const Fehlerlog = {
  puffer: [],
  erfasse(kontext, fehler){
    const e = { zeit: now(), kontext,
      nachricht: String((fehler && fehler.message) || fehler || "unbekannt"),
      nutzer: (typeof ME!=="undefined" ? ME : null), version: APP_VERSION };
    this.puffer.push(e);
    if(this.puffer.length > 50) this.puffer.shift();
    try{ localStorage.setItem("familienapp.fehler", JSON.stringify(this.puffer)); }catch(x){}
    console.warn("[" + kontext + "]", fehler);
  },
  laden(){
    try{ this.puffer = JSON.parse(localStorage.getItem("familienapp.fehler")) || []; }
    catch(e){ this.puffer = []; }
    return this.puffer;
  },
  leeren(){ this.puffer = []; try{ localStorage.removeItem("familienapp.fehler"); }catch(e){} }
};
Fehlerlog.laden();

// ============================================================
//  Toast – nicht blockierende Rueckmeldung statt alert()/confirm()
// ============================================================
// Loeschvorgaenge fragen nicht mehr nach, sondern lassen sich rueckgaengig machen.
// Das ist einen Klick kuerzer UND sicherer, weil umkehrbar.
window.toast = (text, aktion) => {
  const halter = document.getElementById("toastHalter");
  if(!halter){ console.info(text); return; }
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span class="toast-tx">${esc(text)}</span>` +
    (aktion ? `<button type="button" class="toast-btn">${esc(aktion.label)}</button>` : "");
  if(aktion){
    el.querySelector(".toast-btn").addEventListener("click", () => {
      try{ aktion.fn(); }catch(e){ Fehlerlog.erfasse("toast-aktion", e); }
      el.remove();
    });
  }
  halter.appendChild(el);
  const dauer = aktion ? 6000 : 3600;
  setTimeout(()=>{ el.classList.add("weg"); }, dauer);
  setTimeout(()=>{ el.remove(); }, dauer + 400);
  // Nie mehr als drei Meldungen gleichzeitig
  while(halter.children.length > 3) halter.firstElementChild.remove();
};
function empty(ic,txt){ return `<div class="empty"><div class="ei">${ICON[ic]||""}</div>${txt}</div>`; }
function mapsLink(addr){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(addr); }
// Liefert ein Maps-Routen-Ziel ("lat,lon" bevorzugt, sonst Name) für einen Ort.
function mapsPoint(o){
  if(!o) return "";
  if(o.lat!=null) return o.lat+","+o.lon;
  return [o.name,o.plz,o.land].filter(Boolean).join(", ") || o.adresse || o.name || "";
}
// Google-Maps-Routenlink von a nach b, optional über Zwischenstopps (Array von Orten).
function mapsRouteLink(a, b, stops){
  const orig = encodeURIComponent(mapsPoint(a));
  const dest = encodeURIComponent(mapsPoint(b));
  let url = "https://www.google.com/maps/dir/?api=1&origin="+orig+"&destination="+dest+"&travelmode=driving";
  const wp = (stops||[]).map(mapsPoint).filter(Boolean);
  if(wp.length) url += "&waypoints="+wp.map(encodeURIComponent).join("%7C");
  return url;
}
// Schneidet alles vor dem ersten http(s):// ab und liefert einen sauberen Link – oder "" wenn keiner drin ist.
function cleanLink(text){
  if(!text) return "";
  const m = String(text).match(/https?:\/\/\S+/);
  // sichereUrl() prueft zusaetzlich das Schema, damit kein "javascript:"-Link
  // ueber den Sync in die Oberflaeche gelangen kann.
  return m ? sichereUrl(m[0]) : "";
}
// Liefert das beste Ziel zum Öffnen: echter Link bevorzugt, sonst Maps-Suche aus Adresse/Koordinaten/Name.
function openTarget(obj){
  const lk = cleanLink(obj.link);
  if(lk) return lk;
  if(obj.adresse) return mapsLink(obj.adresse);
  if(obj.lat!=null) return mapsLink(obj.lat+","+obj.lon);
  if(obj.name) return mapsLink(obj.name);
  return "";
}
// Datum als YYYY-MM-DD in LOKALER Zeit. toISOString() wuerde durch den UTC-Versatz
// in Mitteleuropa den Tag um eins zurueckschieben (MEZ und MESZ gleichermassen).
function isoLokal(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const heuteISO = () => isoLokal(new Date());
// Monate addieren und dabei auf das Monatsende klemmen (31.01. + 1 Monat = 28./29.02.)
function monateAddieren(d, n){
  const tag = d.getDate();
  const ziel = new Date(d.getFullYear(), d.getMonth()+n, 1);
  const maxTag = new Date(ziel.getFullYear(), ziel.getMonth()+1, 0).getDate();
  ziel.setDate(Math.min(tag, maxTag));
  return ziel;
}
function fmtDate(iso){ if(!iso)return ""; const d=new Date(iso); return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}); }
// Anzahl Tage zwischen zwei Datumsangaben (inkl. beider Tage), z.B. für "5 Tage"
function tageAnzahl(von,bis){
  if(!von) return 0;
  const a=new Date(von+"T00:00:00"); const b=bis?new Date(bis+"T00:00:00"):a;
  const diff=Math.round((b-a)/86400000)+1;
  return diff>0?diff:0;
}
// Naechte = Tage minus 1 (Anreise- und Abreisetag zaehlen als ein Tag, aber
// dazwischen liegt eine Nacht weniger). Ein eintaegiger Aufenthalt hat 0 Naechte.
function naechteAnzahl(von,bis){
  const n=tageAnzahl(von,bis);
  return n>1 ? n-1 : 0;
}
// Reiner Text, z.B. "3 Tage · 2 Nächte" – fuer Kopfzeilen ohne HTML
function tageNaechteText(von,bis){
  const n=tageAnzahl(von,bis); if(!n) return "";
  const nn=naechteAnzahl(von,bis);
  return `${n} ${n===1?"Tag":"Tage"}` + (nn?` · ${nn} ${nn===1?"Nacht":"Nächte"}`:"");
}
function tageSuffix(von,bis){
  const txt=tageNaechteText(von,bis);
  return txt?` <span style="color:var(--ink2);font-weight:500">· ${txt}</span>`:"";
}
// Liste der Datumsangaben (ISO) von–bis, für die Tagesplanung
function datumsListe(von,bis){
  if(!von) return [];
  const out=[]; const a=new Date(von+"T00:00:00"); const b=bis?new Date(bis+"T00:00:00"):a;
  for(let d=new Date(a); d<=b; d.setDate(d.getDate()+1)) out.push(isoLokal(d));
  return out;
}
// kleines Warndreieck mit Ausrufezeichen, wenn Adresse/Ort fehlt
function warnAdresse(fehlt,titel){
  if(!fehlt) return "";
  return `<span class="warn-adr" title="${esc(titel||"Adresse fehlt")}">⚠️</span>`;
}
function daysUntil(iso){ if(!iso)return null; const d=new Date(iso); d.setHours(0,0,0,0); const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }

// ---- Kalender-Export ----
// Google-Kalender-Link für einen einzelnen Termin (ganztägig oder mit Zeitraum).
function gcalLink(titel, startISO, endISO, details){
  const fmt = d => { const x=new Date(d); return x.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z"; };
  const fmtDay = d => { const x=new Date(d); return x.getFullYear()+String(x.getMonth()+1).padStart(2,"0")+String(x.getDate()).padStart(2,"0"); };
  let dates;
  if(startISO && startISO.length<=10){ // reines Datum -> ganztägig
    const end = endISO ? new Date(endISO) : new Date(startISO);
    end.setDate(end.getDate()+1); // Google: Enddatum exklusiv
    dates = fmtDay(startISO)+"/"+fmtDay(end);
  } else {
    const s = startISO ? fmt(startISO) : fmt(new Date());
    const e = endISO ? fmt(endISO) : fmt(new Date(new Date(startISO||Date.now()).getTime()+3600000));
    dates = s+"/"+e;
  }
  const p = new URLSearchParams({ action:"TEMPLATE", text:titel||"Termin", dates, details:details||"" });
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
// ICS-Datei (für mehrere Termine / universellen Import) als Download
function downloadICS(events, filename){
  const pad=n=>String(n).padStart(2,"0");
  const dt=d=>{const x=new Date(d);return x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate());};
  const dtStamp=()=>{const x=new Date();return x.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";};
  let ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FamilieNadig//DE\r\nCALSCALE:GREGORIAN\r\n";
  events.forEach(ev=>{
    const endExcl=ev.end?new Date(ev.end):new Date(ev.start);
    endExcl.setDate(endExcl.getDate()+1);
    ics+="BEGIN:VEVENT\r\n";
    ics+="UID:"+(ev.uid||uid())+"@familienadig\r\n";
    ics+="DTSTAMP:"+dtStamp()+"\r\n";
    ics+="DTSTART;VALUE=DATE:"+dt(ev.start)+"\r\n";
    ics+="DTEND;VALUE=DATE:"+dt(endExcl)+"\r\n";
    ics+="SUMMARY:"+(ev.titel||"Termin").replace(/[\r\n,;]/g," ")+"\r\n";
    if(ev.details) ics+="DESCRIPTION:"+ev.details.replace(/[\r\n]/g," ").replace(/[,;]/g," ")+"\r\n";
    ics+="END:VEVENT\r\n";
  });
  ics+="END:VCALENDAR";
  const blob=new Blob([ics],{type:"text/calendar"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=(filename||"termine")+".ics";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

window.chooseMe = n => {
  ME = n; localStorage.setItem("familienapp.me", n);
  document.getElementById("gate").style.display = "none";
  document.getElementById("meAv").textContent = initials(n);
  // Jede Person hat ihre eigene Anzeigesprache
  spracheLaden();
  document.documentElement.lang = SPRACHE;
  flaggenAktualisieren();
  renderHome();
  uebersetzeDom(document.body);
};
// ============================================================
//  Zweisprachigkeit Deutsch / Niederländisch
// ============================================================
// Die Sprache wird PRO NUTZER gespeichert und mitsynchronisiert: Ellen sieht
// die App auf Deutsch, während dieselbe Einkaufsliste bei Mama auf
// Niederländisch erscheint. Übersetzt wird ausschließlich die ANZEIGE –
// gespeichert bleibt immer der eingegebene Originaltext. So geht beim
// Abgleich zwischen den Geräten nichts verloren und niemand überschreibt
// die Eingabe eines anderen.
let SPRACHE = "de";

function spracheLaden(){
  const proNutzer = (DB.nutzerSprache || {})[ME];
  SPRACHE = proNutzer || localStorage.getItem("familienapp.sprache") || "de";
  return SPRACHE;
}
window.spracheSetzen = code => {
  SPRACHE = (code === "nl") ? "nl" : "de";
  try{ localStorage.setItem("familienapp.sprache", SPRACHE); }catch(e){}
  if(ME){
    DB.nutzerSprache = DB.nutzerSprache || {};
    DB.nutzerSprache[ME] = SPRACHE;
    save();
  }
  flaggenAktualisieren();
  document.documentElement.lang = SPRACHE;
  // BEIDES neu zeichnen: Der Startbildschirm bleibt sonst in der alten Sprache
  // stehen, weil er beim Wechsel aus einer Modulansicht nicht neu gerendert
  // wird – der Nutzer sieht die Umstellung dann erst nach dem Zurückgehen.
  renderHome();
  if(document.getElementById("view").classList.contains("active")) reRenderAktuell();
  // Bereits vorhandene Bereiche (Kopfzeile, offenes Blatt) nachziehen
  uebersetzeDom(document.body);
};
function flaggenAktualisieren(){
  document.querySelectorAll(".flagge").forEach(b => {
    const an = b.dataset.lang === SPRACHE;
    b.classList.toggle("on", an);
    b.setAttribute("aria-pressed", an ? "true" : "false");
  });
}
// Zeichnet die gerade offene Modulansicht neu
function reRenderAktuell(){
  if(CURRENT && RENDER[CURRENT]) RENDER[CURRENT]();
  else renderHome();
}

let _uebersetzungLaeuft = false;

function uebersetzeDom(wurzel){
  if(SPRACHE !== "nl" || !wurzel || _uebersetzungLaeuft) return;
  _uebersetzungLaeuft = true;
  try{
    // 1) Textknoten
    const lauf = document.createTreeWalker(wurzel, NodeFilter.SHOW_TEXT, {
      acceptNode(k){
        const eltern = k.parentNode;
        if(!eltern) return NodeFilter.FILTER_REJECT;
        const tag = eltern.nodeName;
        if(tag === "SCRIPT" || tag === "STYLE" || tag === "TEXTAREA")
          return NodeFilter.FILTER_REJECT;
        return k.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const treffer = [];
    let k;
    while((k = lauf.nextNode())) treffer.push(k);
    treffer.forEach(k => {
      const roh = k.nodeValue;
      const kern = roh.trim();
      const neu = UI_NL[kern] || (TEXTE[kern] && TEXTE[kern].nl);
      if(neu && neu !== kern){
        // umgebende Leerzeichen erhalten
        k.nodeValue = roh.replace(kern, neu);
      }
    });
    // 2) Attribute, die als Text sichtbar werden
    ["placeholder","title","aria-label","value"].forEach(attr => {
      wurzel.querySelectorAll("[" + attr + "]").forEach(el => {
        if(attr === "value" && el.tagName !== "BUTTON") return;
        const alt = el.getAttribute(attr);
        const neu = UI_NL[alt] || (TEXTE[alt] && TEXTE[alt].nl);
        if(neu && neu !== alt) el.setAttribute(attr, neu);
      });
    });
  }catch(e){
    if(window.Fehlerlog) Fehlerlog.erfasse("uebersetzeDom", e);
  }finally{
    _uebersetzungLaeuft = false;
  }
}

// Beobachtet die drei Container und übersetzt nach jeder Neuzeichnung.
// Ohne den Beobachter müsste jede der über 40 Render-Funktionen den Filter
// selbst aufrufen – und jede künftige ebenfalls.
function uebersetzungBeobachten(){
  if(!("MutationObserver" in window)) return;
  const beob = new MutationObserver(aenderungen => {
    if(SPRACHE !== "nl" || _uebersetzungLaeuft) return;
    const wurzeln = new Set();
    aenderungen.forEach(a => {
      const ziel = a.target.nodeType === 1 ? a.target : a.target.parentNode;
      if(ziel) wurzeln.add(ziel);
    });
    wurzeln.forEach(w => uebersetzeDom(w));
  });
  ["home","vbody","sheet","vhead","addbar"].forEach(id => {
    const el = document.getElementById(id);
    if(el) beob.observe(el, { childList:true, subtree:true, characterData:true });
  });
}

// ============================================================
//  Wischgesten auf Artikelzeilen
// ============================================================
// Auf dem Handy ist Wischen die erwartete Bedienung: nach rechts abhaken,
// nach links löschen. Das spart je Artikel einen zielgenauen Treffer auf ein
// kleines Kästchen – beim Einkaufen mit vollen Händen der entscheidende
// Unterschied. Die Knöpfe bleiben erhalten; die Geste ist ein zusätzlicher Weg.
const WISCH_SCHWELLE = 72;      // Pixel bis zum Auslösen
const WISCH_RICHTUNG = 12;      // ab hier gilt die Geste als horizontal

function wischGestenAktivieren(behaelter){
  if(!behaelter || behaelter._wischAktiv) return;
  behaelter._wischAktiv = true;

  let zeile = null, startX = 0, startY = 0, dx = 0, horizontal = null, id = null, lid = null;

  const zuruecksetzen = () => {
    if(zeile){ zeile.style.transition = "transform .18s ease"; zeile.style.transform = ""; 
               zeile.classList.remove("wischt"); }
    zeile = null; horizontal = null; dx = 0;
  };

  behaelter.addEventListener("pointerdown", e => {
    if(e.pointerType === "mouse" && e.button !== 0) return;
    const z = e.target.closest(".wischbar");
    // Auf einem Knopf beginnt keine Geste – sonst würde jeder Tipp zum Wisch
    if(!z || e.target.closest("button")) return;
    zeile = z; startX = e.clientX; startY = e.clientY; dx = 0; horizontal = null;
    id = z.dataset.artikel; lid = z.dataset.liste || null;
    zeile.style.transition = "none";
  }, { passive:true });

  behaelter.addEventListener("pointermove", e => {
    if(!zeile) return;
    dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(horizontal === null){
      if(Math.abs(dx) < WISCH_RICHTUNG && Math.abs(dy) < WISCH_RICHTUNG) return;
      // Senkrechte Bewegung gehört dem Scrollen – Geste verwerfen
      horizontal = Math.abs(dx) > Math.abs(dy);
      if(!horizontal){ zuruecksetzen(); return; }
      zeile.classList.add("wischt");
    }
    // Nach links nur, wenn Löschen möglich ist (eigene Liste)
    const begrenzt = (!lid && dx < 0) ? Math.max(dx, -140) : Math.min(Math.max(dx, lid?0:-140), 140);
    zeile.style.transform = "translateX(" + begrenzt + "px)";
    zeile.classList.toggle("bereit", Math.abs(begrenzt) >= WISCH_SCHWELLE);
  }, { passive:true });

  const beenden = () => {
    if(!zeile || !horizontal){ zuruecksetzen(); return; }
    const weit = Math.abs(dx) >= WISCH_SCHWELLE;
    const zId = id, zLid = lid;
    zuruecksetzen();
    if(!weit) return;
    if(dx > 0){
      // nach rechts: abhaken bzw. wieder öffnen
      if(zLid) toggleEinIn(zLid, zId); else toggleEin(zId);
    } else if(!zLid){
      // nach links: löschen (mit Rückgängig über den Toast)
      delEin(zId);
    }
  };
  behaelter.addEventListener("pointerup", beenden, { passive:true });
  behaelter.addEventListener("pointercancel", zuruecksetzen, { passive:true });
  behaelter.addEventListener("pointerleave", e => { if(zeile && horizontal) beenden(); }, { passive:true });
}

// Übersetzt einen Zutatentext wortweise. Mengen, Zahlen und unbekannte
// Wörter bleiben unverändert stehen.
function zutatUebersetzen(text, ziel){
  const roh = String(text||"");
  if(!roh.trim()) return roh;
  // Von der Familie gepflegte Ergänzungen haben Vorrang
  const eigene = (DB.woerter || {});
  const schluessel = roh.trim().toLowerCase();
  if(eigene[schluessel] && eigene[schluessel][ziel]) return eigene[schluessel][ziel];

  const tabelle = ziel === "nl" ? LEBENSMITTEL : LEBENSMITTEL_NL;
  let getroffen = false;
  const uebersetzt = roh.replace(/[A-Za-zÄÖÜäöüßéèçñ-]{2,}/g, (wort, pos) => {
    const treffer = tabelle[wort.toLowerCase()];
    if(!treffer) return wort;
    getroffen = true;
    // Groß-/Kleinschreibung nach den Regeln der ZIELSPRACHE, nicht der Quelle.
    // Deutsch schreibt Substantive groß, Niederländisch klein – die Schreibung
    // des Originals zu übernehmen ergäbe "500 g Gehakt" bzw. "1 kg kartoffeln".
    // Im Niederländischen wird nur großgeschrieben, was die Zeile eröffnet.
    if(ziel === "de") return treffer.charAt(0).toUpperCase() + treffer.slice(1);
    return pos === 0
      ? treffer.charAt(0).toUpperCase() + treffer.slice(1)
      : treffer.toLowerCase();
  });
  return getroffen ? uebersetzt : roh;
}

// ============================================================
//  PIN-Schutz fuer den Nutzerwechsel
// ============================================================
// Frueher stand der PIN im Klartext im Quelltext – und der ist ueber GitHub
// Pages oeffentlich abrufbar. Jetzt liegt nur noch ein PBKDF2-Hash im Code.
// PBKDF2 mit 250.000 Runden macht das Durchprobieren aller sechsstelligen
// Zahlen zwar nicht unmoeglich, aber teuer genug, um es unattraktiv zu machen.
// Ein geaenderter PIN wird als eigener Hash in DB.sicherheit abgelegt und
// ueber den Sync auf alle Geraete verteilt.
const PIN_SALT       = "familie-nadig-2026";
const PIN_RUNDEN     = 250000;
const PIN_HASH_START = "bc47450a2dc029cd90df67522b893a1da85c8de5bbeea893663323c536d3cf7d";

async function pinHash(pin, salt, runden){
  // crypto.subtle gibt es nur in sicheren Kontexten (HTTPS, App). Beim Oeffnen
  // der Datei ueber file:// fehlt es – dann waere der Nutzerwechsel blockiert,
  // ohne dass der Grund erkennbar ist.
  if(!(window.crypto && window.crypto.subtle))
    throw new Error("Die PIN-Prüfung benötigt eine sichere Verbindung (https). Bitte die App über ihre Web-Adresse öffnen.");
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey(
    "raw", enc.encode(String(pin)), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name:"PBKDF2", salt: enc.encode(salt), iterations: runden, hash:"SHA-256" },
    material, 256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
// Vergleich ohne fruehzeitigen Abbruch (kein Rueckschluss ueber die Laufzeit)
function gleichKonstant(a, b){
  if(a.length !== b.length) return false;
  let d = 0;
  for(let i=0; i<a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return d === 0;
}
async function pinStimmt(eingabe){
  const s = DB.sicherheit;
  if(s && s.pinHash && s.salt && s.runden){
    return gleichKonstant(await pinHash(eingabe, s.salt, s.runden), s.pinHash);
  }
  return gleichKonstant(await pinHash(eingabe, PIN_SALT, PIN_RUNDEN), PIN_HASH_START);
}

window.pinAendernSpeichern = async () => {
  const meld = document.getElementById("pinAendernFehler");
  const btn  = document.getElementById("pinAendernBtn");
  const alt  = document.getElementById("pinAlt").value.trim();
  const neu  = document.getElementById("pinNeu").value.trim();
  const neu2 = document.getElementById("pinNeu2").value.trim();
  if(!/^\d{4,}$/.test(neu)){ meld.textContent = "Der neue PIN muss aus mindestens vier Ziffern bestehen."; return; }
  if(neu !== neu2){ meld.textContent = "Die beiden Eingaben stimmen nicht überein."; return; }
  btn.disabled = true; btn.textContent = "Prüfe…";
  try{
    if(!(await pinStimmt(alt))){
      meld.textContent = "Der bisherige PIN ist falsch.";
      btn.disabled = false; btn.textContent = "Neuen PIN speichern";
      return;
    }
    const salt = [...crypto.getRandomValues(new Uint8Array(16))]
                   .map(b=>b.toString(16).padStart(2,"0")).join("");
    DB.sicherheit = { salt, runden: PIN_RUNDEN,
                      pinHash: await pinHash(neu, salt, PIN_RUNDEN),
                      geaendertAm: now(), geaendertVon: ME };
    save();
    closeModal();
    toast("PIN geändert – gilt auf allen Geräten.");
  }catch(e){
    Fehlerlog.erfasse("pinAendern", e);
    meld.textContent = "Ändern fehlgeschlagen. Bitte erneut versuchen.";
    btn.disabled = false; btn.textContent = "Neuen PIN speichern";
  }
};
window.pruefePin = async () => {
  const feld = document.getElementById("pinInput");
  const meld = document.getElementById("pinFehler");
  const btn  = document.getElementById("pinBtn");
  const v = feld.value.trim();
  if(btn){ btn.disabled = true; btn.textContent = "Prüfe…"; }
  try{
    // Ab dem dritten Fehlversuch wachsende Wartezeit (max. 8 s)
    if(_pinFehlversuche >= 3){
      const warte = Math.min(8000, 500 * Math.pow(2, _pinFehlversuche - 3));
      meld.textContent = "Zu viele Fehlversuche – bitte kurz warten.";
      await new Promise(r => setTimeout(r, warte));
    }
    if(await pinStimmt(v)){
      _pinFehlversuche = 0;
      closeModal();
      localStorage.removeItem("familienapp.me"); ME = null;
      document.getElementById("gate").style.display = "flex";
      renderGate();
      return;
    }
    _pinFehlversuche++;
    meld.textContent = "Falscher PIN.";
    if(feld){ feld.value = ""; feld.focus(); }
  }catch(e){
    Fehlerlog.erfasse("pruefePin", e);
    meld.textContent = (e && e.message && /sichere Verbindung/.test(e.message))
      ? e.message : "Prüfung fehlgeschlagen. Bitte erneut versuchen.";
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "Bestätigen"; }
  }
};

// ============================================================
//  Tagesübersicht – der Startbildschirm beantwortet "Was ist heute?"
// ============================================================
// Bis v2.3.0 zeigte der Startbildschirm zwölf gleichrangige Kacheln; die
// eigentliche Information stand darunter und war nur nach Scrollen sichtbar.
// Jetzt steht sie oben, die Modulliste klappt darunter auf.
function renderHeute(){
  const slot = document.getElementById("heuteSlot");
  if(!slot) return;
  const erlaubt = erlaubteModule();
  const darf = id => erlaubt === null || erlaubt.includes(id);

  const heute = heuteISO();
  // Eine Quelle für alles: kalenderEintraege() führt Termine, Aufgaben,
  // Reparaturen, Essensplan und Reisen bereits zusammen.
  // Enges Fenster: nur der heutige Tag – Serien werden nur dafür berechnet.
  const eintraege = kalenderEintraege(heute, heute)
    .filter(e => e.datum === heute && !e.zwischentag)
    .filter(e => darf(e.modul || "kalender"))
    .sort((a,b) => String(a.zeit||"~").localeCompare(String(b.zeit||"~")));

  const offeneHeute = DB.todos.filter(t =>
    !t.done && !t.deleted && t.faellig && t.faellig <= heute).length;

  const zeilen = eintraege.slice(0, 6).map(e => `
    <button type="button" class="heute-zeile" onclick="open_('${esc(e.modul||"kalender")}')">
      <span class="hz-punkt" style="background:${esc(e.farbe||"var(--accent)")}" aria-hidden="true"></span>
      <span class="hz-zeit">${esc(e.zeit || "")}</span>
      <span class="hz-titel">${esc(e.titel)}</span>
      <span class="hz-typ">${esc(e.typ||"")}</span>
    </button>`).join("");

  const mehr = eintraege.length > 6
    ? `<button type="button" class="heute-mehr" onclick="open_('kalender')">
         ${eintraege.length - 6} weitere anzeigen</button>` : "";

  const leer = `<div class="heute-leer">${t("Für heute ist nichts eingetragen.")}</div>`;

  // Schnellzugriff: die drei häufigsten Vorgänge, jeweils ein Tipp entfernt
  const schnell = [
    darf("einkauf") ? `<button type="button" class="qa" onclick="schnellEinkauf()">
        ${ICON.cart}<span>${t("Einkauf")}</span></button>` : "",
    darf("todos") ? `<button type="button" class="qa" onclick="schnellAufgabe()">
        ${ICON.checkbox}<span>${t("Aufgabe")}</span></button>` : "",
    darf("kalender") ? `<button type="button" class="qa" onclick="schnellTermin()">
        ${ICON.cal}<span>${t("Termin")}</span></button>` : "",
  ].filter(Boolean).join("");

  slot.innerHTML = `
    <section class="heute" aria-labelledby="heuteTitel">
      <div class="heute-kopf">
        <h2 id="heuteTitel">${t("Heute")}</h2>
        <span class="heute-datum">${esc(heuteLang())}</span>
      </div>
      ${eintraege.length ? zeilen + mehr : leer}
      ${offeneHeute ? `<button type="button" class="heute-offen" onclick="open_('todos')">
          ${offeneHeute} ${offeneHeute===1?"Aufgabe ist":"Aufgaben sind"} fällig</button>` : ""}
      ${schnell ? `<div class="qa-reihe">${schnell}</div>` : ""}
    </section>`;
}

// Datum ausgeschrieben, z. B. "Sonntag, 26. Juli"
function heuteLang(){
  const d = new Date();
  const tage = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  const monate = ["Januar","Februar","März","April","Mai","Juni","Juli",
                  "August","September","Oktober","November","Dezember"];
  return `${t(tage[d.getDay()])}, ${d.getDate()}. ${t(monate[d.getMonth()])}`;
}

function renderFuerDich(){
  let slot = document.getElementById("fuerDichSlot");
  if(!slot){
    slot = document.createElement("div"); slot.id="fuerDichSlot";
    document.getElementById("tiles").after(slot);
  }
  // Prüft, ob die angemeldete Person zuständig ist (Einzel- oder Mehrfachzuweisung)
  const istMeins = e => {
    if(e.werListe && e.werListe.length) return e.werListe.includes(ME);
    if(e.wer) return e.wer.split(",").map(s=>s.trim()).includes(ME);
    return e.autor===ME;   // ohne Zuweisung: für den Ersteller
  };
  const relevantVon = (arr, typ) => arr.filter(t=>{
    if(t.done||t.deleted) return false;
    if(!istMeins(t)) return false;
    const d = t.faellig ? daysUntil(t.faellig) : null;
    return (d!==null && d<=3) || t.prio==="hoch";
  }).map(t=>({...t, _typ:typ}));
  // To-dos UND Reparaturen zusammenführen
  const relevant = [...relevantVon(DB.todos,"todo"), ...relevantVon(DB.reparaturen,"reparatur")]
    .sort((a,b)=>{ const da=a.faellig?daysUntil(a.faellig):999, db=b.faellig?daysUntil(b.faellig):999; return da-db; });
  if(!relevant.length){ slot.innerHTML=""; return; }
  slot.innerHTML = `<div class="fd-head">Für dich, ${esc(ME)}</div>
    <div class="fd-list">${relevant.slice(0,6).map(t=>{
      const d = t.faellig?daysUntil(t.faellig):null;
      const when = d===null?"" : d<0?"überfällig" : d===0?"heute" : d===1?"morgen" : "in "+d+" Tagen";
      const urgent = (d!==null&&d<=0) || t.prio==="hoch";
      const listLink = !!t.einkauf;
      const ziel = listLink ? "einkauf" : (t._typ==="reparatur" ? "reparaturen" : "todos");
      const typLabel = t._typ==="reparatur" ? "Reparatur" : (listLink ? "Einkauf" : "Aufgabe");
      return `<div class="fd-item ${urgent?'urgent':''}" onclick="open_('${ziel}')">
        <div class="fd-dot ${urgent?'u':''}"></div>
        <div class="fd-tx"><div class="fd-titel">${esc(t.titel)}</div>
          <div class="fd-meta">${typLabel}${when?" · "+when:""}${t.prio==="hoch"?" · dringend":""}</div></div>
        ${listLink?`<div class="fd-go">${ICON.cart}</div>`:`<div class="fd-go">›</div>`}
      </div>`;
    }).join("")}</div>`;
}

// Handy-Benachrichtigung (Web Notifications API). Erscheint, wenn die App
// im Hintergrund läuft / das Display an ist und die Berechtigung erteilt wurde.
function handyBenachrichtigung(titel, text){
  try{
    if(!("Notification" in window)) return;
    if(Notification.permission!=="granted") return;
    const n = new Notification(titel, {
      body: text||"",
      icon: document.querySelector('link[rel="apple-touch-icon"]')?.href,
      tag: "familie-nadig",
      renotify: true
    });
    n.onclick = () => { try{ window.focus(); }catch(e){} n.close(); };
  }catch(e){}
}
// Berechtigung anfragen (über eine Nutzeraktion, z.B. im Sync-Dialog)
window.benachrichtigungenAktivieren = (still) => {
  if(!("Notification" in window)){ if(!still) toast("Dieses Gerät unterstützt keine Benachrichtigungen."); return; }
  if(Notification.permission==="granted"){ if(!still) toast("Benachrichtigungen sind bereits aktiv."); return; }
  if(Notification.permission==="denied"){ if(!still) alert("Benachrichtigungen wurden im Browser/Gerät blockiert. Bitte in den Einstellungen für diese Seite erlauben."); return; }
  Notification.requestPermission().then(p=>{
    if(p==="granted" && !still) handyBenachrichtigung("Benachrichtigungen aktiv", "Du wirst informiert, sobald eine neue Liste da ist.");
    if(modal.classList.contains("active")) closeModal();
  }).catch(()=>{});
};

// Erstellt eine Nachricht für alle anderen Nutzer (außer dem Absender).
function notify(text, opts){
  opts = opts || {};
  if(!DB.nachrichten) DB.nachrichten=[];
  DB.nachrichten.push({
    id:uid(), text, von:ME, ziel: opts.ziel||null, listeId: opts.listeId||null,
    gelesenVon:[ME],
    createdAt:now(), updatedAt:now()
  });
}
// Alte Nachrichten aufräumen – NUR beim Start, mit Tombstone, damit die Löschung
// synchronisiert und nicht vom Fernstand wiederhergestellt wird.
function nachrichtenAufraeumen(){
  const grenze = Date.now()-30*86400000;
  (DB.nachrichten||[]).forEach(n=>{
    if(!n.deleted && n.createdAt && new Date(n.createdAt).getTime()<=grenze){
      n.deleted=true; n.deletedAt=now(); n.updatedAt=now();
    }
  });
  DB.nachrichten = (DB.nachrichten||[]).filter(n=>
    !(n.deleted && n.deletedAt && (Date.now()-new Date(n.deletedAt).getTime())>30*86400000));
}
// Nachrichten, die für den aktuellen Nutzer ungelesen sind
function ungeleseneNachrichten(){
  if(!DB.nachrichten) return [];
  return DB.nachrichten.filter(n=>{
    if(n.deleted) return false;
    if(n.von===ME) return false;
    if(n.ziel && n.ziel!==ME) return false;
    return !(n.gelesenVon||[]).includes(ME);
  });
}

  let slot = document.getElementById("nachrichtenSlot");
  if(!slot){
    slot = document.createElement("div"); slot.id="nachrichtenSlot";
    document.getElementById("tiles").after(slot);
  }
  const offen = ungeleseneNachrichten();
  if(!offen.length){ slot.innerHTML=""; return; }
  slot.innerHTML = offen.map(n=>`
    <div class="notice" onclick="nachrichtGelesen('${n.id}')">
      <div class="notice-ic">🔔</div>
      <div class="notice-tx"><div class="notice-titel">${esc(n.text)}</div>
        <div class="notice-meta">von ${esc(n.von)} · tippen zum Bestätigen</div></div>
      <div class="notice-x">×</div>
    </div>`).join("");
}
window.nachrichtGelesen = id => {
  const n = DB.nachrichten.find(x=>x.id===id); if(!n)return;
  n.gelesenVon = n.gelesenVon||[]; if(!n.gelesenVon.includes(ME)) n.gelesenVon.push(ME);
  n.updatedAt=now(); save();
  // Wenn die Nachricht auf eine Einkaufsliste verweist, direkt dorthin
  if(n.listeId){ open_("einkauf"); }
  else renderNachrichten();
};

let CURRENT = null;
let DETAIL_OPEN = null;   // wenn eine Reise-Detailansicht offen ist

// ---- Handy-Zurück-Taste: in der App navigieren statt sie zu verlassen ----
// Wir schieben bei jedem "Vertiefen" einen Verlaufseintrag in die Browser-History.
// popstate (Zurück-Taste) ruft dann handleBack() auf.
function pushNav(){ try{ history.pushState({app:true}, ""); }catch(e){} }
let _backBusy = false;
function handleBack(){
  // 0. Offene Kartenansicht? -> schließen
  const kp=document.getElementById("kartePanel");
  if(kp && kp.style.display==="flex"){ karteSchliessen(true); return true; }
  // 1. Offenes Modal? -> schließen (ohne erneuten history.back, da popstate schon zurückging)
  if(modal.classList.contains("active")){ modal.classList.remove("active"); return true; }
  // 2. Detailansicht offen (Reise / To-do-Liste)? -> zurück zur Liste
  if(DETAIL_OPEN){ goBack(); return true; }
  // 3. In einem Modul? -> zum Dashboard
  if(CURRENT){ goHome(); return true; }
  // 4. Schon auf dem Dashboard -> nichts mehr abzufangen

    try{ _fokusVorSheet.focus({ preventScroll:true }); }catch(e){}
