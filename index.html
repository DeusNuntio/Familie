<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<script>
// Fallback: Falls der Microsoft-Server die MSAL-Bibliothek nicht geliefert hat,
// von einem zweiten CDN (jsdelivr) nachladen. Synchron per document.write, damit
// sie vor dem App-Start bereitsteht.
if (typeof msal === "undefined") {
  document.write('<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"><\/script>');
}
</script>
<style>
:root{
  --bg:#eef3fb; --surface:#ffffff; --ink:#172033; --ink2:#647089;
  --line:#dde5f2; --accent:#1d4ed8; --accent-2:#2563eb; --accent-soft:#dfe9fd;
  --warm:#d97706; --warm-soft:#fef0dc; --ok:#1d8a52; --ok-soft:#dcf2e6;
  --danger:#dc2626; --r:16px;
  --shadow:0 1px 3px rgba(23,32,51,.06),0 8px 22px rgba(29,78,216,.07);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0e1626;--surface:#16203400;--surface:#172034;--ink:#e8edf7;--ink2:#8b97b0;
  --line:#26324a;--accent:#5b8def;--accent-2:#6d9bf5;--accent-soft:#1c2c4d;
  --warm:#e0934a;--warm-soft:#32261a;--ok:#5cc08a;--ok-soft:#1a2e24;--danger:#f06464;
  --shadow:0 1px 3px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.5;overscroll-behavior-y:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ---- Login-Gate ---- */
.gate{position:fixed;inset:0;background:linear-gradient(160deg,#1d4ed8,#2563eb 55%,#1e3a8a);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;padding:30px;text-align:center}
.gate h1{color:#fff;font-size:30px;font-weight:700;margin:0 0 6px;letter-spacing:-.5px}
.gate p{color:rgba(255,255,255,.85);font-size:15px;margin:0 0 40px}
.gate .who{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.gate .person{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
  backdrop-filter:blur(8px);border-radius:20px;padding:24px 28px;cursor:pointer;
  transition:.15s;min-width:120px}
.gate .person:active{transform:scale(.95);background:rgba(255,255,255,.25)}
.gate .av{width:60px;height:60px;border-radius:50%;background:#fff;color:var(--accent);
  font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px}
.gate .nm{color:#fff;font-weight:600;font-size:16px}

/* ---- Header ---- */
.topbar{padding:16px 20px 10px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:20}
.topbar .ti-wrap{display:flex;flex-direction:column}
.topbar h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.5px}
.topbar .sync{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:5px;margin-top:2px;cursor:pointer}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.me{display:flex;align-items:center;gap:8px;cursor:pointer}
.me .av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}

/* ---- Countdown-Banner ---- */
.countdown{margin:4px 16px 12px;background:linear-gradient(120deg,var(--accent),var(--accent-2));
  border-radius:var(--r);padding:16px 18px;color:#fff;display:flex;align-items:center;
  gap:14px;box-shadow:var(--shadow);cursor:pointer}
.countdown .big{font-size:30px;font-weight:750;line-height:1}
.countdown .ct-tx{font-size:13px;opacity:.92}
.countdown .ct-nm{font-size:15px;font-weight:600;margin-top:1px}
.fd-head{padding:4px 18px 6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.fd-list{padding:0 16px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.fd-item{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:11px;box-shadow:var(--shadow);cursor:pointer}
.fd-item:active{transform:scale(.99)}
.fd-item.urgent{border-color:var(--danger)}
.fd-dot{width:9px;height:9px;border-radius:50%;background:var(--warm);flex-shrink:0}
.fd-dot.u{background:var(--danger)}
.fd-tx{flex:1;min-width:0}
.fd-titel{font-weight:600;font-size:14.5px}
.fd-meta{font-size:12px;color:var(--ink2);margin-top:1px}
.fd-go{color:var(--ink2);font-size:16px;flex-shrink:0}
.notice{margin:4px 16px 10px;background:linear-gradient(120deg,#fef0dc,#fde8c8);border:1px solid var(--warm);
  border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:11px;cursor:pointer;box-shadow:var(--shadow)}
@media(prefers-color-scheme:dark){.notice{background:#332615;border-color:var(--warm)}}
.notice-ic{font-size:20px;flex-shrink:0}
.notice-tx{flex:1;min-width:0}
.notice-titel{font-weight:650;font-size:14px;color:var(--ink)}
.notice-meta{font-size:12px;color:var(--ink2);margin-top:1px}
.notice-x{color:var(--ink2);font-size:18px;flex-shrink:0}
.kal-nav{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px}
.kal-nav>div{font-weight:700;font-size:16px;text-transform:capitalize}
.kal-nav button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer}
.kal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 12px}
.kal-head{margin-bottom:4px}
.kal-wt{text-align:center;font-size:11px;font-weight:700;color:var(--ink2);padding:4px 0}
.kal-zelle{aspect-ratio:1;border-radius:9px;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px;cursor:pointer;position:relative}
.kal-zelle.leer{background:transparent;border:none;cursor:default}
.kal-zelle.heute{border-color:var(--accent);border-width:2px}
.kal-zelle.hat{background:var(--accent-soft)}
.kal-num{font-size:13px;font-weight:600}
.kal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.kal-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.kal-legende{display:flex;flex-wrap:wrap;gap:12px;padding:14px 16px 4px;font-size:12px;color:var(--ink2)}
.kal-legende span{display:inline-flex;align-items:center;gap:5px}
.gsuche-wrap{padding:0 16px 12px}
.gsuche{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 14px}
.gsuche-ic{color:var(--ink2);display:flex}
.gsuche input{flex:1;border:none;background:transparent;color:var(--ink);font-size:15px;outline:none}
.gsuche-x{color:var(--ink2);font-size:20px;cursor:pointer;padding:0 4px}

/* ---- Home grid ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 16px 100px}
.tile{background:var(--surface);border-radius:var(--r);padding:17px 16px;position:relative;
  box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;
  transition:transform .12s;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);
  color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:21px}
.tile .nm{font-weight:650;font-size:15px;margin-top:13px;line-height:1.2}
.tile .ct{font-size:12.5px;color:var(--ink2);margin-top:3px}

/* ---- Detail view ---- */
.view{display:none;flex-direction:column;flex:1;padding-bottom:100px}
.view.active{display:flex}
.vhead{padding:6px 16px 12px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;background:var(--bg);z-index:15}
.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vhead h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.3px}
.vhead .sub{font-size:12.5px;color:var(--ink2);margin-top:1px}

.list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:13px 15px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.row .cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#fff;transition:.12s}
.row .cb.on{background:var(--accent);border-color:var(--accent)}
.row .tx{flex:1;font-size:15px}
.row.done .tx{text-decoration:line-through;color:var(--ink2)}
.row .meta{font-size:12px;color:var(--ink2)}
.row .qty{font-size:13px;font-weight:600;padding:5px 11px;border-radius:20px;cursor:pointer;
  white-space:nowrap;border:1px solid var(--line);color:var(--ink2);transition:.12s}
.row .qty.set{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.row .qty:active{transform:scale(.93)}
.row.done .qty{opacity:.5}
.row .del{color:var(--ink2);font-size:18px;cursor:pointer;opacity:.5;padding:4px}
.row .del:active{opacity:1}

.section-label{padding:16px 18px 6px;font-size:12px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}

/* ---- Karten-Eintrag (To-do, Reparatur, Urlaub) ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:14px 15px;box-shadow:var(--shadow);position:relative}
.card .ch{display:flex;align-items:flex-start;gap:11px}
.card .cbx{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:1px}
.card .cbx.on{background:var(--accent);border-color:var(--accent)}
.card .cttl{font-weight:650;font-size:15.5px;flex:1}
.card.done .cttl{text-decoration:line-through;color:var(--ink2)}
.card .cdesc{font-size:13.5px;color:var(--ink2);margin-top:5px;white-space:pre-wrap}
.card .cmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
.pill{font-size:11.5px;padding:3px 10px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.pill.due{background:var(--warm-soft);color:var(--warm)}
.pill.due.over{background:#fde8e8;color:var(--danger)}
.pill.prio-hoch{background:#fde8e8;color:var(--danger)}
.pill.prio-mittel{background:var(--warm-soft);color:var(--warm)}
.pill.prio-niedrig{background:var(--ok-soft);color:var(--ok)}
.pill.who{background:var(--accent-soft);color:var(--accent)}
.pill.cat{background:var(--accent-soft);color:var(--accent)}
.card .cphoto{margin-top:10px;border-radius:10px;width:100%;max-height:200px;object-fit:cover;display:block}
.card .cdel{position:absolute;top:12px;right:12px;color:var(--ink2);opacity:.5;font-size:18px;cursor:pointer}
.wieder-bar{margin-top:10px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.wieder-fill{height:100%;border-radius:6px;transition:width .3s}

/* ---- Add bar / FAB ---- */
.addbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 72%,transparent);display:flex;gap:9px;z-index:18}
.addbar input{flex:1;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);border-radius:13px;padding:13px 15px;font-size:15px;font-family:inherit}
.addbar input:focus{outline:none;border-color:var(--accent)}
.addbtn{width:50px;border:none;background:var(--accent);color:#fff;border-radius:13px;
  font-size:24px;cursor:pointer;flex-shrink:0}
.addbtn:active{opacity:.85}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));right:max(22px,calc(50% - 218px));
  width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;border:none;
  font-size:30px;box-shadow:0 6px 18px rgba(29,78,216,.4);cursor:pointer;z-index:19;
  display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.92)}

/* ---- Chips ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 12px}
.wg-titel{padding:10px 18px 2px;font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:9px 15px;font-size:14px;cursor:pointer;transition:.12s;color:var(--ink)}
.chip:active{transform:scale(.94);background:var(--accent-soft);border-color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip-added{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important;transform:scale(1.06);transition:.15s}
.chip-dup{background:var(--warm-soft)!important;border-color:var(--warm)!important;transition:.15s}

/* ---- Keller ---- */
.boxcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:15px;box-shadow:var(--shadow);cursor:pointer}
.boxcard .bn{font-weight:700;font-size:16px}
.boxcard .bl{font-size:12.5px;color:var(--ink2);margin-top:2px}
.boxcard .items{font-size:13px;color:var(--ink2);margin-top:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.boxcard .qr{font-size:11.5px;color:var(--accent);margin-top:8px;font-weight:600}

/* ---- Modal ---- */
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;
  align-items:flex-end;justify-content:center}
.modal.active{display:flex}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto}
.handle{width:40px;height:4px;background:var(--line);border-radius:2px;margin:8px auto 16px}
.sheet h3{margin:0 0 4px;font-size:21px;font-weight:700}
.sheet .ml{font-size:13px;color:var(--ink2);margin-bottom:16px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);background:var(--bg);
  color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--accent)}
.fld textarea{resize:none}
.seg{display:flex;gap:8px}
.seg .opt{flex:1;text-align:center;padding:11px;border:1px solid var(--line);border-radius:12px;
  font-size:14px;font-weight:600;cursor:pointer;color:var(--ink2);background:var(--bg)}
.seg .opt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.whopick{display:flex;gap:8px;flex-wrap:wrap}
.whopick .w{padding:9px 15px;border:1px solid var(--line);border-radius:20px;font-size:14px;
  cursor:pointer;color:var(--ink2);background:var(--bg);display:flex;align-items:center;gap:6px}
.whopick .w.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#qrbox{display:flex;justify-content:center;padding:18px;background:#fff;border-radius:12px;margin:10px 0}
.label-preview{border:1.5px dashed var(--line);border-radius:8px;padding:10px;display:flex;gap:12px;align-items:center;margin:12px 0}
.label-preview .lqr{width:54px;height:54px;flex-shrink:0;background:#fff;border-radius:4px;padding:3px}
.label-preview .lqr img,.label-preview .lqr canvas{width:100%!important;height:100%!important}
.label-preview .ltx .lh{font-weight:700;font-size:14px}
.label-preview .ltx .ls{font-size:11px;color:var(--ink2);margin-top:2px}
.btn{width:100%;border:none;background:var(--accent);color:#fff;border-radius:13px;
  padding:14px;font-size:15px;font-weight:650;cursor:pointer;margin-top:8px}
.btn:active{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.photo-pick{display:flex;gap:10px;margin-bottom:12px}
.photo-pick button{flex:1;border:1px dashed var(--line);background:var(--bg);color:var(--accent);
  border-radius:12px;padding:14px;font-size:14px;font-weight:600;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:6px}
.photo-thumb{position:relative;margin-bottom:12px}
.photo-thumb img{width:100%;border-radius:12px;max-height:220px;object-fit:cover;display:block}
.photo-thumb .rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;
  width:30px;height:30px;border-radius:50%;border:none;font-size:18px;cursor:pointer}
.subitem{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.subitem .it{flex:1;font-size:14px}
.subitem .it small{color:var(--ink2);display:block}
.itemrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.itemrow .it{flex:1}
.maplink{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:12.5px;font-weight:600;text-decoration:none}

/* ---- Ideen ---- */
.idea{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow);position:relative}
.idea .ih{font-weight:650;font-size:16px}
.idea .id{font-size:13.5px;color:var(--ink2);margin-top:4px}
.idea a.lnk{display:inline-flex;align-items:center;gap:5px;margin-top:10px;color:var(--accent);font-size:13.5px;font-weight:600;text-decoration:none}
.idea .tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
.idea .tag{background:var(--accent-soft);color:var(--accent);font-size:11px;padding:3px 9px;border-radius:20px}
.idea .cdel{position:absolute;top:12px;right:12px;color:var(--ink2);opacity:.5;font-size:18px;cursor:pointer}

.empty{text-align:center;color:var(--ink2);padding:50px 30px;font-size:14.5px}
.empty .ei{font-size:34px;opacity:.4;margin-bottom:10px}
.toolbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--accent);
  border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.byline{font-size:11.5px;color:var(--ink2);margin-top:8px;font-style:italic}

/* ---- Städte / Etappen ---- */
.city{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);margin-bottom:0;overflow:hidden}
.city .chead{padding:14px 15px;display:flex;align-items:center;gap:11px;cursor:pointer}
.city .cnum{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.city .cname{font-weight:650;font-size:16px;flex:1;min-width:0;word-break:break-word;overflow-wrap:anywhere}
.city .cdel{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--ink2);font-size:20px;cursor:pointer;background:var(--bg)}
.city .cdel:active{background:var(--line)}
.city .ccount{font-size:12px;color:var(--ink2)}
.city .cdrag{color:var(--ink2);font-size:18px;cursor:grab;padding:0 4px;touch-action:none}
.city .cbody{padding:0 15px 14px;border-top:1px solid var(--line)}
.city.collapsed .cbody{display:none}
.city-actions{display:flex;gap:8px;margin:12px 0 4px}
.city-foto{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:12px;cursor:pointer;display:block}
.cbtn{text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;
  font-size:13px;font-weight:600;color:var(--accent);background:var(--bg);cursor:pointer;
  text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.cbtn:active{background:var(--accent-soft)}
.city-actions .cbtn{flex:1}
.leg{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 16px;margin:2px 0}
.leg .legrow{display:flex;align-items:center;gap:10px;width:100%}
.leg .lline{flex:1;height:0;border-top:2px dashed var(--line)}
.leg .linfo{font-size:12.5px;color:var(--ink2);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.leg .legacts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.leg .legacts a{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
.leg .legacts a.muted{color:var(--ink2)}
/* Zwischenstopps auf einer Etappe */
.stops{width:100%;display:flex;flex-direction:column;gap:6px;margin:2px 0}
.stop{display:flex;gap:8px;align-items:flex-start;background:var(--surface);border:1px dashed var(--line);
  border-radius:10px;padding:7px 10px;font-size:13px}
.stop .si{color:var(--accent);flex-shrink:0;margin-top:1px}
.stop .sn{flex:1;min-width:0;word-break:break-word}
.stop .sn small{display:block;color:var(--ink2);font-size:11.5px;margin-top:1px;white-space:pre-wrap}
.stop .sdel{color:var(--ink2);opacity:.5;cursor:pointer;font-size:15px;flex-shrink:0}
.stop .smap{font-size:11.5px;color:var(--accent);text-decoration:none;font-weight:600}
.leg .stopadd{font-size:12px;color:var(--ink2);cursor:pointer;font-weight:600}
.cdur{font-size:12.5px;color:var(--accent);font-weight:600;margin:6px 0 2px;display:flex;align-items:center;gap:6px}
.chint{font-size:12.5px;color:var(--ink2);background:var(--line);padding:6px 9px;border-radius:8px;
  margin:8px 0 2px;white-space:pre-wrap;display:flex;gap:6px}
.chint .hi{flex-shrink:0}
.poi-hint{display:block;color:var(--ink2);font-size:11.5px;margin-top:2px;white-space:pre-wrap}
.pdist{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.pdist-h{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.pdist-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
.pdist-n{flex:1;min-width:0;word-break:break-word}
.pdist-v{color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:5px;font-weight:600}
.subgroup{margin-top:12px}
.subgroup .sgh{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.subgroup .sgh span.add{cursor:pointer;font-size:18px;line-height:1}
.poi{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.poi:last-child{border-bottom:none}
.poi .pn{flex:1;font-size:14px}
.poi .pn small{display:block;color:var(--ink2);font-size:12px;margin-top:1px}
.poi .pdel{color:var(--ink2);opacity:.5;cursor:pointer;font-size:16px}
.poi-foto{width:48px;height:48px;border-radius:8px;object-fit:cover;cursor:pointer;flex-shrink:0}
.poi-autor{font-style:italic;opacity:.8;margin-top:3px!important}

const now = () => new Date().toISOString();
// Setzt updatedAt + wer zuletzt geändert hat (für "zuletzt geändert von")
function stamp(obj){ if(obj){ obj.updatedAt=now(); obj.geaendertVon=ME; } return obj; }

const RENDER = {};

// ---- Papierkorb: Einträge werden als gelöscht markiert, nicht entfernt ----
const TRASH_ARRAYS = {
  todos:"Aufgabe", reparaturen:"Reparatur", urlaub:"Reise", ideen:"Idee",
  rezepte:"Rezept", keller:"Kiste", listen:"Einkaufsliste",
  todoListen:"To-do-Liste", wiederkehrend:"Wiederkehrend"
};
function inDenPapierkorb(arrName, id){
  const arr = DB[arrName]; if(!arr) return;
  const o = arr.find(x=>x.id===id); if(!o) return;
  o.deleted = true; o.deletedAt = now(); o.deletedFrom = arrName;
  o.updatedAt = now();
  save();
}
function papierkorbEintraege(){
  const out=[];
  Object.keys(TRASH_ARRAYS).forEach(k=>{
    (DB[k]||[]).forEach(o=>{ if(o.deleted) out.push({...o, _arr:k, _typLabel:TRASH_ARRAYS[k]}); });
  });
  return out.sort((a,b)=> new Date(b.deletedAt||0)-new Date(a.deletedAt||0));
}
window.wiederherstellen = (arrName,id) => {
  const o=(DB[arrName]||[]).find(x=>x.id===id); if(!o)return;
  delete o.deleted; delete o.deletedAt; o.updatedAt=now();
  save(); RENDER.papierkorb();
};
window.endgueltigLoeschen = (arrName,id) => {
  if(!confirm("Diesen Eintrag endgültig löschen? Das kann nicht rückgängig gemacht werden.")) return;
  // Tombstone behalten (für Sync), aber Inhalt minimieren
  const o=(DB[arrName]||[]).find(x=>x.id===id);
  if(o){ Object.keys(o).forEach(k=>{ if(!["id","deleted","deletedAt","updatedAt"].includes(k)) delete o[k]; }); o.purged=true; }
  save(); RENDER.papierkorb();
};
window.papierkorbLeeren = () => {
  if(!confirm("Papierkorb vollständig leeren? Alle Einträge werden endgültig gelöscht.")) return;
  Object.keys(TRASH_ARRAYS).forEach(k=>{
    (DB[k]||[]).forEach(o=>{ if(o.deleted){ Object.keys(o).forEach(f=>{ if(!["id","deleted","deletedAt","updatedAt"].includes(f)) delete o[f]; }); o.purged=true; } });
  });
  save(); RENDER.papierkorb();
};
RENDER.papierkorb = () => {
  setHead("Papierkorb", "");
  const items = papierkorbEintraege().filter(o=>!o.purged);
  document.getElementById("vsub").textContent = items.length+" Einträge";
  let html = `<div class="ml" style="margin:0 16px 12px">Gelöschte Einträge bleiben hier 30 Tage und lassen sich wiederherstellen.</div>`;
  if(items.length){
    html += `<div style="padding:0 16px 12px"><button class="cbtn" style="width:100%;color:var(--danger);border-color:var(--danger)" onclick="papierkorbLeeren()">Papierkorb leeren</button></div>`;
    html += `<div class="list">${items.map(o=>`
      <div class="card">

function load(){

function save(){
  DB._sync = now();
  try {
    localStorage.setItem(KEY, JSON.stringify(DB));
  } catch(e) {
    // Speicher voll (oft durch viele/große Fotos) – Hinweis statt stillem Datenverlust

    }
  }
  if(window.Sync) Sync.scheduleSave();
}

// Migrationen für fehlende Felder
if(!DB.nutzer) DB.nutzer = ["Ellen","Alexander","Julia","Isabella","Mama"];
if(!DB.nutzer.includes("Mama")) DB.nutzer.push("Mama");
if(!DB.nutzerRollen) DB.nutzerRollen = { "Mama": ["einkauf"] };
if(!DB.nutzerRollen["Mama"]) DB.nutzerRollen["Mama"] = ["einkauf"];

if(!DB.listen) DB.listen = [];
if(!DB.empfaengerStandard) DB.empfaengerStandard = { "Alexander":["Ellen"], "Ellen":["Alexander"], "Mama":["Alexander"], "Julia":["Alexander","Ellen"], "Isabella":["Alexander","Ellen"] };
if(!DB.artikelZaehler) DB.artikelZaehler = {};
// alte Beispiel-"Allgemein"-Listen ohne Inhalt und ohne Status aufräumen
DB.listen = DB.listen.filter(l=> (l.artikel&&l.artikel.length) || l.status );

DB.listen = DB.listen.filter(l=> !(l.deleted && l.updatedAt && (Date.now()-new Date(l.updatedAt).getTime())>30*86400000) );

DB.listen.forEach(l=>{ if(!l.status){ l.status="entwurf"; l.ersteller=l.ersteller||ME||"?"; l.empfaenger=l.empfaenger||[]; } });
// Papierkorb: Einträge, die seit über 30 Tagen gelöscht sind, endgültig entfernen
["todos","reparaturen","urlaub","ideen","rezepte","keller","todoListen","wiederkehrend"].forEach(k=>{
  if(DB[k]) DB[k] = DB[k].filter(o=> !(o.deleted && o.deletedAt && (Date.now()-new Date(o.deletedAt).getTime())>30*86400000) );
});
if(!DB.ideenKategorien) DB.ideenKategorien = ["Urlaubsort/Ziel","Kaufen","Aktivität","Restaurant","Sonstiges"];

// gelöschte Termine endgültig entfernen
DB.termine = DB.termine.filter(t=> !t.deleted);

// Reparatur: Städte, deren Name versehentlich ein Link ist
(DB.urlaub||[]).forEach(r=>{
  (r.staedte||[]).forEach(c=>{
    if(typeof c.name==="string" && /^https?:\/\//.test(c.name.trim())){

// ---- Foto: nativ (Capacitor) oder Web-Datei-Dialog ----
function pickPhoto(useCamera, cb){
  // Native App? Dann echte Kamera/Galerie via Capacitor.
  if(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()){
    pickPhotoNative(useCamera, cb);
    return;
  }
  // Web-Fallback: Datei-Dialog (bietet auf dem Handy Kamera/Galerie an)
  const inp = document.getElementById("photoInput");
  inp.value = "";
  if(useCamera) inp.setAttribute("capture","environment"); else inp.removeAttribute("capture");
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = e => downscale(e.target.result, cb);
    r.readAsDataURL(f);
  };
  inp.click();
}
async function pickPhotoNative(useCamera, cb){
  try{
    const { Camera } = window.Capacitor.Plugins;
    const photo = await Camera.getPhoto({
      quality: 75, resultType: "dataUrl", allowEditing: false,
      source: useCamera ? "CAMERA" : "PHOTOS",
      saveToGallery: false
    });
    downscale(photo.dataUrl, cb);
  }catch(e){ /* Nutzer hat abgebrochen */ }
}
function downscale(dataUrl, cb){
  const img = new Image();
  img.onload = () => {
    const max = 1000, sc = Math.min(1, max/Math.max(img.width,img.height));
    const c = document.createElement("canvas");
    c.width = img.width*sc; c.height = img.height*sc;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg",0.75));
  };
  img.src = dataUrl;
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function empty(ic,txt){ return `<div class="empty"><div class="ei">${ICON[ic]||""}</div>${txt}</div>`; }
function mapsLink(addr){ return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(addr); }
// Liefert ein Maps-Routen-Ziel ("lat,lon" bevorzugt, sonst Name) für einen Ort.
function mapsPoint(o){
  if(!o) return "";
  if(o.lat!=null) return o.lat+","+o.lon;
  return [o.name,o.plz,o.land].filter(Boolean).join(", ") || o.adresse || o.name || "";
}
// Google-Maps-Routenlink von a nach b, optional über Zwischenstopps (Array von Orten).
function mapsRouteLink(a, b, stops){
  const orig = encodeURIComponent(mapsPoint(a));
  const dest = encodeURIComponent(mapsPoint(b));
  let url = "https://www.google.com/maps/dir/?api=1&origin="+orig+"&destination="+dest+"&travelmode=driving";
  const wp = (stops||[]).map(mapsPoint).filter(Boolean);
  if(wp.length) url += "&waypoints="+wp.map(encodeURIComponent).join("%7C");
  return url;
}
// Schneidet alles vor dem ersten http(s):// ab und liefert einen sauberen Link – oder "" wenn keiner drin ist.
function cleanLink(text){
  if(!text) return "";
  const m = String(text).match(/https?:\/\/\S+/);
  return m ? m[0] : "";
}
// Liefert das beste Ziel zum Öffnen: echter Link bevorzugt, sonst Maps-Suche aus Adresse/Koordinaten/Name.
function openTarget(obj){
  const lk = cleanLink(obj.link);
  if(lk) return lk;
  if(obj.adresse) return mapsLink(obj.adresse);
  if(obj.lat!=null) return mapsLink(obj.lat+","+obj.lon);
  if(obj.name) return mapsLink(obj.name);
  return "";
}
function fmtDate(iso){ if(!iso)return ""; const d=new Date(iso); return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function daysUntil(iso){ if(!iso)return null; const d=new Date(iso); d.setHours(0,0,0,0); const t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); }

// ---- Kalender-Export ----
// Google-Kalender-Link für einen einzelnen Termin (ganztägig oder mit Zeitraum).
function gcalLink(titel, startISO, endISO, details){
  const fmt = d => { const x=new Date(d); return x.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z"; };
  const fmtDay = d => { const x=new Date(d); return x.getFullYear()+String(x.getMonth()+1).padStart(2,"0")+String(x.getDate()).padStart(2,"0"); };
  let dates;
  if(startISO && startISO.length<=10){ // reines Datum -> ganztägig
    const end = endISO ? new Date(endISO) : new Date(startISO);
    end.setDate(end.getDate()+1); // Google: Enddatum exklusiv
    dates = fmtDay(startISO)+"/"+fmtDay(end);
  } else {
    const s = startISO ? fmt(startISO) : fmt(new Date());
    const e = endISO ? fmt(endISO) : fmt(new Date(new Date(startISO||Date.now()).getTime()+3600000));
    dates = s+"/"+e;
  }
  const p = new URLSearchParams({ action:"TEMPLATE", text:titel||"Termin", dates, details:details||"" });
  return "https://calendar.google.com/calendar/render?"+p.toString();
}
// ICS-Datei (für mehrere Termine / universellen Import) als Download
function downloadICS(events, filename){
  const pad=n=>String(n).padStart(2,"0");
  const dt=d=>{const x=new Date(d);return x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate());};
  const dtStamp=()=>{const x=new Date();return x.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";};
  let ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FamilieNadig//DE\r\nCALSCALE:GREGORIAN\r\n";
  events.forEach(ev=>{
    const endExcl=ev.end?new Date(ev.end):new Date(ev.start);
    endExcl.setDate(endExcl.getDate()+1);
    ics+="BEGIN:VEVENT\r\n";
    ics+="UID:"+(ev.uid||uid())+"@familienadig\r\n";
    ics+="DTSTAMP:"+dtStamp()+"\r\n";
    ics+="DTSTART;VALUE=DATE:"+dt(ev.start)+"\r\n";
    ics+="DTEND;VALUE=DATE:"+dt(endExcl)+"\r\n";
    ics+="SUMMARY:"+(ev.titel||"Termin").replace(/[\r\n,;]/g," ")+"\r\n";
    if(ev.details) ics+="DESCRIPTION:"+ev.details.replace(/[\r\n]/g," ").replace(/[,;]/g," ")+"\r\n";
    ics+="END:VEVENT\r\n";
  });
  ics+="END:VCALENDAR";
  const blob=new Blob([ics],{type:"text/calendar"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=(filename||"termine")+".ics";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function renderFuerDich(){
  let slot = document.getElementById("fuerDichSlot");

    slot = document.createElement("div"); slot.id="fuerDichSlot";
    document.getElementById("tiles").after(slot);
  }
  // Prüft, ob die angemeldete Person zuständig ist (Einzel- oder Mehrfachzuweisung)
  const istMeins = e => {
    if(e.werListe && e.werListe.length) return e.werListe.includes(ME);
    if(e.wer) return e.wer.split(",").map(s=>s.trim()).includes(ME);
    return e.autor===ME;   // ohne Zuweisung: für den Ersteller
  };
  const relevantVon = (arr, typ) => arr.filter(t=>{
    if(t.done||t.deleted) return false;
    if(!istMeins(t)) return false;
    const d = t.faellig ? daysUntil(t.faellig) : null;
    return (d!==null && d<=3) || t.prio==="hoch";
  }).map(t=>({...t, _typ:typ}));
  // To-dos UND Reparaturen zusammenführen
  const relevant = [...relevantVon(DB.todos,"todo"), ...relevantVon(DB.reparaturen,"reparatur")]
    .sort((a,b)=>{ const da=a.faellig?daysUntil(a.faellig):999, db=b.faellig?daysUntil(b.faellig):999; return da-db; });

  slot.innerHTML = `<div class="fd-head">Für dich, ${esc(ME)}</div>

      const urgent = (d!==null&&d<=0) || t.prio==="hoch";
      const listLink = !!t.einkauf;
      const ziel = listLink ? "einkauf" : (t._typ==="reparatur" ? "reparaturen" : "todos");

      return `<div class="fd-item ${urgent?'urgent':''}" onclick="open_('${ziel}')">

        <div class="fd-tx"><div class="fd-titel">${esc(t.titel)}</div>

        ${listLink?`<div class="fd-go">${ICON.cart}</div>`:`<div class="fd-go">›</div>`}
      </div>`;
    }).join("")}</div>`;
}

function handyBenachrichtigung(titel, text){
  try{
    if(!("Notification" in window)) return;
    if(Notification.permission!=="granted") return;
    const n = new Notification(titel, {
      body: text||"",
      icon: document.querySelector('link[rel="apple-touch-icon"]')?.href,
      tag: "familie-nadig",
      renotify: true
    });
    n.onclick = () => { try{ window.focus(); }catch(e){} n.close(); };
  }catch(e){}
}

window.benachrichtigungenAktivieren = (still) => {
  if(!("Notification" in window)){ if(!still) alert("Dieses Gerät unterstützt keine Benachrichtigungen."); return; }
  if(Notification.permission==="granted"){ if(!still) alert("Benachrichtigungen sind bereits aktiv."); return; }
  if(Notification.permission==="denied"){ if(!still) alert("Benachrichtigungen wurden im Browser/Gerät blockiert. Bitte in den Einstellungen für diese Seite erlauben."); return; }
  Notification.requestPermission().then(p=>{
    if(p==="granted" && !still) handyBenachrichtigung("Benachrichtigungen aktiv", "Du wirst informiert, sobald eine neue Liste da ist.");
    if(modal.classList.contains("active")) closeModal();

let CURRENT = null;
let DETAIL_OPEN = null;   // wenn eine Reise-Detailansicht offen ist

// ---- Handy-Zurück-Taste: in der App navigieren statt sie zu verlassen ----
// Wir schieben bei jedem "Vertiefen" einen Verlaufseintrag in die Browser-History.
// popstate (Zurück-Taste) ruft dann handleBack() auf.
function pushNav(){ try{ history.pushState({app:true}, ""); }catch(e){} }
let _backBusy = false;
function handleBack(){
  // 1. Offenes Modal? -> schließen (ohne erneuten history.back, da popstate schon zurückging)
  if(modal.classList.contains("active")){ modal.classList.remove("active"); return true; }
  // 2. Detailansicht offen (Reise / To-do-Liste)? -> zurück zur Liste
  if(DETAIL_OPEN){ goBack(); return true; }
  // 3. In einem Modul? -> zum Dashboard
  if(CURRENT){ goHome(); return true; }
  // 4. Schon auf dem Dashboard -> nichts mehr abzufangen
  return false;
}
window.addEventListener("popstate", () => {
  if(_backBusy) return;
  const handled = handleBack();
  if(handled){
    // Verlaufseintrag wieder herstellen, damit der nächste Zurück-Druck erneut abgefangen wird
    _backBusy = true; pushNav(); setTimeout(()=>{ _backBusy=false; }, 50);
  }
  // Wenn nicht behandelt (schon auf Dashboard): App darf sich schließen / Seite verlassen
});

window.goBack = () => {
  if(DETAIL_OPEN==="todoliste"){ DETAIL_OPEN=null; TODO_TAB="listen"; open_("todos"); return; }
  if(DETAIL_OPEN){ DETAIL_OPEN=null; open_("urlaub"); return; }
  goHome();
};

// ============================================================
//  Wiederkehrende Aufgaben (To-do-Kalender)
// ============================================================
const INTERVALLE = [
  {key:"woechentlich", label:"Wöchentlich", tage:7},
  {key:"monatlich", label:"Monatlich", monate:1},
  {key:"vierteljaehrlich", label:"Vierteljährlich", monate:3},
  {key:"halbjaehrlich", label:"Halbjährlich", monate:6},
  {key:"jaehrlich", label:"Jährlich", monate:12},
  {key:"frei", label:"Frei (Tage)", tage:null},
];
function intervallLabel(w){
  const i = INTERVALLE.find(x=>x.key===w.intervall);
  if(w.intervall==="frei") return `alle ${w.freiTage||0} Tage`;
  return i? i.label : "";
}
// Länge eines Intervalls in Tagen (für Fortschritt/Dringlichkeit)
function intervallTage(w){
  const def = INTERVALLE.find(x=>x.key===w.intervall);
  if(!def) return 30;
  if(w.intervall==="frei") return Math.max(1, parseInt(w.freiTage)||1);
  if(def.tage) return def.tage;
  return Math.round((def.monate||1)*30.44); // Monate näherungsweise in Tage
}
// Datum, ab dem das aktuelle Intervall läuft: letzte Erledigung, sonst Start
function basisDatum(w){
  if(w.letzteErledigung) return w.letzteErledigung;
  return w.start || new Date().toISOString().slice(0,10);
}
// Nächste Fälligkeit ab Basis (erledigungsbasiert)
function naechsteFaelligkeit(w){
  const basis = basisDatum(w);
  let d = new Date(basis+"T00:00:00");
  // Genau ein Intervall ab Basis weiter
  if(w.intervall==="frei") d.setDate(d.getDate()+(parseInt(w.freiTage)||1));
  else { const def=INTERVALLE.find(x=>x.key===w.intervall);
    if(def && def.tage) d.setDate(d.getDate()+def.tage);
    else if(def) d.setMonth(d.getMonth()+def.monate);
  }
  // Falls noch nie erledigt UND Start liegt in der Vergangenheit: bis heute fortschreiben,
  // damit die erste Fälligkeit nicht künstlich überfällig erscheint.
  if(!w.letzteErledigung){
    const heute = new Date(); heute.setHours(0,0,0,0);
    const def = INTERVALLE.find(x=>x.key===w.intervall);
    let guard=0;
    while(d < heute && guard<2000){
      guard++;
      if(w.intervall==="frei") d.setDate(d.getDate()+(parseInt(w.freiTage)||1));
      else if(def && def.tage) d.setDate(d.getDate()+def.tage);
      else if(def) d.setMonth(d.getMonth()+def.monate);
    }
  }
  return d.toISOString().slice(0,10);
}
// Dringlichkeitsstufe nach Zeitfortschritt im laufenden Intervall:
//  < 50 % -> niedrig, 50-85 % -> mittel, > 85 % oder überfällig -> hoch
function dringlichkeit(w){
  const ges = intervallTage(w);
  const rest = daysUntil(naechsteFaelligkeit(w)); // Tage bis fällig (negativ = überfällig)
  if(rest===null) return "niedrig";
  const verbraucht = ges - rest;             // wie viele Tage des Intervalls vorbei
  const anteil = ges>0 ? verbraucht/ges : 1; // 0 = gerade erledigt, 1 = fällig
  if(rest < 0 || anteil >= 0.85) return "hoch";
  if(anteil >= 0.50) return "mittel";
  return "niedrig";
}
const PRIO_FARBE = { niedrig:"#16a34a", mittel:"#d97706", hoch:"#dc2626" };
const PRIO_LABEL = { niedrig:"Niedrig", mittel:"Mittel", hoch:"Hoch" };
// "zuletzt erledigt vor X" – menschenlesbar
function zuletztText(w){
  if(!w.letzteErledigung) return "noch nie erledigt";
  const tage = -daysUntil(w.letzteErledigung); // Tage seit Erledigung
  if(tage<=0) return "heute erledigt";
  if(tage===1) return "gestern erledigt";
  if(tage<7) return `vor ${tage} Tagen erledigt`;
  if(tage<14) return "vor 1 Woche erledigt";
  if(tage<31) return `vor ${Math.round(tage/7)} Wochen erledigt`;
  if(tage<60) return "vor 1 Monat erledigt";
  if(tage<365) return `vor ${Math.round(tage/30.44)} Monaten erledigt`;
  return `vor ${(tage/365).toFixed(1)} Jahren erledigt`;
}
function wiederCard(w){
  const naechste = naechsteFaelligkeit(w);
  const d = daysUntil(naechste);
  const wann = d<0?(-d===1?"1 Tag überfällig":(-d)+" Tage überfällig") : d===0?"heute fällig" : d===1?"morgen fällig" : "in "+d+" Tagen fällig";
  const stufe = dringlichkeit(w);
  const farbe = PRIO_FARBE[stufe];
  // Fortschrittsbalken: Anteil des verbrauchten Intervalls
  const ges = intervallTage(w);
  const verbraucht = ges - (d===null?0:d);
  const anteil = Math.max(0, Math.min(1, ges>0?verbraucht/ges:1));
  return `<div class="card" style="border-left:4px solid ${farbe}" onclick="openWiederEditor('${w.id}')">
    <div class="cttl">${esc(w.titel)}</div>
    <div class="cmeta">
      <span class="pill cat">${esc(intervallLabel(w))}</span>
      <span class="pill" style="background:${farbe}1a;color:${farbe}">${PRIO_LABEL[stufe]}</span>
      <span class="pill due ${d<0?'over':''}">${ICON.checklist} ${wann}</span>
      ${(w.werListe&&w.werListe.length)?w.werListe.map(p=>`<span class="pill who">${esc(p)}</span>`).join(""):""}</div>
    <div class="wieder-bar"><div class="wieder-fill" style="width:${(anteil*100).toFixed(0)}%;background:${farbe}"></div></div>
    <div class="cdesc" style="display:flex;justify-content:space-between;gap:8px">
      <span>${zuletztText(w)}</span><span style="color:var(--ink2)">nächster Termin: ${fmtDate(naechste)}</span></div>
    <div style="margin-top:10px">
      <button class="cbtn" style="width:100%;color:${farbe};border-color:${farbe};font-weight:650" onclick="event.stopPropagation();erledigtWieder('${w.id}')">✓ Jetzt erledigt</button></div>
    ${w.autor?`<div class="byline">angelegt von ${esc(w.autor)}</div>`:""}</div>`;
}
// Aufgabe als heute erledigt markieren -> Intervall startet neu
window.erledigtWieder = id => {
  const w = DB.wiederkehrend.find(x=>x.id===id); if(!w) return;
  w.letzteErledigung = new Date().toISOString().slice(0,10);

  // ein evtl. offenes, automatisch erzeugtes To-do dieser Aufgabe abräumen
  DB.todos.forEach(t=>{ if(t.ausWiederkehrend===id && !t.done && !t.deleted){ t.done=true; t.updatedAt=now(); } });
  w.updatedAt = now(); save(); RENDER.todos();

  const w = id ? DB.wiederkehrend.find(x=>x.id===id)
              : {titel:"",intervall:"monatlich",freiTage:14,start:new Date().toISOString().slice(0,10),werListe:[]};
  window._wEdit = id || null;
  const vorlagen = !id ? `<div class="fld"><label>Vorlage (optional)</label>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      ${REINIGUNG_VORLAGEN.map(v=>`<button type="button" class="cbtn" style="padding:6px 11px;font-size:12.5px" onclick="wVorlage('${esc(v.t)}','${v.iv}',${v.ft||0})">${esc(v.t)}</button>`).join("")}
    </div></div>` : "";
  openSheet(`<h3>${id?"Wiederkehrende Aufgabe":"Neue wiederkehrende Aufgabe"}</h3>
    ${vorlagen}
    <div class="fld"><label>Aufgabe</label><input id="w_titel" value="${esc(w.titel)}" placeholder="z.B. Fenster putzen"></div>

// Erzeugt aus wiederkehrenden Aufgaben ein echtes To-do, sobald die Dringlichkeit "Hoch" erreicht
function erzeugeFaelligeWiederkehrend(){
  if(!DB.wiederkehrend) return;
  let erzeugt=false;
  DB.wiederkehrend.forEach(w=>{
    if(w.deleted) return;
    if(dringlichkeit(w)!=="hoch") return;   // erst bei "Hoch" (kurz vor Ende / überfällig)
    const naechste = naechsteFaelligkeit(w);
    const marker = w.id+"@"+naechste;
    w.erzeugt = w.erzeugt || [];
    if(!w.erzeugt.includes(marker)){
      DB.todos.push({
        id:uid(), titel:w.titel, notiz:"(wiederkehrend: "+intervallLabel(w)+")",
        faellig:naechste, prio:"hoch",
        werListe:w.werListe||[], wer:(w.werListe||[]).join(", "),
        done:false, autor:w.autor||ME, ausWiederkehrend:w.id,
        createdAt:now(), updatedAt:now()
      });
      w.erzeugt.push(marker);
      if(w.erzeugt.length>20) w.erzeugt = w.erzeugt.slice(-20);
      erzeugt=true;
    }
  });
  if(erzeugt) save();
}

// Sammelt alle datierten Einträge als {datum, titel, typ, farbe, ref}
function kalenderEintraege(){
  const out=[];
  DB.todos.filter(t=>!t.deleted && t.faellig).forEach(t=>out.push({datum:t.faellig,titel:t.titel,typ:"Aufgabe",farbe:"#1d4ed8",modul:"todos"}));
  DB.reparaturen.filter(r=>!r.deleted && r.faellig).forEach(r=>out.push({datum:r.faellig,titel:r.titel,typ:"Reparatur",farbe:"#ea580c",modul:"reparaturen"}));
  // Reisen: jeden Tag von Start bis Ende markieren
  DB.urlaub.filter(u=>!u.deleted && u.von).forEach(u=>{
    const start=new Date(u.von+"T00:00:00");
    const ende = u.bis ? new Date(u.bis+"T00:00:00") : new Date(u.von+"T00:00:00");
    const titel=u.titel||"Reise";
    const tage=Math.max(0, Math.round((ende-start)/86400000));
    for(let i=0;i<=tage;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const istRand = (i===0 || i===tage);
      const suffix = tage>0 ? (i===0?" (Anreise)":i===tage?" (Abreise)":"") : "";
      out.push({datum:d.toISOString().slice(0,10),titel:titel+suffix,typ:"Reise",farbe:"#16a34a",modul:"urlaub",reiseId:u.id,zwischentag:!istRand});
    }
    // Restaurant-Reservierungen dieser Reise
    (u.staedte||[]).forEach(c=>{
      (c.restaurants||[]).forEach(p=>{
        if(p.resDatum) out.push({datum:p.resDatum,titel:"Reservierung: "+(p.name||"Restaurant")+(p.resZeit?" · "+p.resZeit:""),typ:"Reservierung",farbe:"#db2777",modul:"urlaub",reiseId:u.id});
      });
      // Aufenthalt pro Ort (von–bis): jeden Tag markieren, Klick führt zur Reise
      if(c.von){
        const cs=new Date(c.von+"T00:00:00");
        const ce=c.bis?new Date(c.bis+"T00:00:00"):new Date(c.von+"T00:00:00");
        const ct=Math.max(0,Math.round((ce-cs)/86400000));
        for(let k=0;k<=ct;k++){
          const d=new Date(cs); d.setDate(cs.getDate()+k);
          const rand=(k===0||k===ct);
          out.push({datum:d.toISOString().slice(0,10),titel:(c.name||"Ort")+" ("+titel+")",typ:"Ort",farbe:"#0d9488",modul:"urlaub",reiseId:u.id,zwischentag:!rand});
        }
      }
    });
  });
  // Wiederkehrende: nächste 6 Vorkommen
  DB.wiederkehrend.filter(w=>!w.deleted).forEach(w=>{
    let d=new Date(naechsteFaelligkeit(w)); const def=INTERVALLE.find(x=>x.key===w.intervall);
    for(let i=0;i<6;i++){
      out.push({datum:d.toISOString().slice(0,10),titel:w.titel,typ:"Wiederkehrend",farbe:"#7c3aed",modul:"todos"});
      const nd=new Date(d);
      if(w.intervall==="frei") nd.setDate(nd.getDate()+(parseInt(w.freiTage)||1));
      else if(def.tage) nd.setDate(nd.getDate()+def.tage); else nd.setMonth(nd.getMonth()+def.monate);
      d=nd;
    }
  });
  // Eigene Kalendertermine (direkt im Kalender angelegt)
  (DB.termine||[]).filter(t=>!t.deleted && t.datum).forEach(t=>{
    out.push({datum:t.datum, titel:(t.zeit?t.zeit+" · ":"")+t.titel, typ:"Termin", farbe:"#0891b2", modul:"kalender", terminId:t.id});
  });
  return out;
}
let KAL_MONAT = null;  // {jahr, monat} – null = aktueller Monat
RENDER.kalender = () => {
  setHead("Kalender", "", {label:"📅 Export", fn:kalAlleExport});
  const heute = new Date();
  if(!KAL_MONAT) KAL_MONAT = {jahr:heute.getFullYear(), monat:heute.getMonth()};
  const {jahr,monat} = KAL_MONAT;
  const monatsName = new Date(jahr,monat,1).toLocaleDateString("de-DE",{month:"long",year:"numeric"});
  document.getElementById("vsub").textContent = monatsName;

  const eintraege = kalenderEintraege();
  // nach Tag gruppieren (nur dieser Monat)
  const proTag = {};
  eintraege.forEach(e=>{ const d=new Date(e.datum); if(d.getFullYear()===jahr&&d.getMonth()===monat){ const t=d.getDate(); (proTag[t]=proTag[t]||[]).push(e); } });

  const ersterTag = new Date(jahr,monat,1);
  let startWochentag = ersterTag.getDay(); startWochentag = startWochentag===0?6:startWochentag-1; // Mo=0
  const tageImMonat = new Date(jahr,monat+1,0).getDate();
  const istHeute = t => heute.getFullYear()===jahr&&heute.getMonth()===monat&&heute.getDate()===t;

  let zellen="";
  for(let i=0;i<startWochentag;i++) zellen+=`<div class="kal-zelle leer"></div>`;
  for(let t=1;t<=tageImMonat;t++){
    const evs=proTag[t]||[];
    const dots=evs.slice(0,4).map(e=>`<span class="kal-dot" style="background:${e.farbe}"></span>`).join("");
    zellen+=`<div class="kal-zelle ${istHeute(t)?'heute':''} ${evs.length?'hat':''}" onclick="kalTag(${t})">
      <div class="kal-num">${t}</div><div class="kal-dots">${dots}</div></div>`;
  }

  const wtage=["Mo","Di","Mi","Do","Fr","Sa","So"];
  // kommende Termine (Liste unter dem Kalender) – Reise-Zwischentage nicht einzeln auflisten
  const kommende = eintraege.filter(e=>!e.zwischentag)
    .filter(e=>{const d=daysUntil(e.datum);return d>=0&&d<=31;})
    .sort((a,b)=>new Date(a.datum)-new Date(b.datum)).slice(0,15);

  vBody().innerHTML = `
    <div class="kal-nav">
      <button onclick="kalMonat(-1)">‹</button>
      <div>${monatsName}</div>
      <button onclick="kalMonat(1)">›</button>
    </div>
    <div class="kal-grid kal-head">${wtage.map(w=>`<div class="kal-wt">${w}</div>`).join("")}</div>
    <div class="kal-grid">${zellen}</div>
    <div class="kal-legende">
      <span><span class="kal-dot" style="background:#1d4ed8"></span>Aufgabe</span>
      <span><span class="kal-dot" style="background:#ea580c"></span>Reparatur</span>
      <span><span class="kal-dot" style="background:#16a34a"></span>Reise</span>
      <span><span class="kal-dot" style="background:#0d9488"></span>Ort</span>
      <span><span class="kal-dot" style="background:#db2777"></span>Reservierung</span>
      <span><span class="kal-dot" style="background:#0891b2"></span>Termin</span>
      <span><span class="kal-dot" style="background:#7c3aed"></span>Wiederkehrend</span>
    </div>
    <div class="section-label">Kommende Termine</div>
    ${kommende.length? `<div class="list">${kommende.map(e=>{
      const d=daysUntil(e.datum);
      const wann=d===0?"heute":d===1?"morgen":"in "+d+" Tagen";
      const loeschbar = e.typ==="Termin" && e.terminId;
      const klick = loeschbar ? "" : (e.modul==="urlaub" ? "kalZuReise('"+(e.reiseId||"")+"')" : "open_('"+e.modul+"')");
      return `<div class="card" onclick="${klick}">
        ${loeschbar?`<div class="cdel" style="position:absolute;top:10px;right:10px" onclick="event.stopPropagation();delTermin('${e.terminId}')">×</div>`:""}
        <div style="display:flex;align-items:center;gap:10px">
          <span class="kal-dot" style="background:${e.farbe};width:11px;height:11px"></span>
          <div style="flex:1"><div class="cttl" style="font-size:15px">${esc(e.titel)}</div>
            <div class="cmeta"><span class="pill cat">${e.typ}</span><span class="pill due">${fmtDate(e.datum)} · ${wann}</span></div></div></div></div>`;
    }).join("")}</div>` : empty("cal","Keine Termine in den nächsten 31 Tagen")}`;
  document.getElementById("addbar").style.display="none";
  showFab(()=>openTermin(null));
};

function foodIcon(name){ for(const [re,ic] of FOOD_ICONS) if(re.test(name)) return ic; return "🛒"; }
// Welche Warengruppe? Gibt den Index zurück (für Sortierung), sonst hoch (ans Ende).
function warenGruppeIndex(name){
  // Sonderfall: alles mit "Dose/Konserve/in der ..." zuerst zu Konserven
  if(/dose|konserve|in der dose|eingelegt|passierte/i.test(name)){
    const ki=WARENGRUPPEN.findIndex(g=>g.key==="konserven"); if(ki>=0)return ki;
  }
  for(let i=0;i<WARENGRUPPEN.length;i++) if(WARENGRUPPEN[i].match.test(name)) return i;
  return WARENGRUPPEN.length;
}
function warenGruppeTitel(name){
  const i=warenGruppeIndex(name);
  return i<WARENGRUPPEN.length ? WARENGRUPPEN[i].titel : "Sonstiges";
}

// Listenname automatisch: "Ersteller · Datum"
function listenName(l){
  const d = new Date(l.createdAt);
  return `${l.ersteller||"?"} · ${d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}`;
}
// An mich abgeschickte, aktive (nicht archivierte) Listen
function listenFuerMich(){
  return DB.listen.filter(l=> !l.deleted && l.status==="abgeschickt" && !l.archiviert && (!l.empfaenger || !l.empfaenger.length || l.empfaenger.includes(ME)) && l.ersteller!==ME);
}
// Mein eigener, noch nicht abgeschickter Entwurf (max. einer aktiv)
function meinEntwurf(){
  return DB.listen.find(l=> !l.deleted && l.status==="entwurf" && !l.archiviert && l.ersteller===ME);
}
// Von mir selbst abgeschickte, aktive Listen (weiter sichtbar & nachbearbeitbar)
function meineAbgeschickten(){
  return DB.listen.filter(l=> !l.deleted && l.status==="abgeschickt" && !l.archiviert && l.ersteller===ME && !l.zusammengefuehrt);
}
// Listen, die ICH zusammengeführt habe (aktiv)
function meineMerges(){
  return DB.listen.filter(l=> !l.deleted && l.zusammengefuehrt && !l.archiviert && l.empfaenger && l.empfaenger.includes(ME));
}
// Archivierte Listen, die mich betreffen (Ersteller oder Empfänger)
function archivListen(){
  return DB.listen.filter(l=> !l.deleted && l.archiviert && (l.ersteller===ME || (l.empfaenger||[]).includes(ME)))
    .sort((a,b)=> new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt));
}

let EINKAUF_ARCHIV = false;
RENDER.einkauf = () => {
  const fuerMich = listenFuerMich();
  const entwurf = meinEntwurf();
  const vonMir = meineAbgeschickten();
  const merges = meineMerges();
  const archiv = archivListen();
  setHead("Einkaufslisten", "", null);

  if(EINKAUF_ARCHIV){
    let html = `<div class="seg" style="margin:0 16px 12px">
      <div class="opt" onclick="einkaufTab(false)">Aktuell</div>
      <div class="opt on" onclick="einkaufTab(true)">Archiv${archiv.length?" ("+archiv.length+")":""}</div></div>`;
    html += archiv.length
      ? archiv.map(l=>abgeschickteListeHtml(l, l.ersteller===ME, true)).join("")
      : empty("cart","Noch keine archivierten Listen");
    vBody().innerHTML = html;
    document.getElementById("addbar").style.display="none";
    return;
  }

  document.getElementById("vsub").textContent = fuerMich.length? fuerMich.length+" für dich" : (entwurf? "dein Entwurf" : "");
  let html = `<div class="seg" style="margin:0 16px 12px">
    <div class="opt on" onclick="einkaufTab(false)">Aktuell</div>
    <div class="opt" onclick="einkaufTab(true)">Archiv${archiv.length?" ("+archiv.length+")":""}</div></div>`;

  // 1) Zusammengeführte Listen (von mir erstellt) zuerst
  merges.forEach(l=>{ html += abgeschickteListeHtml(l, false); });

  // 2) An mich abgeschickte Listen – mit Inhalt
  if(fuerMich.length){
    html += `<div class="section-label">Für dich abgeschickt</div>`;
    fuerMich.forEach(l=>{ html += abgeschickteListeHtml(l); });
  }
  // Zusammenfügen anbieten, sobald ich mind. 2 Listen habe (empfangen + zusammengeführt zählen)
  const zusammenfuegbar = fuerMich.length + merges.length;
  if(zusammenfuegbar>1){
    html += `<div style="padding:6px 16px 4px"><button class="btn ghost" onclick="mergeDialog()">${ICON.cart} Mehrere Listen zu einer zusammenfügen</button></div>`;
  }

  // 3) Mein Entwurf (falls vorhanden) – mit Schnellauswahl
  if(entwurf){
    html += `<div class="section-label" style="display:flex;justify-content:space-between;align-items:center">Dein Entwurf
      <span style="text-transform:none;font-weight:600;color:var(--danger)" onclick="delListe('${entwurf.id}')">Verwerfen</span></div>`;
    html += entwurfHtml(entwurf);
    html += schnellauswahlHtml();
  } else {
    // 4) Kein Entwurf -> zwei Knöpfe: abschicken-Liste / nur für mich
    html += `<div style="padding:10px 16px;display:flex;gap:8px;flex-direction:column">
      <button class="btn" onclick="neuerEntwurf()">+ Neue Einkaufsliste beginnen</button></div>`;
    if(!fuerMich.length && !merges.length){
      html += schnellauswahlHtml(true);
    }
  }

  // 5) Von mir abgeschickte Listen
  if(vonMir.length){
    html += `<div class="section-label">Von dir abgeschickt</div>`;
    vonMir.forEach(l=>{ html += abgeschickteListeHtml(l, true); });
  }

  vBody().innerHTML = html;
  if(entwurf){ AKT_LISTE=entwurf.id; showAddBar("Eigener Artikel…", t=>addEin(t)); }
  else document.getElementById("addbar").style.display="none";
};
window.einkaufTab = a => { EINKAUF_ARCHIV=a; RENDER.einkauf(); };

// Farbe je Absender (für zusammengeführte Listen)
function autorFarbe(name){
  const farben = ["#1d4ed8","#16a34a","#db2777","#ea580c","#7c3aed","#0891b2"];
  let h=0; for(let i=0;i<(name||"").length;i++) h=(h*31+name.charCodeAt(i))%farben.length;
  return farben[h];
}

// HTML einer abgeschickten/zusammengeführten Liste. istEigene -> Ersteller-Sicht. imArchiv -> nur Lesen+Löschen
function abgeschickteListeHtml(l, istEigene, imArchiv){
  const offen = l.artikel.filter(a=>!a.d).sort((a,b)=>warenGruppeIndex(a.tx)-warenGruppeIndex(b.tx));
  const erledigt = l.artikel.filter(a=>a.d);
  const editing = (window._editListe===l.id);
  // Listen sind standardmäßig eingeklappt. Nur manuell geöffnete oder gerade
  // bearbeitete Listen werden aufgeklappt – das hält die Übersicht sauber,
  // sobald Artikel abgehakt werden.
  const aufgeklappt = (window._openListe===l.id) || editing;
  // Kopfzeile
  let kopfInfo;
  if(l.zusammengefuehrt) kopfInfo = `zusammengeführt · ${offen.length} offen`;
  else if(istEigene) kopfInfo = `an ${esc((l.empfaenger||[]).join(", ")||"—")} · ${offen.length} offen`;
  else kopfInfo = `von ${esc(l.ersteller)} · ${offen.length} offen`;
  const titel = l.zusammengefuehrt ? "Zusammengeführte Liste" : listenName(l);

  const rows = [...offen,...erledigt].map(a=>einRowRO(l.id,a,editing,l)).join("");
  const head = `<div style="padding:13px 15px;display:flex;align-items:center;gap:10px;background:var(--accent-soft);cursor:pointer" onclick="toggleListe('${l.id}')">
      <div style="font-size:13px;color:var(--ink2);transform:rotate(${aufgeklappt?'90':'0'}deg);transition:.15s">▶</div>
      <div style="flex:1"><div style="font-weight:700">${esc(titel)}</div>
        <div style="font-size:12px;color:var(--ink2)">${kopfInfo}</div></div>
      ${!imArchiv?`<button class="cbtn" style="flex:0 0 auto;padding:7px 12px" onclick="event.stopPropagation();${editing?`stopEdit()`:`startEdit('${l.id}')`}">${editing?"Fertig":"Bearbeiten"}</button>`:""}
    </div>`;
  if(!aufgeklappt) return `<div class="card" style="margin:0 16px 10px;padding:0;overflow:hidden">${head}</div>`;

  return `<div class="card" style="margin:0 16px 10px;padding:0;overflow:hidden">${head}
    <div class="list" style="padding:10px 15px 14px">${rows||'<div style="color:var(--ink2);font-size:13px">leer</div>'}</div>
    ${editing?`<div style="padding:0 15px 8px"><input id="ed_add_${l.id}" placeholder="Artikel ergänzen…" style="width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px" onkeydown="if(event.key==='Enter'){addEinTo('${l.id}',this.value);this.value=''}">
      ${istEigene&&l.empfaenger&&l.empfaenger.length?`<div class="ml" style="margin-top:8px">Ergänzungen erscheinen automatisch bei ${esc(l.empfaenger.join(", "))}.</div>`:""}</div>
      ${schnellauswahlHtml(false, l.id)}`:""}
    ${!imArchiv && !editing ? `<div style="padding:0 15px 14px;display:flex;gap:8px">
      ${istEigene?`<button class="cbtn" style="flex:1" onclick="delListe('${l.id}')">Zurückziehen</button>`:`<button class="cbtn" style="flex:1" onclick="archiviereListe('${l.id}')">Ins Archiv</button>`}
      <button class="cbtn" style="flex:1;color:var(--danger);border-color:var(--danger)" onclick="delListe('${l.id}')">Löschen</button></div>`:""}
    ${imArchiv?`<div style="padding:0 15px 14px"><button class="cbtn" style="width:100%;color:var(--danger);border-color:var(--danger)" onclick="delListe('${l.id}')">Endgültig löschen</button></div>`:""}
  </div>`;
}
window.toggleListe = id => { window._openListe = (window._openListe===id? null : id); RENDER.einkauf(); };
window.archiviereListe = id => { const l=DB.listen.find(x=>x.id===id); if(l){ l.archiviert=true; l.updatedAt=now(); save(); RENDER.einkauf(); } };

// Zeile in abgeschickter Liste: abhaken; bei "alles abgehakt" -> Archiv
function einRowRO(lid,a,editing,l){
  const fremd = a.von && a.von!==ME;
  const farbe = (l && l.zusammengefuehrt && a.von) ? autorFarbe(a.von) : null;
  const herkunft = (l && l.zusammengefuehrt && a.von) ? `<small style="color:${farbe};font-weight:600">${esc(a.von)}</small>` : "";
  return `<div class="row ${a.d?'done':''}" style="margin-bottom:6px${farbe?`;border-left:3px solid ${farbe};padding-left:8px`:''}">
    <div class="cb ${a.d?'on':''}" onclick="toggleEinIn('${lid}','${a.id}')">${a.d?'✓':''}</div>
    <div class="tx"><span style="margin-right:7px">${foodIcon(a.tx)}</span>${esc(a.tx)}${a.menge?` <span style="color:var(--ink2)">(${esc(a.menge)})</span>`:""} ${herkunft}</div>
    ${editing?`<div class="del" onclick="delEinIn('${lid}','${a.id}')">×</div>`:""}</div>`;
}

// HTML meines Entwurfs (voll bearbeitbar)
function entwurfHtml(l){
  const offen = l.artikel.filter(a=>!a.d).sort((a,b)=>warenGruppeIndex(a.tx)-warenGruppeIndex(b.tx));
  const erledigt = l.artikel.filter(a=>a.d);
  AKT_LISTE = l.id;
  return `<div class="list">${offen.map(einRow).join("")}${erledigt.map(einRow).join("")}</div>
    <div style="padding:14px 16px 4px;display:flex;gap:8px">
      <button class="btn" style="flex:1" onclick="abschickenDialog('${l.id}')">✓ Abschicken</button>
      <button class="cbtn" style="flex:0 0 auto;padding:0 16px" onclick="behalteListe('${l.id}')">Nur für mich</button></div>`;
}
// Liste behalten (nicht abschicken) -> als eigene "abgeschickte" Liste an mich selbst
window.behalteListe = id => {
  const l=DB.listen.find(x=>x.id===id); if(!l||!l.artikel.length){ alert("Die Liste ist leer."); return; }
  l.status="abgeschickt"; l.empfaenger=[ME]; l.abgeschicktAm=now(); l.nurFuerMich=true; l.updatedAt=now();
  save(); RENDER.einkauf();
};

// Schnellauswahl-HTML. zielListe = ID, in die hinzugefügt wird (sonst aktiver Entwurf)
function schnellauswahlHtml(hinweisOnly, zielListe){
  const grouped = {};
  DB.einkaufStamm.forEach(s=>{ const t=warenGruppeTitel(s); (grouped[t]=grouped[t]||[]).push(s); });
  const ordered = [...WARENGRUPPEN.map(g=>g.titel), "Sonstiges"].filter(t=>grouped[t]);
  const clickFn = s => hinweisOnly ? `neuerEntwurf('${esc(s)}')` : (zielListe ? `addEinTo('${zielListe}','${esc(s)}')` : `addEin('${esc(s)}',this)`);
  const inner = ordered.map(t=>`
    <div class="wg-titel">${t}</div>
    <div class="chips">${grouped[t].map(s=>`<div class="chip" onclick="${clickFn(s)}"><span style="margin-right:5px">${foodIcon(s)}</span>${esc(s)}</div>`).join("")}</div>`).join("");
  return `<div class="section-label" style="display:flex;justify-content:space-between;align-items:center">Schnellauswahl
      <span style="text-transform:none;font-weight:600;color:var(--accent)" onclick="editStamm()">Bearbeiten</span></div>${inner}`;
}

// Neuen Entwurf beginnen (optional gleich mit erstem Artikel)
window.neuerEntwurf = (ersterArtikel) => {
  let l = meinEntwurf();
  if(!l){ l={id:uid(), status:"entwurf", ersteller:ME, empfaenger:[], artikel:[], createdAt:now(), updatedAt:now()}; DB.listen.push(l); }
  if(ersterArtikel){ l.artikel.push({id:uid(),tx:ersterArtikel,menge:"",d:false,von:ME,createdAt:now(),updatedAt:now()}); }
  AKT_LISTE=l.id; l.updatedAt=now(); save(); RENDER.einkauf();
};

const einRow = a => `<div class="row ${a.d?'done':''}">
  <div class="cb ${a.d?'on':''}" onclick="toggleEin('${a.id}')">${a.d?'✓':''}</div>
  <div class="tx"><span style="margin-right:7px">${foodIcon(a.tx)}</span>${esc(a.tx)}</div>
  <div class="qty ${a.menge?'set':''}" onclick="editMenge('${a.id}')">${a.menge?esc(a.menge):'+ Menge'}</div>
  <div class="del" onclick="delEin('${a.id}')">×</div></div>`;
const aktListe = () => DB.listen.find(l=>l.id===AKT_LISTE);

window.addEin = (tx, el) => {
  const l=aktListe(); if(!l) return;
  if(l.artikel.some(a=>a.tx.toLowerCase()===tx.toLowerCase()&&!a.d)){
    if(el){ el.classList.add("chip-dup"); setTimeout(()=>el.classList.remove("chip-dup"),500); }
    return;
  }
  l.artikel.push({id:uid(),tx,menge:"",d:false,von:ME,createdAt:now(),updatedAt:now()}); l.updatedAt=now();
  zaehleArtikel(tx);
  save();
  if(el){ el.classList.add("chip-added"); setTimeout(()=>{ RENDER.einkauf(); }, 280); }
  else RENDER.einkauf();
};
window.toggleEin = id => { const l=aktListe(); const a=l.artikel.find(x=>x.id===id); a.d=!a.d; a.updatedAt=now(); l.updatedAt=now(); save(); RENDER.einkauf(); };
window.delEin = id => { const l=aktListe(); l.artikel=l.artikel.filter(x=>x.id!==id); l.updatedAt=now(); save(); RENDER.einkauf(); };

// Aktionen in abgeschickten Listen
window.toggleEinIn = (lid,aid) => { const l=DB.listen.find(x=>x.id===lid); const a=l.artikel.find(x=>x.id===aid); a.d=!a.d; a.updatedAt=now(); l.updatedAt=now();
  // Wenn jetzt alle Artikel abgehakt sind -> Liste ins Archiv
  if(l.artikel.length && l.artikel.every(x=>x.d)){ l.archiviert=true; if(window._openListe===lid)window._openListe=null; }
  save(); RENDER.einkauf(); };
window.delEinIn = (lid,aid) => { const l=DB.listen.find(x=>x.id===lid); l.artikel=l.artikel.filter(x=>x.id!==aid); l.updatedAt=now(); save(); RENDER.einkauf(); };
window.addEinTo = (lid,tx) => { tx=(tx||"").trim(); if(!tx)return; const l=DB.listen.find(x=>x.id===lid);
  l.artikel.push({id:uid(),tx,menge:"",d:false,von:ME,createdAt:now(),updatedAt:now()}); l.updatedAt=now(); zaehleArtikel(tx);
  // Wenn ich der Ersteller bin und nachträglich etwas ergänze -> Empfänger informieren
  if(l.ersteller===ME && l.status==="abgeschickt" && l.empfaenger && l.empfaenger.length){
    l.empfaenger.forEach(person=> notify(`${ME} hat „${tx}" zur Einkaufsliste ergänzt`, {ziel:person, listeId:l.id}));
  }
  save(); RENDER.einkauf(); };
window.startEdit = id => { window._editListe=id; RENDER.einkauf(); };
window.stopEdit = () => { window._editListe=null; RENDER.einkauf(); };

// Artikel zählen -> ab 5x automatisch in die Schnellauswahl
function zaehleArtikel(tx){
  const key = tx.toLowerCase().trim();
  DB.artikelZaehler = DB.artikelZaehler||{};
  DB.artikelZaehler[key] = (DB.artikelZaehler[key]||0)+1;
  if(DB.artikelZaehler[key]>=5 && !DB.einkaufStamm.some(s=>s.toLowerCase()===key)){
    // Originalschreibweise verwenden (erstes Vorkommen)
    DB.einkaufStamm.push(tx.trim());
    notify(`„${tx.trim()}" wurde zur Schnellauswahl hinzugefügt (oft gekauft)`, {ziel:ME});
  }
}

// Liste abschicken – mit Empfängerwahl (Vorschlag voreingestellt)
window.abschickenDialog = id => {
  const l=DB.listen.find(x=>x.id===id); if(!l||!l.artikel.length){ alert("Die Liste ist leer."); return; }

// ============================================================
//  Geo-Hilfen: Adresse -> Koordinaten, Routing (kostenlos)
// ============================================================
// Google-Teilen-Links auflösen wir nicht serverseitig (CORS),
// aber wir extrahieren Koordinaten, falls im Link enthalten,
// sonst wird der Klartext an Nominatim geschickt.
function parseGeo(input){
  const s = (input||"").trim();
  // @lat,lng  oder  /lat,lng  in Google-Links
  let m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || s.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/)
       || s.match(/(-?\d+\.\d{3,}),\s*(-?\d+\.\d{3,})/);
  if(m) return { lat:parseFloat(m[1]), lon:parseFloat(m[2]), label:null, raw:s };
  return { lat:null, lon:null, label:s, raw:s };
}
async function geocode(text){
  // bereits Koordinaten?
  const g = parseGeo(text);
  if(g.lat!=null) return { lat:g.lat, lon:g.lon, name:text };
  // Nominatim (OpenStreetMap) – kostenlos. Sprache als URL-Parameter,
  // KEIN Custom-Header (würde CORS-Preflight auslösen und scheitern).
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=de&q="+encodeURIComponent(g.label);
  const r = await fetch(url);
  if(!r.ok) throw new Error("Geocoding fehlgeschlagen");
  const j = await r.json();
  if(!j.length) throw new Error("Adresse nicht gefunden");
  return { lat:parseFloat(j[0].lat), lon:parseFloat(j[0].lon), name:j[0].display_name.split(",")[0] };
}
// Routing zwischen zwei Punkten. Standard: OSRM (kostenlos, PKW).
// Optional: OpenRouteService mit Schlüssel -> Wohnmobil-Profil (hgv).
async function routeBetween(a, b){
  const orsKey = localStorage.getItem("familienapp.orsKey");
  if(orsKey){
    const url = "https://api.openrouteservice.org/v2/directions/driving-hgv";
    const r = await fetch(url, { method:"POST",
      headers:{ "Authorization":orsKey, "Content-Type":"application/json" },
      body: JSON.stringify({ coordinates:[[a.lon,a.lat],[b.lon,b.lat]] }) });
    if(r.ok){ const j=await r.json(); const sum=j.routes[0].summary;
      return { km: sum.distance/1000, min: sum.duration/60, profil:"Wohnmobil" }; }
  }
  // OSRM-Demo (PKW)
  const url = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;
  const r = await fetch(url);
  if(!r.ok) throw new Error("Route fehlgeschlagen");
  const j = await r.json();
  if(!j.routes || !j.routes.length) throw new Error("keine Route");
  return { km: j.routes[0].distance/1000, min: j.routes[0].duration/60, profil:"PKW" };
}
function fmtDauer(min){ const h=Math.floor(min/60), m=Math.round(min%60); return h?`${h} h ${m} min`:`${m} min`; }

let URLAUB_ARCHIV = false;
RENDER.urlaub = () => {
  // Eine Reise ist "vergangen", wenn ihr Bis-Datum (sonst Von) vor heute liegt
  const istVergangen = u => {
    const ref = u.bis || u.von; if(!ref) return false;
    return daysUntil(ref) < 0;
  };
  const aktiv = DB.urlaub.filter(u=>!istVergangen(u)&&!u.deleted);
  const archiv = DB.urlaub.filter(u=>istVergangen(u)&&!u.deleted);
  const liste = (URLAUB_ARCHIV ? archiv : aktiv).sort((a,b)=>{
    if(!a.von)return 1; if(!b.von)return -1;
    return URLAUB_ARCHIV ? new Date(b.von)-new Date(a.von) : new Date(a.von)-new Date(b.von);
  });
  setHead("Urlaubsplanung", (URLAUB_ARCHIV?archiv.length+" archiviert":aktiv.length+" geplant"), {label:"⚙︎", fn:routingSettings});
  let html = `<div class="seg" style="margin:0 16px 12px">
    <div class="opt ${!URLAUB_ARCHIV?'on':''}" onclick="urlaubTab(false)">Geplant${aktiv.length?" ("+aktiv.length+")":""}</div>
    <div class="opt ${URLAUB_ARCHIV?'on':''}" onclick="urlaubTab(true)">Archiv${archiv.length?" ("+archiv.length+")":""}</div></div>`;
  html += liste.length
    ? `<div class="list">${liste.map(reiseKarte).join("")}</div>`
    : empty("plane", URLAUB_ARCHIV?"Noch keine vergangenen Reisen":"Noch keine Reise geplant");
  vBody().innerHTML = html;
  if(!URLAUB_ARCHIV) showFab(()=>openReise(null)); else document.getElementById("fab").style.display="none";
};

// Liste: Entfernung jeder Sehenswürdigkeit/Restaurant zum (ersten) Stellplatz der Stadt
function poiDistanzen(r,c,i){
  const basis = (c.stellplaetze||[]).find(s=>s.lat!=null);
  const ziele = [].concat((c.sehens||[]), (c.restaurants||[])).filter(p=>p.lat!=null);
  if(!basis || !ziele.length) return "";
  c._poiDist = c._poiDist || {};
  const rows = ziele.map(p=>{
    const key = basis.lat+","+basis.lon+">"+p.lat+","+p.lon;
    const d = c._poiDist[key];
    let txt;
    if(d==="err") txt = `<span style="color:var(--accent)">erneut ›</span>`;
    else if(d) txt = `${ICON.car} ${d.km.toFixed(0)} km · ${fmtDauer(d.min)}`;
    else txt = `<span style="color:var(--ink2)">berechne…</span>`;
    return `<div class="pdist-row"><span class="pdist-n">${esc(p.name)}</span><span class="pdist-v">${txt}</span></div>`;
  }).join("");
  return `<div class="pdist"><div class="pdist-h">Entfernung ab ${esc(basis.name)}</div>${rows}</div>`;
}
// Distanzen aller POIs einer Stadt zum Stellplatz nacheinander berechnen
window.calcPoiDist = async (rid,ci) => {
  const r=DB.urlaub.find(x=>x.id===rid); if(!r)return;
  const c=r.staedte[ci]; if(!c)return;
  const basis=(c.stellplaetze||[]).find(s=>s.lat!=null); if(!basis)return;
  const ziele=[].concat((c.sehens||[]),(c.restaurants||[])).filter(p=>p.lat!=null);

  for(const p of ziele){
    const key=basis.lat+","+basis.lon+">"+p.lat+","+p.lon;
    if(c._poiDist[key] && c._poiDist[key]!=="err") continue;
    try{ c._poiDist[key]=await routeBetween(basis,p); }

    if(CURRENT==="urlaub" && DETAIL_OPEN===rid) renderReiseDetail(r);
  }
};

function renderLeg(r,i){
  const a=r.staedte[i], b=r.staedte[i+1];
  r._legs = r._legs||{};
  const stops = a.stopps||[];
  const key = a.lat+","+a.lon+">"+b.lat+","+b.lon;
  const cached = r._legs[key];
  let info;
  if(a.lat==null||b.lat==null) info = `<span class="linfo">Etappe nicht berechenbar – Koordinaten fehlen</span>`;
  else if(cached==="err") info = `<span class="linfo" id="leg_${i}" onclick="calcLeg('${r.id}',${i})" style="cursor:pointer;color:var(--accent)">Berechnung fehlgeschlagen – erneut ›</span>`;
  else if(cached) info = `<span class="linfo">${ICON.car} ${cached.km.toFixed(0)} km · ${fmtDauer(cached.min)} <small>(${cached.profil})</small></span>`;
  else info = `<span class="linfo" id="leg_${i}" style="color:var(--ink2)">berechne…</span>`;
  // Google-Maps-Routenlink (führt optional über die Zwischenstopps)
  const routeHref = mapsRouteLink(a, b, stops);
  const stopsHtml = stops.length ? `<div class="stops">${stops.map((s,si)=>{
    const tgt = openTarget(s) || (s.lat!=null?mapsLink(s.lat+","+s.lon):(s.name?mapsLink(s.name):""));
    const meta = [s.entfernung, s.dauer].filter(Boolean).join(" · ");
    return `<div class="stop"><span class="si">${ICON.pin}</span>
      <div class="sn">${esc(s.name)}
        ${meta?`<small>${ICON.car?"":""}${esc(meta)}</small>`:""}
        ${s.hinweis?`<small>📌 ${esc(s.hinweis)}</small>`:""}
        ${tgt?`<a class="smap" href="${esc(tgt)}" target="_blank" rel="noopener">Karte öffnen</a>`:""}</div>
      <span class="sdel" onclick="delStop('${r.id}',${i},${si})">×</span></div>`;
  }).join("")}</div>` : "";
  return `<div class="leg">
    <div class="legrow"><div class="lline"></div>${info}<div class="lline"></div></div>
    ${stopsHtml}
    <div class="legacts">
      <a href="${esc(routeHref)}" target="_blank" rel="noopener">🗺️ Route in Google Maps</a>
      <a onclick="addStop('${r.id}',${i})">+ Zwischenstopp</a>
    </div>
  </div>`;
}
// Alle noch nicht berechneten Etappen automatisch nacheinander rechnen
window.autoCalcLegs = async rid => {
  const r=DB.urlaub.find(x=>x.id===rid); if(!r||!r.staedte)return;
  for(let i=0;i<r.staedte.length-1;i++){
    const a=r.staedte[i], b=r.staedte[i+1];
    if(a.lat==null||b.lat==null) continue;
    const key=a.lat+","+a.lon+">"+b.lat+","+b.lon;
    if(r._legs && r._legs[key] && r._legs[key]!=="err") continue;
    try{
      const res=await routeBetween(a,b);
      r._legs=r._legs||{}; r._legs[key]=res;
    }catch(e){ r._legs=r._legs||{}; r._legs[key]="err"; }
    if(CURRENT==="urlaub" && DETAIL_OPEN===rid) renderReiseDetail(r);
  }
};
window.calcLeg = async (rid,i) => {
  const r=DB.urlaub.find(x=>x.id===rid); const a=r.staedte[i], b=r.staedte[i+1];
  const el=document.getElementById("leg_"+i); if(el)el.textContent="berechne…";
  const key=a.lat+","+a.lon+">"+b.lat+","+b.lon;
  try{
    const res = await routeBetween(a,b);
    r._legs = r._legs||{}; r._legs[key] = res;
    renderReiseDetail(r);
  }catch(e){ r._legs=r._legs||{}; r._legs[key]="err"; renderReiseDetail(r); }
};

window.saveStop = async () => {
  const { rid, i } = window._stopCtx;
  const r = DB.urlaub.find(x=>x.id===rid); if(!r) return;
  const name = document.getElementById("st_name").value.trim(); if(!name) return;
  const linkRaw = document.getElementById("st_link").value.trim();
  const hinweis = document.getElementById("st_hint").value.trim();
  const link = cleanLink(linkRaw);
  const st = document.getElementById("st_geo"); st.textContent="Suche Koordinaten & Entfernung…";
  const g = parseGeo(linkRaw);
  let lat=g.lat, lon=g.lon;
  if(lat==null){
    try{ const geo = await geocode([name, linkRaw].filter(Boolean).join(", ")); lat=geo.lat; lon=geo.lon; }
    catch(e){ /* ohne Koordinaten speichern */ }
  }
  const stop = { id:uid(), name, link, hinweis, lat, lon, adresse:g.label||(link?"":linkRaw) };
  // Entfernung & Fahrzeit vom vorherigen Ort (Stadt i) zum Stopp – wie in der App üblich
  const a = r.staedte[i];
  if(a && a.lat!=null && lat!=null){
    try{ const res = await routeBetween(a, stop);
      stop.entfernung = res.km.toFixed(0)+" km"; stop.dauer = fmtDauer(res.min); }
    catch(e){ /* keine Route ermittelbar */ }
  }
  const c = r.staedte[i];
  c.stopps = c.stopps||[]; c.stopps.push(stop);
  r._legs = {};
  r.updatedAt=now(); save(); closeModal(); renderReiseDetail(r);
  autoCalcLegs(rid);
};

      const move=ev=>{
        const el=document.elementFromPoint(ev.clientX,ev.clientY);
        const tc=el&&el.closest(".city"); list.querySelectorAll(".city").forEach(c=>c.classList.remove("drop-target"));
        if(tc&&tc!==card) tc.classList.add("drop-target");
      };
      const up=ev=>{
        document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up);
        card.classList.remove("dragging");
        const el=document.elementFromPoint(ev.clientX,ev.clientY);
        const tc=el&&el.closest(".city");
        list.querySelectorAll(".city").forEach(c=>c.classList.remove("drop-target"));
        if(tc&&tc!==card){ const to=+tc.dataset.i;
          const [m]=r.staedte.splice(dragIdx,1); r.staedte.splice(to,0,m);
          r._legs={}; r.updatedAt=now(); save(); renderReiseDetail(r); }
      };
      document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
    });
  });
}
