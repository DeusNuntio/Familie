// ============================================================
//  Formular-Blatt (Sheet): Beschriftungen, Fokusverwaltung, Validierung
// ============================================================
// Verknuepft jede <label> im Blatt automatisch mit dem zugehoerigen Feld.
// Dadurch lesen Screenreader die Beschriftung vor und ein Tipp auf die
// Beschriftung setzt den Fokus ins Feld – ohne dass jedes einzelne Formular
// angefasst werden muss (WCAG 1.3.1 / 3.3.2).
let _labelZaehler = 0;
function verknuepfeBeschriftungen(wurzel){
  wurzel.querySelectorAll(".fld").forEach(fld => {
    const label = fld.querySelector("label");
    if(!label || label.getAttribute("for")) return;
    const feld = fld.querySelector("input,select,textarea");
    if(!feld) return;
    if(!feld.id) feld.id = "fld_auto_" + (++_labelZaehler);
    label.setAttribute("for", feld.id);
  });
}
// Fokus bleibt im geoeffneten Blatt (WCAG 2.4.3)
function fokusFalle(e){
  if(e.key !== "Tab") return;
  const felder = sheet.querySelectorAll(
    'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])');
  if(!felder.length) return;
  const erstes = felder[0], letztes = felder[felder.length-1];
  if(e.shiftKey && document.activeElement === erstes){ e.preventDefault(); letztes.focus(); }
  else if(!e.shiftKey && document.activeElement === letztes){ e.preventDefault(); erstes.focus(); }
}
let _fokusVorSheet = null;

function openSheet(html){
  _fokusVorSheet = document.activeElement;
  sheet.innerHTML='<div class="handle"></div>'+html;
  modal.classList.add("active");
  sheet.scrollTop=0;
  verknuepfeBeschriftungen(sheet);
  const titel = sheet.querySelector("h3");
  if(titel){
    if(!titel.id) titel.id = "sheetTitel";
    sheet.setAttribute("aria-labelledby", titel.id);
    sheet.removeAttribute("aria-label");
  }
  // Fokus ins Blatt holen, ohne ein Eingabefeld zu aktivieren (sonst springt
  // auf dem Handy sofort die Tastatur auf). Tab beginnt dadurch im Blatt.
  sheet.setAttribute("tabindex","-1");
  try{ sheet.focus({ preventScroll:true }); }catch(e){}
  document.addEventListener("keydown", fokusFalle);
  document.addEventListener("keydown", escSchliesst);
  pushNav();
}
function escSchliesst(e){ if(e.key === "Escape") closeModal(); }

// ============================================================
//  Formularpruefung mit sichtbarer Rueckmeldung
// ============================================================
// Frueher brach das Speichern bei fehlendem Pflichtfeld kommentarlos ab –
// fuer den Nutzer sieht das aus, als sei der Knopf kaputt.
function pruefeFormular(regeln){
  let ok = true, erstesFehlerFeld = null;
  Object.keys(regeln).forEach(feldId => {
    const el = document.getElementById(feldId);
    if(!el) return;
    const fehler = regeln[feldId](el.value);
    const box = el.closest(".fld") || el.parentNode;
    const alt = box.querySelector(".feld-fehler");
    if(alt) alt.remove();
    if(fehler){
      ok = false;
      el.setAttribute("aria-invalid","true");
      box.insertAdjacentHTML("beforeend",
        `<div class="feld-fehler" role="alert">${esc(fehler)}</div>`);
      if(!erstesFehlerFeld) erstesFehlerFeld = el;
    } else {
      el.removeAttribute("aria-invalid");
    }
  });
  if(erstesFehlerFeld) erstesFehlerFeld.focus();
  return ok;
}
const pflicht = text => v => String(v||"").trim() ? null : text;

let TODO_TAB = "aufgaben";
RENDER.todos = () => {

    const open = DB.todos.filter(t=>!t.done&&!t.deleted).sort(sortByDue);

    vBody().innerHTML = tabs + (DB.todos.length? "" : empty("checkbox","Noch keine Aufgaben"))

    document.getElementById("vsub").textContent = DB.wiederkehrend.filter(w=>!w.deleted).length+" Einträge";
    const STUFE_RANG = { hoch:0, mittel:1, niedrig:2 };

      const ra=STUFE_RANG[dringlichkeit(a)], rb=STUFE_RANG[dringlichkeit(b)];

// ============================================================
//  Wiederkehrende Aufgaben (To-do-Kalender)
// ============================================================
const INTERVALLE = [
  {key:"woechentlich", label:"Wöchentlich", tage:7},
  {key:"monatlich", label:"Monatlich", monate:1},
  {key:"vierteljaehrlich", label:"Vierteljährlich", monate:3},
  {key:"halbjaehrlich", label:"Halbjährlich", monate:6},
  {key:"jaehrlich", label:"Jährlich", monate:12},
  {key:"frei", label:"Frei (Tage)", tage:null},
];
function intervallLabel(w){
  const i = INTERVALLE.find(x=>x.key===w.intervall);
  if(w.intervall==="frei") return `alle ${w.freiTage||0} Tage`;
  return i? i.label : "";
}
// Länge eines Intervalls in Tagen (für Fortschritt/Dringlichkeit)
function intervallTage(w){
  const def = INTERVALLE.find(x=>x.key===w.intervall);
  if(!def) return 30;
  if(w.intervall==="frei") return Math.max(1, parseInt(w.freiTage)||1);
  if(def.tage) return def.tage;
  return Math.round((def.monate||1)*30.44); // Monate näherungsweise in Tage
}
// Datum, ab dem das aktuelle Intervall läuft: letzte Erledigung, sonst Start
function basisDatum(w){
  if(w.letzteErledigung) return w.letzteErledigung;
  return w.start || heuteISO();
}
// Einen Intervallschritt weiterrechnen (gemeinsame Grundlage aller Fälligkeitsberechnungen)
function intervallSchritt(d, w){
  const def = INTERVALLE.find(x=>x.key===w.intervall);
  if(w.intervall==="frei"){ const n=new Date(d); n.setDate(n.getDate()+(parseInt(w.freiTage)||1)); return n; }
  if(def && def.tage){ const n=new Date(d); n.setDate(n.getDate()+def.tage); return n; }
  if(def) return monateAddieren(d, def.monate);
  return null;
}
// Letzte bereits verstrichene Fälligkeit seit der Basis (oder null, wenn noch keine).
// Nötig, damit ein Termin nicht ersatzlos entfällt, wenn die App am Fälligkeitstag
// nicht geöffnet wurde – die Fälligkeitsberechnung springt sonst zum nächsten Termin.
function letzteVerstricheneFaelligkeit(w){
  const heute = new Date(); heute.setHours(0,0,0,0);
  let d = new Date(basisDatum(w)+"T00:00:00");
  let letzte = null, guard = 0;
  let n = intervallSchritt(d, w);
  while(n && n <= heute && guard < 2000){ guard++; letzte = n; n = intervallSchritt(n, w); }
  return letzte ? isoLokal(letzte) : null;
}
// Nächste Fälligkeit ab Basis (erledigungsbasiert)
function naechsteFaelligkeit(w){
  const basis = basisDatum(w);
  let d = new Date(basis+"T00:00:00");
  // Genau ein Intervall ab Basis weiter
  if(w.intervall==="frei") d.setDate(d.getDate()+(parseInt(w.freiTage)||1));
  else { const def=INTERVALLE.find(x=>x.key===w.intervall);
    if(def && def.tage) d.setDate(d.getDate()+def.tage);
    else if(def) d = monateAddieren(d, def.monate);
  }
  // Falls noch nie erledigt UND Start liegt in der Vergangenheit: bis heute fortschreiben,
  // damit die erste Fälligkeit nicht künstlich überfällig erscheint.
  if(!w.letzteErledigung){
    const heute = new Date(); heute.setHours(0,0,0,0);
    const def = INTERVALLE.find(x=>x.key===w.intervall);
    let guard=0;
    while(d < heute && guard<2000){
      guard++;
      if(w.intervall==="frei") d.setDate(d.getDate()+(parseInt(w.freiTage)||1));
      else if(def && def.tage) d.setDate(d.getDate()+def.tage);
      else if(def) d = monateAddieren(d, def.monate);
    }
  }
  return isoLokal(d);
}
// Dringlichkeitsstufe nach Zeitfortschritt im laufenden Intervall:
//  < 50 % -> niedrig, 50-85 % -> mittel, > 85 % oder überfällig -> hoch
function dringlichkeit(w){
  const ges = intervallTage(w);
  const rest = daysUntil(naechsteFaelligkeit(w)); // Tage bis fällig (negativ = überfällig)
  if(rest===null) return "niedrig";
  const verbraucht = ges - rest;             // wie viele Tage des Intervalls vorbei
  const anteil = ges>0 ? verbraucht/ges : 1; // 0 = gerade erledigt, 1 = fällig
  if(rest < 0 || anteil >= 0.85) return "hoch";
  if(anteil >= 0.50) return "mittel";
  return "niedrig";
}
const PRIO_FARBE = { niedrig:"#16a34a", mittel:"#d97706", hoch:"#dc2626" };
const PRIO_LABEL = { niedrig:"Niedrig", mittel:"Mittel", hoch:"Hoch" };
// "zuletzt erledigt vor X" – menschenlesbar
function zuletztText(w){
  if(!w.letzteErledigung) return "noch nie erledigt";
  const tage = -daysUntil(w.letzteErledigung); // Tage seit Erledigung
  if(tage<=0) return "heute erledigt";
  if(tage===1) return "gestern erledigt";
  if(tage<7) return `vor ${tage} Tagen erledigt`;
  if(tage<14) return "vor 1 Woche erledigt";
  if(tage<31) return `vor ${Math.round(tage/7)} Wochen erledigt`;
  if(tage<60) return "vor 1 Monat erledigt";
  if(tage<365) return `vor ${Math.round(tage/30.44)} Monaten erledigt`;
  return `vor ${(tage/365).toFixed(1)} Jahren erledigt`;
}
function wiederCard(w){
  const naechste = naechsteFaelligkeit(w);
  const d = daysUntil(naechste);
  const wann = d<0?(-d===1?"1 Tag überfällig":(-d)+" Tage überfällig") : d===0?"heute fällig" : d===1?"morgen fällig" : "in "+d+" Tagen fällig";
  const stufe = dringlichkeit(w);
  const farbe = PRIO_FARBE[stufe];
  // Fortschrittsbalken: Anteil des verbrauchten Intervalls
  const ges = intervallTage(w);
  const verbraucht = ges - (d===null?0:d);
  const anteil = Math.max(0, Math.min(1, ges>0?verbraucht/ges:1));
  return `<div class="card" style="border-left:4px solid ${farbe}" onclick="openWiederEditor('${w.id}')">
    <div class="cttl">${esc(w.titel)}</div>
    <div class="cmeta">
      <span class="pill cat">${esc(intervallLabel(w))}</span>
      <span class="pill" style="background:${farbe}1a;color:${farbe}">${PRIO_LABEL[stufe]}</span>
      <span class="pill due ${d<0?'over':''}">${ICON.checklist} ${wann}</span>
      ${(w.werListe&&w.werListe.length)?w.werListe.map(p=>`<span class="pill who">${esc(p)}</span>`).join(""):""}</div>
    <div class="wieder-bar"><div class="wieder-fill" style="width:${(anteil*100).toFixed(0)}%;background:${farbe}"></div></div>
    <div class="cdesc" style="display:flex;justify-content:space-between;gap:8px">
      <span>${zuletztText(w)}</span><span style="color:var(--ink2)">nächster Termin: ${fmtDate(naechste)}</span></div>
    <div style="margin-top:10px">
      <button class="cbtn" style="width:100%;color:${farbe};border-color:${farbe};font-weight:650" onclick="event.stopPropagation();erledigtWieder('${w.id}')">✓ Jetzt erledigt</button></div>
    ${w.autor?`<div class="byline">angelegt von ${esc(w.autor)}</div>`:""}</div>`;
}

// Erzeugt aus wiederkehrenden Aufgaben ein echtes To-do, sobald die Dringlichkeit "Hoch" erreicht
function erzeugeFaelligeWiederkehrend(){
  if(!DB.wiederkehrend) return;
  let erzeugt=false;
  // Legt genau ein To-do für einen Fälligkeitstermin an. Die ID ist deterministisch,
  // damit zwei Geräte, die unabhängig voneinander erzeugen, kein Duplikat produzieren.
  const anlegen = (w, datum) => {
    const marker = w.id+"@"+datum;
    const tid = "wk_"+w.id+"_"+datum;
    w.erzeugt = w.erzeugt || [];
    if(w.erzeugt.includes(marker)) return false;
    if(DB.todos.some(t=>t.id===tid)) return false;
    DB.todos.push({
      id:tid, titel:w.titel, notiz:"(wiederkehrend: "+intervallLabel(w)+")",
      faellig:datum, prio:"hoch",
      werListe:w.werListe||[], wer:(w.werListe||[]).join(", "),
      done:false, autor:w.autor||ME, ausWiederkehrend:w.id,
      createdAt:now(), updatedAt:now()
    });
    w.erzeugt.push(marker);
    if(w.erzeugt.length>20) w.erzeugt = w.erzeugt.slice(-20);
    return true;
  };
  DB.wiederkehrend.forEach(w=>{
    if(w.deleted) return;
    // 1) Bereits verstrichene Fälligkeit nachholen. Ohne das entfällt ein Termin
    //    ersatzlos, wenn die App im engen Fälligkeitsfenster nicht geöffnet wurde.
    const verpasst = letzteVerstricheneFaelligkeit(w);
    if(verpasst && (!w.letzteErledigung || verpasst > w.letzteErledigung)){
      if(anlegen(w, verpasst)) erzeugt = true;
    }
    // 2) Bevorstehende Fälligkeit ankündigen, sobald das Intervall weitgehend
    //    verbraucht ist (unverändertes Verhalten).
    if(dringlichkeit(w)==="hoch"){
      if(anlegen(w, naechsteFaelligkeit(w))) erzeugt = true;
    }
  });
  if(erzeugt) save();
}

// ============================================================
//  Kalender (Monatsansicht: To-dos, Reparaturen, Reisen, Wiederkehrendes)
// ============================================================
// Sammelt alle datierten Einträge als {datum, titel, typ, farbe, ref}
// ============================================================
//  Serientermine
// ============================================================
// Serien werden NICHT als Einzeldatensätze gespeichert, sondern als Regel am
// Termin abgelegt und zur Anzeige berechnet. Ein Geburtstag ist damit ein
// Datensatz für alle Jahre statt einer pro Jahr – das hält die Sync-Datei klein
// und macht Änderungen an der Serie sofort auf allen Geräten wirksam.
//   t.serie     = { frequenz:"woechentlich"|"zweiwoechentlich"|"monatlich"|"jaehrlich", bis:"" }
//   t.ausnahmen = ["2026-08-15", …]   einzeln entfernte Vorkommen
//   t.geburtsjahr = 1982              nur bei Geburtstagen, für die Altersanzeige
const SERIE_LABEL = {
  woechentlich:      "wöchentlich",
  zweiwoechentlich:  "alle 2 Wochen",
  monatlich:         "monatlich",
  jaehrlich:         "jährlich"
};

// Addiert Monate und begrenzt den Tag auf das Monatsende
// (31.01. + 1 Monat = 28.02., nicht 03.03.).
function monatePlus(datum, anzahl){
  const tag = datum.getDate();
  const d = new Date(datum.getFullYear(), datum.getMonth() + anzahl, 1);
  const letzter = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(tag, letzter));
  return d;
}

// Liefert alle Vorkommen einer Terminserie innerhalb des Fensters [von, bis].
function serieVorkommen(t, vonISO, bisISO){
  const start = new Date(t.datum + "T00:00:00");
  const fensterVon = new Date(vonISO + "T00:00:00");
  const fensterBis = new Date(bisISO + "T00:00:00");
  const serienEnde = t.serie.bis ? new Date(t.serie.bis + "T00:00:00") : null;
  const ausnahmen = new Set(t.ausnahmen || []);
  const frequenz = t.serie.frequenz;

  // Jedes Vorkommen wird aus dem STARTDATUM abgeleitet, nicht aus dem jeweils
  // vorherigen. Sonst wandert der Tag bei Monatsenden: 31.01. -> 28.02. -> 28.03.
  // statt 31.03. Der Ankertag bleibt so über die ganze Reihe erhalten.
  const schrittTage   = frequenz === "woechentlich" ? 7
                      : frequenz === "zweiwoechentlich" ? 14 : 0;
  const schrittMonate = frequenz === "monatlich" ? 1
                      : frequenz === "jaehrlich" ? 12 : 0;
  const datumFuer = n => {
    if(schrittTage){
      const d = new Date(start);
      d.setDate(start.getDate() + n * schrittTage);
      return d;
    }
    return monatePlus(start, n * schrittMonate);
  };

  // Einstiegspunkt abschätzen, damit lange zurückliegende Reihen
  // (z. B. ein Geburtstag seit 1982) nicht Hunderte Schritte kosten.
  let n = 0;
  if(start < fensterVon){
    if(schrittTage){
      n = Math.max(0, Math.floor((fensterVon - start) / 86400000 / schrittTage) - 1);
    } else {
      const monate = (fensterVon.getFullYear() - start.getFullYear()) * 12
                   + (fensterVon.getMonth() - start.getMonth());
      n = Math.max(0, Math.floor(monate / schrittMonate) - 1);
    }
  }

  const treffer = [];
  let schutz = 0;
  while(schutz++ < 800){
    const d = datumFuer(n);
    if(d > fensterBis) break;
    if(serienEnde && d > serienEnde) break;
    if(d >= fensterVon && d >= start){
      const iso = isoLokal(d);
      if(!ausnahmen.has(iso)) treffer.push(iso);
    }
    n++;
  }
  return treffer;
}

// Sammelt alle datierten Einträge als {datum, titel, typ, farbe, ref}.
// von/bis begrenzen das Fenster – nötig, weil Serien sonst unbegrenzt wären.
// Ohne Angabe gilt ein Standardfenster von 45 Tagen zurück bis 400 Tage voraus.
function kalenderEintraege(von, bis){
  if(!von || !bis){
    const a = new Date(); a.setDate(a.getDate() - 45);
    const b = new Date(); b.setDate(b.getDate() + 400);
    von = von || isoLokal(a);
    bis = bis || isoLokal(b);
  }
  const out=[];
  DB.todos.filter(t=>!t.deleted && t.faellig).forEach(t=>out.push({datum:t.faellig,titel:t.titel,typ:"Aufgabe",farbe:"#1d4ed8",modul:"todos"}));
  DB.reparaturen.filter(r=>!r.deleted && r.faellig).forEach(r=>out.push({datum:r.faellig,titel:r.titel,typ:"Reparatur",farbe:"#ea580c",modul:"reparaturen"}));
  (DB.essensplan||[]).filter(e=>!e.deleted && e.datum).forEach(e=>out.push({datum:e.datum,titel:"Essen: "+e.titel,typ:"Essen",farbe:"#b45309",modul:"essensplan"}));
  // Reisen: jeden Tag von Start bis Ende markieren
  DB.urlaub.filter(u=>!u.deleted && u.von).forEach(u=>{
    const start=new Date(u.von+"T00:00:00");
    const ende = u.bis ? new Date(u.bis+"T00:00:00") : new Date(u.von+"T00:00:00");
    const titel=u.titel||"Reise";
    const tage=Math.max(0, Math.round((ende-start)/86400000));
    for(let i=0;i<=tage;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const istRand = (i===0 || i===tage);
      const suffix = tage>0 ? (i===0?" (Anreise)":i===tage?" (Abreise)":"") : "";
      out.push({datum:isoLokal(d),titel:titel+suffix,typ:"Reise",farbe:"#16a34a",modul:"urlaub",reiseId:u.id,zwischentag:!istRand});
    }
    // Restaurant-Reservierungen dieser Reise (Tagesplan + ältere restaurants-Struktur)
    aktiv(u.staedte).forEach(c=>{
      const restEintraege = [].concat(
        (c.restaurants||[]),
        tagesEintraege(c).filter(e=>e.typ==="restaurant")
      );
      restEintraege.forEach(p=>{
        if(p.resDatum) out.push({datum:p.resDatum,titel:"Reservierung: "+(p.name||"Restaurant")+(p.resZeit?" · "+p.resZeit:""),typ:"Reservierung",farbe:"#db2777",modul:"urlaub",reiseId:u.id});
      });
      // Aufenthalt pro Ort (von–bis): jeden Tag markieren, Klick führt zur Reise
      if(c.von){
        const cs=new Date(c.von+"T00:00:00");
        const ce=c.bis?new Date(c.bis+"T00:00:00"):new Date(c.von+"T00:00:00");
        const ct=Math.max(0,Math.round((ce-cs)/86400000));
        for(let k=0;k<=ct;k++){
          const d=new Date(cs); d.setDate(cs.getDate()+k);
          const rand=(k===0||k===ct);
          out.push({datum:isoLokal(d),titel:(c.name||"Ort")+" ("+titel+")",typ:"Ort",farbe:"#0d9488",modul:"urlaub",reiseId:u.id,zwischentag:!rand});
        }
      }
    });
  });
  // Wiederkehrende: nächste 6 Vorkommen
  DB.wiederkehrend.filter(w=>!w.deleted).forEach(w=>{
    let d=new Date(naechsteFaelligkeit(w)); const def=INTERVALLE.find(x=>x.key===w.intervall);
    for(let i=0;i<6;i++){
      out.push({datum:isoLokal(d),titel:w.titel,typ:"Wiederkehrend",farbe:"#7c3aed",modul:"todos"});
      const nd=new Date(d);
      if(w.intervall==="frei") nd.setDate(nd.getDate()+(parseInt(w.freiTage)||1));
      else if(def.tage) nd.setDate(nd.getDate()+def.tage); else nd = monateAddieren(nd, def.monate);
      d=nd;
    }
  });
  // Eigene Kalendertermine (direkt im Kalender angelegt)
  (DB.termine||[]).filter(t=>!t.deleted && t.datum).forEach(t=>{
    // Serientermin: alle Vorkommen im Fenster erzeugen
    if(t.serie && t.serie.frequenz){
      serieVorkommen(t, von, bis).forEach(iso => {
        let titel = (t.zeit ? t.zeit+"  " : "") + t.titel;
        let typ = "Termin";
        if(t.geburtsjahr){
          const alter = Number(iso.slice(0,4)) - Number(t.geburtsjahr);
          if(alter > 0 && alter < 130) titel += " (" + alter + ")";
          typ = "Geburtstag";
        }
        out.push({ datum:iso, titel, typ, farbe:t.geburtsjahr?"#c026d3":"#0891b2",
                   modul:"kalender", terminId:t.id, zeit:t.zeit||"", serie:true });
      });
      return;
    }
    out.push({datum:t.datum, titel:(t.zeit?t.zeit+" · ":"")+t.titel, typ:"Termin", farbe:"#0891b2", modul:"kalender", terminId:t.id});
  });
  return out;
}

window.kalModusSetzen = modus => {

// Montag der Woche, in der das übergebene Datum liegt.
// ACHTUNG: Nicht "wochenStart" nennen – diesen Namen belegt bereits der
// Essensplan mit anderer Signatur (Offset statt Datum). Die spätere
// Deklaration hätte die frühere überschrieben.
function kalWochenStart(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const wt = x.getDay() === 0 ? 6 : x.getDay() - 1;   // Mo = 0
  x.setDate(x.getDate() - wt);
  return x;
}
window.kalWoche = richtung => {
  const basis = KAL_WOCHE || kalWochenStart(new Date());
  const n = new Date(basis); n.setDate(basis.getDate() + richtung*7);
  KAL_WOCHE = n; RENDER.kalender();
};
window.kalHeute = () => {
  const h = new Date();
  KAL_WOCHE = kalWochenStart(h);
  KAL_MONAT = { jahr:h.getFullYear(), monat:h.getMonth() };
  RENDER.kalender();
};
function kalModusUmschalter(){
  return `<div class="kal-modus" role="group" aria-label="Ansicht wählen">
    <button type="button" class="km ${KAL_MODUS==="woche"?"on":""}"
      aria-pressed="${KAL_MODUS==="woche"}" onclick="kalModusSetzen('woche')">${t("Woche")}</button>
    <button type="button" class="km ${KAL_MODUS==="monat"?"on":""}"

}

// ---- Wochenansicht ----
// Auf dem Handy ist ein Stundenraster unbrauchbar. Stattdessen sieben Tage
// untereinander mit ihren Einträgen: beantwortet "Was ist diese Woche?" auf
// einen Blick, ohne dass man sieben Tage einzeln antippen muss.
function kalenderWocheHtml(){
  const heute = new Date();
  const heuteIso = heuteISO();
  const start = KAL_WOCHE || kalWochenStart(heute);
  const ende  = new Date(start); ende.setDate(start.getDate()+6);
  const vonIso = isoLokal(start), bisIso = isoLokal(ende);

  const proTag = {};
  kalenderEintraege(vonIso, bisIso).forEach(e => {
    (proTag[e.datum] = proTag[e.datum] || []).push(e);
  });

  const wtage = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"].map(t);
  let zeilen = "";
  for(let i=0; i<7; i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const iso = isoLokal(d);
    const alle = proTag[iso] || [];
    const evs = alle.filter(e=>!e.zwischentag)
      .sort((a,b)=>String(a.zeit||"~").localeCompare(String(b.zeit||"~")));
    const unterwegs = alle.some(e=>e.zwischentag);
    const inhalt = evs.length
      ? evs.map(e=>`<span class="wt-eintrag">
            <span class="kal-dot" style="background:${esc(e.farbe||"#0891b2")}"></span>
            <span class="wt-tx">${esc(e.titel)}</span></span>`).join("")
      : `<span class="wt-leer">${unterwegs ? t("unterwegs") : "–"}</span>`;
    zeilen += `<button type="button" class="wtag ${iso===heuteIso?"heute":""} ${evs.length?"hat":""}"
        onclick="kalTag('${iso}')">
        <span class="wt-kopf"><span class="wt-name">${wtage[i]}</span>
          <span class="wt-num">${d.getDate()}.${d.getMonth()+1}.</span></span>
        <span class="wt-body">${inhalt}</span></button>`;
  }

  const spanne = `${start.getDate()}.${start.getMonth()+1}. – ${ende.getDate()}.${ende.getMonth()+1}.${ende.getFullYear()}`;
  const aktuelle = isoLokal(kalWochenStart(heute)) === vonIso;

  return kalModusUmschalter() + `
    <div class="kal-nav">
      <button onclick="kalWoche(-1)" aria-label="Vorherige Woche">‹</button>
      <div>${esc(spanne)}</div>
      <button onclick="kalWoche(1)" aria-label="Nächste Woche">›</button>
    </div>
    ${aktuelle ? "" : `<button type="button" class="kal-heute-btn" onclick="kalHeute()">${t("Zur aktuellen Woche")}</button>`}
    <div class="wochenliste">${zeilen}</div>`;
}

RENDER.kalender = () => {
  setHead("Kalender", "", {label:"📅 Export", fn:kalAlleExport});
  const heute = new Date();

  // Wochenansicht: eigener Aufbau, danach dieselbe Liste kommender Termine
  if(KAL_MODUS === "woche"){
    const _s = KAL_WOCHE || kalWochenStart(heute);
    const _e = new Date(_s); _e.setDate(_s.getDate()+6);
    document.getElementById("vsub").textContent =
      `${_s.getDate()}.${_s.getMonth()+1}. – ${_e.getDate()}.${_e.getMonth()+1}.`;
    vBody().innerHTML = kalenderWocheHtml() + kalenderKommendeHtml();
    return;
  }
  if(!KAL_MONAT) KAL_MONAT = {jahr:heute.getFullYear(), monat:heute.getMonth()};
  const {jahr,monat} = KAL_MONAT;
  const monatsName = new Date(jahr,monat,1).toLocaleDateString("de-DE",{month:"long",year:"numeric"});
  document.getElementById("vsub").textContent = monatsName;

  // Nur den dargestellten Monat berechnen
  const eintraege = kalenderEintraege(isoLokal(new Date(jahr,monat,1)),
                                      isoLokal(new Date(jahr,monat+1,0)));
  // nach Tag gruppieren (nur dieser Monat)
  const proTag = {};
  eintraege.forEach(e=>{ const d=new Date(e.datum); if(d.getFullYear()===jahr&&d.getMonth()===monat){ const t=d.getDate(); (proTag[t]=proTag[t]||[]).push(e); } });

  const ersterTag = new Date(jahr,monat,1);
  let startWochentag = ersterTag.getDay(); startWochentag = startWochentag===0?6:startWochentag-1; // Mo=0
  const tageImMonat = new Date(jahr,monat+1,0).getDate();
  const istHeute = t => heute.getFullYear()===jahr&&heute.getMonth()===monat&&heute.getDate()===t;

  let zellen="";
  for(let i=0;i<startWochentag;i++) zellen+=`<div class="kal-zelle leer"></div>`;
  for(let t=1;t<=tageImMonat;t++){
    const evs=proTag[t]||[];
    const dots=evs.slice(0,4).map(e=>`<span class="kal-dot" style="background:${e.farbe}"></span>`).join("");
    zellen+=`<div class="kal-zelle ${istHeute(t)?'heute':''} ${evs.length?'hat':''}" onclick="kalTag(${t})">
      <div class="kal-num">${t}</div><div class="kal-dots">${dots}</div></div>`;
  }

  const wtage=["Mo","Di","Mi","Do","Fr","Sa","So"];
  // kommende Termine (Liste unter dem Kalender) – Reise-Zwischentage nicht einzeln auflisten
  vBody().innerHTML = kalModusUmschalter() + `
    <div class="kal-nav">
      <button onclick="kalMonat(-1)" aria-label="Vorheriger Monat">‹</button>
      <div>${monatsName}</div>
      <button onclick="kalMonat(1)" aria-label="Nächster Monat">›</button>
    </div>
    <div class="kal-grid kal-head">${wtage.map(w=>`<div class="kal-wt">${w}</div>`).join("")}</div>
    <div class="kal-grid">${zellen}</div>
    <div class="kal-legende">
      <span><span class="kal-dot" style="background:#1d4ed8"></span>Aufgabe</span>
      <span><span class="kal-dot" style="background:#ea580c"></span>Reparatur</span>
      <span><span class="kal-dot" style="background:#16a34a"></span>Reise</span>
      <span><span class="kal-dot" style="background:#0d9488"></span>Ort</span>
      <span><span class="kal-dot" style="background:#db2777"></span>Reservierung</span>
      <span><span class="kal-dot" style="background:#0891b2"></span>Termin</span>
      <span><span class="kal-dot" style="background:#7c3aed"></span>Wiederkehrend</span>
      <span><span class="kal-dot" style="background:#b45309"></span>Essen</span>
    </div>
    `+ kalenderKommendeHtml();
  document.getElementById("addbar").style.display="none";
  showFab(()=>openTermin(null));
};

window.kalMonat = delta => {
  if(!KAL_MONAT){ const h=new Date(); KAL_MONAT={jahr:h.getFullYear(),monat:h.getMonth()}; }
  let m=KAL_MONAT.monat+delta, j=KAL_MONAT.jahr;
  if(m<0){m=11;j--;} if(m>11){m=0;j++;}
  KAL_MONAT={jahr:j,monat:m}; RENDER.kalender();
};
window.kalTag = t => {
  // Akzeptiert eine Tageszahl (Monatsraster) oder ein ISO-Datum (Wochenliste)
  const datum = (typeof t === "string" && t.includes("-"))
    ? t
    : isoLokal(new Date(KAL_MONAT.jahr, KAL_MONAT.monat, t));
  const evs=kalenderEintraege(datum, datum).filter(e=>e.datum===datum);

    .toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});

    ? `<div class="list">${evs.map((e,i)=>{

            <button class="cbtn" style="flex:0 0 auto;padding:6px 11px;font-size:13px" onclick="event.stopPropagation();kalExport(${i})">📅 Export</button>
          </div></div>`;
      }).join("")}</div>`
    : `<div class="ml" style="margin:0 0 12px">Keine Einträge an diesem Tag.</div>`;
  openSheet(`<h3>${kopf}</h3>
    ${liste}
    <button class="btn" onclick="openTermin('${datum}')">+ Termin an diesem Tag</button>`);
};
// Einzelnen Kalendereintrag exportieren (Google Kalender oder .ics)

    <button class="btn ghost" onclick="downloadICS([{titel:'${esc(safe(titel))}',start:'${e.datum}',end:'${e.datum}',details:'${esc(safe(det))}'}],'${esc(fname)}');closeModal()">Als Kalenderdatei (.ics) speichern</button>

window.terminSerieUmschalten = () => {
  const wert = document.getElementById("t_serie").value;

  const geb  = document.getElementById("t_gebFeld");

window.saveTermin = () => {
  const titel=document.getElementById("t_titel").value.trim();
  const datum=document.getElementById("t_datum").value;
  if(!titel||!datum){ toast("Bitte Titel und Datum angeben."); return; }
  DB.termine = DB.termine || [];
  const frequenz = (document.getElementById("t_serie")||{}).value || "";
  const eintrag = {
    id:uid(), titel, datum,
    zeit:document.getElementById("t_zeit").value||"",
    notiz:document.getElementById("t_notiz").value.trim(),
    autor:ME, createdAt:now(), updatedAt:now()
  };
  if(frequenz){
    eintrag.serie = { frequenz, bis:(document.getElementById("t_bis")||{}).value || "" };
    eintrag.ausnahmen = [];
    const jahr = parseInt((document.getElementById("t_gebjahr")||{}).value, 10);
    if(frequenz === "jaehrlich" && jahr >= 1900 && jahr <= 2100) eintrag.geburtsjahr = jahr;
  }
  DB.termine.push(eintrag);
  save(); closeModal(); RENDER.kalender();
  toast(frequenz ? `Termin angelegt – wiederholt sich ${SERIE_LABEL[frequenz]}` : "Termin angelegt");

window.delTermin = (id, datum) => {
  const t=(DB.termine||[]).find(x=>x.id===id);
  if(!t) return;

  // Serientermin: Nachfrage, ob nur dieses Vorkommen oder die ganze Reihe entfällt
  if(t.serie && t.serie.frequenz && datum){
    openSheet(`<h3>Serientermin löschen</h3>
      <div class="ml">„${esc(t.titel)}" wiederholt sich ${esc(SERIE_LABEL[t.serie.frequenz]||"regelmäßig")}.
        Was soll gelöscht werden?</div>
      <button class="btn" onclick="delTerminVorkommen('${esc(id)}','${esc(datum)}')">
        Nur den Termin am ${esc(fmtDate(datum))}</button>
      <button class="btn danger" onclick="delTerminSerie('${esc(id)}')">
        Die gesamte Reihe</button>
      <button class="btn ghost" onclick="closeModal()">Abbrechen</button>`);
    return;
  }

  t.deleted=true; t.deletedAt=now(); t.updatedAt=now();
  save(); closeModal(); RENDER.kalender();
  toast(`Termin „${t.titel}" gelöscht`, { label:"Rückgängig", fn:()=>{
    const z=(DB.termine||[]).find(x=>x.id===id);
    if(z){ delete z.deleted; delete z.deletedAt; z.updatedAt=now(); save(); RENDER.kalender(); }
  }});
};

// Einzelnes Vorkommen einer Serie ausnehmen (die Reihe bleibt bestehen)
window.delTerminVorkommen = (id, datum) => {
  const t=(DB.termine||[]).find(x=>x.id===id);
  if(!t) return;
  t.ausnahmen = t.ausnahmen || [];
  if(!t.ausnahmen.includes(datum)) t.ausnahmen.push(datum);
  t.updatedAt=now(); save(); closeModal(); RENDER.kalender();
  toast(`Termin am ${fmtDate(datum)} entfällt`, { label:"Rückgängig", fn:()=>{
    const z=(DB.termine||[]).find(x=>x.id===id);
    if(z){ z.ausnahmen=(z.ausnahmen||[]).filter(a=>a!==datum); z.updatedAt=now();
           save(); RENDER.kalender(); }
  }});
};

// Ganze Reihe löschen
window.delTerminSerie = id => {
  const t=(DB.termine||[]).find(x=>x.id===id);
  if(!t) return;
  t.deleted=true; t.deletedAt=now(); t.updatedAt=now();
  save(); closeModal(); RENDER.kalender();
  toast(`Reihe „${t.titel}" gelöscht`, { label:"Rückgängig", fn:()=>{
    const z=(DB.termine||[]).find(x=>x.id===id);
    if(z){ delete z.deleted; delete z.deletedAt; z.updatedAt=now(); save(); RENDER.kalender(); }
  }});
};

function foodIcon(name){ for(const [re,ic] of FOOD_ICONS) if(re.test(name)) return ic; return "🛒"; }
// Welche Warengruppe? Gibt den Index zurück (für Sortierung), sonst hoch (ans Ende).
function warenGruppeIndex(name){
  // Sonderfall: alles mit "Dose/Konserve/in der ..." zuerst zu Konserven
  if(/dose|konserve|in der dose|eingelegt|passierte/i.test(name)){
    const ki=WARENGRUPPEN.findIndex(g=>g.key==="konserven"); if(ki>=0)return ki;
  }
  for(let i=0;i<WARENGRUPPEN.length;i++) if(WARENGRUPPEN[i].match.test(name)) return i;
  return WARENGRUPPEN.length;
}
function warenGruppeTitel(name){
  const i=warenGruppeIndex(name);
  return i<WARENGRUPPEN.length ? WARENGRUPPEN[i].titel : "Sonstiges";
}

// Listenname automatisch: "Ersteller · Datum"
function listenName(l){
  const d = new Date(l.createdAt);
  return `${l.ersteller||"?"} · ${d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}`;
}
// An mich abgeschickte, aktive (nicht archivierte) Listen
function listenFuerMich(){
  return DB.listen.filter(l=> !l.deleted && l.status==="abgeschickt" && !l.archiviert && (!l.empfaenger || !l.empfaenger.length || l.empfaenger.includes(ME)) && l.ersteller!==ME);
}
// Mein eigener, noch nicht abgeschickter Entwurf (max. einer aktiv)
function meinEntwurf(){
  return DB.listen.find(l=> !l.deleted && l.status==="entwurf" && !l.archiviert && l.ersteller===ME);
}
// Von mir selbst abgeschickte, aktive Listen (weiter sichtbar & nachbearbeitbar)
function meineAbgeschickten(){
  return DB.listen.filter(l=> !l.deleted && l.status==="abgeschickt" && !l.archiviert && l.ersteller===ME && !l.zusammengefuehrt);
}
// Listen, die ICH zusammengeführt habe (aktiv)
function meineMerges(){
  return DB.listen.filter(l=> !l.deleted && l.zusammengefuehrt && !l.archiviert && l.empfaenger && l.empfaenger.includes(ME));
}
// Archivierte Listen, die mich betreffen (Ersteller oder Empfänger)
function archivListen(){
  return DB.listen.filter(l=> !l.deleted && l.archiviert && (l.ersteller===ME || (l.empfaenger||[]).includes(ME)))
    .sort((a,b)=> new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt));
}

let EINKAUF_ARCHIV = false;
RENDER.einkauf = () => {
  const fuerMich = listenFuerMich();
  const entwurf = meinEntwurf();
  const vonMir = meineAbgeschickten();
  const merges = meineMerges();
  const archiv = archivListen();
  setHead("Einkaufslisten", "", null);

  if(EINKAUF_ARCHIV){
    let html = `<div class="seg" style="margin:0 16px 12px">
      <div class="opt" onclick="einkaufTab(false)">Aktuell</div>
      <div class="opt on" onclick="einkaufTab(true)">Archiv${archiv.length?" ("+archiv.length+")":""}</div></div>`;
    html += archiv.length
      ? archiv.map(l=>abgeschickteListeHtml(l, l.ersteller===ME, true)).join("")
      : empty("cart","Noch keine archivierten Listen");
    vBody().innerHTML = html;
    document.getElementById("addbar").style.display="none";
    return;
  }

  document.getElementById("vsub").textContent = fuerMich.length? fuerMich.length+" für dich" : (entwurf? "dein Entwurf" : "");
  let html = `<div class="seg" style="margin:0 16px 12px">
    <div class="opt on" onclick="einkaufTab(false)">Aktuell</div>
    <div class="opt" onclick="einkaufTab(true)">Archiv${archiv.length?" ("+archiv.length+")":""}</div></div>`;

  // 1) Zusammengeführte Listen (von mir erstellt) zuerst
  merges.forEach(l=>{ html += abgeschickteListeHtml(l, false); });

  // 2) An mich abgeschickte Listen – mit Inhalt
  if(fuerMich.length){
    html += `<div class="section-label">Für dich abgeschickt</div>`;
    fuerMich.forEach(l=>{ html += abgeschickteListeHtml(l); });
  }
  // Zusammenfügen anbieten, sobald ich mind. 2 Listen habe (empfangen + zusammengeführt zählen)
  const zusammenfuegbar = fuerMich.length + merges.length;
  if(zusammenfuegbar>1){
    html += `<div style="padding:6px 16px 4px"><button class="btn ghost" onclick="mergeDialog()">${ICON.cart} Mehrere Listen zu einer zusammenfügen</button></div>`;
  }

  // 3) Mein Entwurf (falls vorhanden) – mit Schnellauswahl
  if(entwurf){
    html += `<div class="section-label" style="display:flex;justify-content:space-between;align-items:center">Dein Entwurf
      <span style="text-transform:none;font-weight:600;color:var(--danger)" onclick="delListe('${entwurf.id}')">Verwerfen</span></div>`;
    html += entwurfHtml(entwurf);
    html += schnellauswahlHtml();
  } else {
    // 4) Kein Entwurf -> zwei Knöpfe: abschicken-Liste / nur für mich
    html += `<div style="padding:10px 16px;display:flex;gap:8px;flex-direction:column">
      <button class="btn" onclick="neuerEntwurf()">+ Neue Einkaufsliste beginnen</button></div>`;
    if(!fuerMich.length && !merges.length){
      html += schnellauswahlHtml(true);
    }
  }

  // 5) Von mir abgeschickte Listen
  if(vonMir.length){
    html += `<div class="section-label">Von dir abgeschickt</div>`;
    vonMir.forEach(l=>{ html += abgeschickteListeHtml(l, true); });
  }

  vBody().innerHTML = html;
  if(entwurf){ AKT_LISTE=entwurf.id; showAddBar("Eigener Artikel…", t=>addEin(t)); }
  else document.getElementById("addbar").style.display="none";
};
window.einkaufTab = a => { EINKAUF_ARCHIV=a; RENDER.einkauf(); };

// Farbe je Absender (für zusammengeführte Listen)
function autorFarbe(name){
  const farben = ["#1d4ed8","#16a34a","#db2777","#ea580c","#7c3aed","#0891b2"];
  let h=0; for(let i=0;i<(name||"").length;i++) h=(h*31+name.charCodeAt(i))%farben.length;
  return farben[h];
}

// HTML einer abgeschickten/zusammengeführten Liste. istEigene -> Ersteller-Sicht. imArchiv -> nur Lesen+Löschen
function abgeschickteListeHtml(l, istEigene, imArchiv){
  const offen = aktiv(l.artikel).filter(a=>!a.d).sort((a,b)=>warenGruppeIndex(a.tx)-warenGruppeIndex(b.tx));
  const erledigt = aktiv(l.artikel).filter(a=>a.d);
  const editing = (window._editListe===l.id);
  // Listen sind standardmäßig eingeklappt. Nur manuell geöffnete oder gerade
  // bearbeitete Listen werden aufgeklappt – das hält die Übersicht sauber,
  // sobald Artikel abgehakt werden.
  const aufgeklappt = (window._openListe===l.id) || editing;
  // Kopfzeile
  let kopfInfo;
  if(l.zusammengefuehrt) kopfInfo = `zusammengeführt · ${offen.length} offen`;
  else if(istEigene) kopfInfo = `an ${esc((l.empfaenger||[]).join(", ")||"—")} · ${offen.length} offen`;
  else kopfInfo = `von ${esc(l.ersteller)} · ${offen.length} offen`;
  const titel = l.zusammengefuehrt ? "Zusammengeführte Liste" : listenName(l);

  const rows = [...offen,...erledigt].map(a=>einRowRO(l.id,a,editing,l)).join("");
  const head = `<div style="padding:13px 15px;display:flex;align-items:center;gap:10px;background:var(--accent-soft);cursor:pointer" onclick="toggleListe('${l.id}')">
      <div style="font-size:13px;color:var(--ink2);transform:rotate(${aufgeklappt?'90':'0'}deg);transition:.15s">▶</div>
      <div style="flex:1"><div style="font-weight:700">${esc(titel)}</div>
        <div style="font-size:12px;color:var(--ink2)">${kopfInfo}</div></div>
      ${!imArchiv?`<button class="cbtn" style="flex:0 0 auto;padding:7px 12px" onclick="event.stopPropagation();${editing?`stopEdit()`:`startEdit('${l.id}')`}">${editing?"Fertig":"Bearbeiten"}</button>`:""}
    </div>`;
  if(!aufgeklappt) return `<div class="card" style="margin:0 16px 10px;padding:0;overflow:hidden">${head}</div>`;

  return `<div class="card" style="margin:0 16px 10px;padding:0;overflow:hidden">${head}
    <div class="list" style="padding:10px 15px 14px">${rows||'<div style="color:var(--ink2);font-size:13px">leer</div>'}</div>
    ${editing?`<div style="padding:0 15px 8px"><input id="ed_add_${l.id}" placeholder="Artikel ergänzen…" style="width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px" onkeydown="if(event.key==='Enter'){addEinTo('${l.id}',this.value);this.value=''}">
      ${istEigene&&l.empfaenger&&l.empfaenger.length?`<div class="ml" style="margin-top:8px">Ergänzungen erscheinen automatisch bei ${esc(l.empfaenger.join(", "))}.</div>`:""}</div>
      ${schnellauswahlHtml(false, l.id)}`:""}
    ${!imArchiv && !editing ? `<div style="padding:0 15px 14px;display:flex;gap:8px">
      ${istEigene?`<button class="cbtn" style="flex:1" onclick="delListe('${l.id}')">Zurückziehen</button>`:`<button class="cbtn" style="flex:1" onclick="archiviereListe('${l.id}')">Ins Archiv</button>`}
      <button class="cbtn" style="flex:1;color:var(--danger);border-color:var(--danger)" onclick="delListe('${l.id}')">Löschen</button></div>`:""}
    ${imArchiv?`<div style="padding:0 15px 14px"><button class="cbtn" style="width:100%;color:var(--danger);border-color:var(--danger)" onclick="delListe('${l.id}')">Endgültig löschen</button></div>`:""}
  </div>`;
}
window.toggleListe = id => { window._openListe = (window._openListe===id? null : id); RENDER.einkauf(); };
window.archiviereListe = id => { const l=DB.listen.find(x=>x.id===id); if(l){ l.archiviert=true; l.updatedAt=now(); save(); RENDER.einkauf(); } };

// Zeile in abgeschickter Liste: abhaken; bei "alles abgehakt" -> Archiv
function einRowRO(lid,a,editing,l){
  const fremd = a.von && a.von!==ME;
  const farbe = (l && l.zusammengefuehrt && a.von) ? autorFarbe(a.von) : null;
  const herkunft = (l && l.zusammengefuehrt && a.von) ? `<small style="color:${farbe};font-weight:600">${esc(a.von)}</small>` : "";
  return `<div class="row wischbar ${a.d?'done':''}" data-artikel="${esc(a.id)}" data-liste="${esc(lid)}"
      style="margin-bottom:6px${farbe?`;border-left:3px solid ${farbe};padding-left:8px`:''}">
    <div class="wisch-hint rechts" aria-hidden="true">${a.d?'Offen':'Erledigt'}</div>
    <button type="button" class="cb ${a.d?'on':''}" onclick="toggleEinIn('${lid}','${a.id}')"
      role="checkbox" aria-checked="${a.d?'true':'false'}"
      aria-label="${esc(a.tx)} ${a.d?'als offen markieren':'abhaken'}">${a.d?'✓':''}</button>
    <div class="tx"><span style="margin-right:7px">${foodIcon(a.tx)}</span>${esc(zutatAnzeige(a.tx))}${zutatZusatz(a.tx)}${a.menge?` <span style="color:var(--ink2)">(${esc(a.menge)})</span>`:""} ${herkunft}</div>
    ${editing?`<div class="del" onclick="delEinIn('${lid}','${a.id}')">×</div>`:""}</div>`;
}

// HTML meines Entwurfs (voll bearbeitbar)
function entwurfHtml(l){
  const offen = aktiv(l.artikel).filter(a=>!a.d).sort((a,b)=>warenGruppeIndex(a.tx)-warenGruppeIndex(b.tx));
  const erledigt = aktiv(l.artikel).filter(a=>a.d);
  AKT_LISTE = l.id;
  return `<div class="list">${offen.map(einRow).join("")}${erledigt.map(einRow).join("")}</div>
    <div style="padding:14px 16px 4px;display:flex;gap:8px">
      <button class="btn" style="flex:1" onclick="abschickenDialog('${l.id}')">✓ Abschicken</button>
      <button class="cbtn" style="flex:0 0 auto;padding:0 16px" onclick="behalteListe('${l.id}')">Nur für mich</button></div>`;
}
// Liste behalten (nicht abschicken) -> als eigene "abgeschickte" Liste an mich selbst
window.behalteListe = id => {
  const l=DB.listen.find(x=>x.id===id); if(!l||!aktiv(l.artikel).length){ toast("Die Liste ist leer."); return; }
  l.status="abgeschickt"; l.empfaenger=[ME]; l.abgeschicktAm=now(); l.nurFuerMich=true; l.updatedAt=now();
  save(); RENDER.einkauf();
};

// Schnellauswahl-HTML. zielListe = ID, in die hinzugefügt wird (sonst aktiver Entwurf)
function schnellauswahlHtml(hinweisOnly, zielListe){
  const grouped = {};
  DB.einkaufStamm.forEach(s=>{ const t=warenGruppeTitel(s); (grouped[t]=grouped[t]||[]).push(s); });
  const ordered = [...WARENGRUPPEN.map(g=>g.titel), "Sonstiges"].filter(t=>grouped[t]);
  const clickFn = s => hinweisOnly ? `neuerEntwurf('${esc(s)}')` : (zielListe ? `addEinTo('${zielListe}','${esc(s)}')` : `addEin('${esc(s)}',this)`);
  const inner = ordered.map(t=>`
    <div class="wg-titel">${warengruppeAnzeige(t)}</div>
    <div class="chips">${grouped[t].map(s=>`<div class="chip" onclick="${clickFn(s)}"><span style="margin-right:5px">${foodIcon(s)}</span>${esc(zutatAnzeige(s))}</div>`).join("")}</div>`).join("");
  return `<div class="section-label" style="display:flex;justify-content:space-between;align-items:center">${SPRACHE==="nl"?"Snelkeuze":"Schnellauswahl"}
      <span style="text-transform:none;font-weight:600;color:var(--accent)" onclick="editStamm()">Bearbeiten</span></div>${inner}`;
}

// Neuen Entwurf beginnen (optional gleich mit erstem Artikel)
window.neuerEntwurf = (ersterArtikel) => {
  let l = meinEntwurf();
  if(!l){ l={id:uid(), status:"entwurf", ersteller:ME, empfaenger:[], artikel:[], createdAt:now(), updatedAt:now()}; DB.listen.push(l); }
  if(ersterArtikel){ l.artikel.push({id:uid(),tx:ersterArtikel,menge:"",d:false,von:ME,createdAt:now(),updatedAt:now()}); }
  AKT_LISTE=l.id; l.updatedAt=now(); save(); RENDER.einkauf();
};

// Artikelzeile: echte Bedienelemente (tastaturbedienbar, für Screenreader
// erkennbar) und wischbar. data-artikel dient dem Wischen und der punktuellen
// Aktualisierung ohne vollständiges Neuzeichnen.

// Artikel zählen -> ab 5x automatisch in die Schnellauswahl
function zaehleArtikel(tx){
  const key = tx.toLowerCase().trim();
  DB.artikelZaehler = DB.artikelZaehler||{};
  DB.artikelZaehler[key] = (DB.artikelZaehler[key]||0)+1;
  if(DB.artikelZaehler[key]>=5 && !DB.einkaufStamm.some(s=>s.toLowerCase()===key)){
    // Originalschreibweise verwenden (erstes Vorkommen)
    DB.einkaufStamm.push(tx.trim());
    notify(`„${tx.trim()}" wurde zur Schnellauswahl hinzugefügt (oft gekauft)`, {ziel:ME});
  }
}

// ============================================================
//  Geo-Hilfen: Adresse -> Koordinaten, Routing (kostenlos)
// ============================================================
// Google-Teilen-Links auflösen wir nicht serverseitig (CORS),
// aber wir extrahieren Koordinaten, falls im Link enthalten,
// sonst wird der Klartext an Nominatim geschickt.
function parseGeo(input){
  const s = (input||"").trim();
  // @lat,lng  oder  /lat,lng  in Google-Links
  let m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || s.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/)
       || s.match(/(-?\d+\.\d{3,}),\s*(-?\d+\.\d{3,})/);
  if(m) return { lat:parseFloat(m[1]), lon:parseFloat(m[2]), label:null, raw:s };
  return { lat:null, lon:null, label:s, raw:s };
}
// ============================================================
//  Externe Dienste: Zeitlimit, Zwischenspeicher, Drosselung
// ============================================================
// Nominatim und OSRM sind kostenlose Gemeinschaftsdienste. Ohne Zeitlimit haengt
// die Oberflaeche bei ausbleibender Antwort; ohne Drosselung verletzt eine Reise
// mit acht Etappen die Nutzungsregeln (max. 1 Anfrage/Sekunde bei Nominatim).
async function holeMitZeitlimit(url, optionen, ms){
  ms = ms || 9000;
  const ac = new AbortController();
  const t  = setTimeout(()=>ac.abort(), ms);
  try{
    return await fetch(url, Object.assign({}, optionen||{}, { signal: ac.signal }));
  }catch(e){
    if(e && e.name === "AbortError") throw new Error("Zeitüberschreitung – der Dienst antwortet nicht.");
    throw e;
  }finally{ clearTimeout(t); }
}
// Dauerhafter Zwischenspeicher: Koordinaten einer Adresse aendern sich nicht.
const _geoCache = (()=>{
  try{ return new Map(Object.entries(JSON.parse(localStorage.getItem("familienapp.geoCache")||"{}"))); }
  catch(e){ return new Map(); }
})();
function geoCacheSchreiben(){
  try{
    // auf die 300 juengsten Eintraege begrenzen
    const eintraege = [..._geoCache.entries()].slice(-300);
    localStorage.setItem("familienapp.geoCache", JSON.stringify(Object.fromEntries(eintraege)));
  }catch(e){}
}
let _letzteGeoAnfrage = 0;

async function geocode(text){
  // bereits Koordinaten?
  const g = parseGeo(text);
  if(g.lat!=null) return { lat:g.lat, lon:g.lon, name:text };
  const schluessel = String(g.label||"").trim().toLowerCase();
  if(_geoCache.has(schluessel)) return _geoCache.get(schluessel);
  // Drosselung: mindestens 1,1 s Abstand zwischen zwei Nominatim-Anfragen
  const wartezeit = Math.max(0, 1100 - (Date.now() - _letzteGeoAnfrage));
  if(wartezeit) await new Promise(r=>setTimeout(r, wartezeit));
  _letzteGeoAnfrage = Date.now();
  // Nominatim (OpenStreetMap) – kostenlos. Sprache als URL-Parameter,
  // KEIN Custom-Header (würde CORS-Preflight auslösen und scheitern).
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=de&q="+encodeURIComponent(g.label);
  const r = await holeMitZeitlimit(url);
  if(!r.ok) throw new Error("Geocoding fehlgeschlagen");
  const j = await r.json();
  if(!j.length) throw new Error("Adresse nicht gefunden");
  const treffer = { lat:parseFloat(j[0].lat), lon:parseFloat(j[0].lon), name:j[0].display_name.split(",")[0] };
  _geoCache.set(schluessel, treffer); geoCacheSchreiben();
  return treffer;
}
// Routing zwischen zwei Punkten. Standard: OSRM (kostenlos, PKW).
// Optional: OpenRouteService mit Schlüssel -> Wohnmobil-Profil (hgv).
const _routeCache = new Map();
async function routeBetween(a, b){
  const rk = [a.lat,a.lon,b.lat,b.lon].map(v=>Number(v).toFixed(4)).join("|");
  if(_routeCache.has(rk)) return _routeCache.get(rk);
  const orsKey = localStorage.getItem("familienapp.orsKey");
  if(orsKey){
    try{
      const url = "https://api.openrouteservice.org/v2/directions/driving-hgv";
      const r = await holeMitZeitlimit(url, { method:"POST",
        headers:{ "Authorization":orsKey, "Content-Type":"application/json" },
        body: JSON.stringify({ coordinates:[[a.lon,a.lat],[b.lon,b.lat]] }) });
      if(r.ok){ const j=await r.json(); const sum=j.routes[0].summary;
        const erg = { km: sum.distance/1000, min: sum.duration/60, profil:"Wohnmobil" };
        _routeCache.set(rk, erg); return erg; }
    }catch(e){ Fehlerlog.erfasse("routeBetween/ORS", e); /* auf OSRM zurueckfallen */ }
  }
  // OSRM-Demo (PKW)
  const url = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;
  const r = await holeMitZeitlimit(url);
  if(!r.ok) throw new Error("Route fehlgeschlagen");
  const j = await r.json();
  if(!j.routes || !j.routes.length) throw new Error("keine Route");
  const erg = { km: j.routes[0].distance/1000, min: j.routes[0].duration/60, profil:"PKW" };
  _routeCache.set(rk, erg);
  return erg;
}
function fmtDauer(min){ const h=Math.floor(min/60), m=Math.round(min%60); return h?`${h} h ${m} min`:`${m} min`; }

// ---- Reisebudget: Kosten-Eingaben parsen, formatieren und summieren ----
// Akzeptiert deutsches Komma ("12,50"), liefert Zahl oder null.
function parseKosten(v){
  if(v==null || String(v).trim()==="") return null;
  const f = parseFloat(String(v).replace(",",".").replace(/[^0-9.\-]/g,""));
  return isNaN(f) ? null : Math.round(f*100)/100;
}
function fmtEuro(n){
  if(n==null || isNaN(n)) return "";
  return n.toLocaleString("de-DE",{minimumFractionDigits: (n%1)?2:0, maximumFractionDigits:2})+" €";
}
// Gesamtbudget einer Reise: Tagesplan-Kosten + Unterkunftskosten (Stellplätze/Hotels)
function reiseBudget(r){
  const proStadt=[];
  let gesamt=0;
  aktiv(r.staedte).forEach(c=>{
    let uebernachtung=0;
    (c.stellplaetze||[]).forEach(p=>{ if(!p.deleted && p.kosten!=null) uebernachtung+=p.kosten; });
    const tage=[];
    Object.keys(c.tagesplan||{}).sort().forEach(d=>{
      let s=0;
      (c.tagesplan[d]||[]).forEach(e=>{ if(!e.deleted && e.kosten!=null) s+=e.kosten; });
      if(s>0) tage.push({datum:d, summe:s});
    });
    const summe = uebernachtung + tage.reduce((a,t)=>a+t.summe,0);
    if(summe>0) proStadt.push({name:c.name, uebernachtung, tage, summe});
    gesamt += summe;
  });
  return { gesamt: Math.round(gesamt*100)/100, proStadt };
}

// ============================================================
//  Urlaubsplanung
// ============================================================
let URLAUB_ARCHIV = false;
RENDER.urlaub = () => {
  // Eine Reise ist "vergangen", wenn ihr Bis-Datum (sonst Von) vor heute liegt
  const istVergangen = u => {
    const ref = u.bis || u.von; if(!ref) return false;
    return daysUntil(ref) < 0;
  };
  const aktiv = DB.urlaub.filter(u=>!istVergangen(u)&&!u.deleted);
  const archiv = DB.urlaub.filter(u=>istVergangen(u)&&!u.deleted);
  const liste = (URLAUB_ARCHIV ? archiv : aktiv).sort((a,b)=>{
    if(!a.von)return 1; if(!b.von)return -1;
    return URLAUB_ARCHIV ? new Date(b.von)-new Date(a.von) : new Date(a.von)-new Date(b.von);
  });
  setHead("Urlaubsplanung", (URLAUB_ARCHIV?archiv.length+" archiviert":aktiv.length+" geplant"), {label:"⚙︎", fn:routingSettings});
  let html = `<div class="seg" style="margin:0 16px 12px">
    <div class="opt ${!URLAUB_ARCHIV?'on':''}" onclick="urlaubTab(false)">Geplant${aktiv.length?" ("+aktiv.length+")":""}</div>
    <div class="opt ${URLAUB_ARCHIV?'on':''}" onclick="urlaubTab(true)">Archiv${archiv.length?" ("+archiv.length+")":""}</div></div>`;
  html += liste.length
    ? `<div class="list">${liste.map(reiseKarte).join("")}</div>`
    : empty("plane", URLAUB_ARCHIV?"Noch keine vergangenen Reisen":"Noch keine Reise geplant");
  vBody().innerHTML = html;
  if(!URLAUB_ARCHIV) showFab(()=>openReise(null)); else document.getElementById("fab").style.display="none";
};

function renderReiseDetail(r){

  const sichtbareStaedte = r.staedte.map((c,i)=>({c,i})).filter(x=>!x.c.deleted);
  if(!sichtbareStaedte.length){
    html += empty("pin","Noch keine Stadt — unten mit + hinzufügen");
  } else {
    html += `<div class="list" id="cityList">`;
    sichtbareStaedte.forEach((x,pos)=>{
      html += renderCity(r,x.c,x.i,pos);
      if(pos < sichtbareStaedte.length-1) html += renderLeg(r,x.i,sichtbareStaedte[pos+1].i);
    });
    html += `</div>`;
  }
  body.innerHTML = html;
  if(r.art==="tour") enableCityDrag(r);
  // Entfernungen POIs -> Stellplatz im Hintergrund berechnen
  r.staedte.forEach((c,i)=>{
    if(c.deleted) return;
    const basis=aktiv(c.stellplaetze).find(s=>s.lat!=null);
    const ziele=tagesEintraege(c).filter(p=>p.lat!=null);
    if(basis && ziele.length){
      c._poiDist=c._poiDist||{};
      const offen = ziele.some(p=>{ const k=basis.lat+","+basis.lon+">"+p.lat+","+p.lon; return !c._poiDist[k]||c._poiDist[k]==="err"; });

    }
  });
}

// Liste: Entfernung jeder Sehenswürdigkeit/Restaurant zum (ersten) Stellplatz der Stadt
function poiDistanzen(r,c,i){
  const basis = (c.stellplaetze||[]).find(s=>s.lat!=null);
  const ziele = tagesEintraege(c).filter(p=>p.lat!=null);
  if(!basis || !ziele.length) return "";
  c._poiDist = c._poiDist || {};
  const rows = ziele.map(p=>{
    const key = basis.lat+","+basis.lon+">"+p.lat+","+p.lon;
    const d = c._poiDist[key];
    let txt;
    if(d==="err") txt = `<span style="color:var(--accent)">erneut ›</span>`;
    else if(d) txt = `${ICON.car} ${d.km.toFixed(0)} km · ${fmtDauer(d.min)}`;
    else txt = `<span style="color:var(--ink2)">berechne…</span>`;
    return `<div class="pdist-row"><span class="pdist-n">${esc(p.name)}</span><span class="pdist-v">${txt}</span></div>`;
  }).join("");
  return `<div class="pdist"><div class="pdist-h">Entfernung ab ${esc(basis.name)}</div>${rows}</div>`;
}
// Distanzen aller POIs einer Stadt zum Stellplatz nacheinander berechnen
window.calcPoiDist = async (rid,ci) => {
  const r=DB.urlaub.find(x=>x.id===rid); if(!r)return;
  const c=r.staedte[ci]; if(!c)return;
  const basis=(c.stellplaetze||[]).find(s=>s.lat!=null); if(!basis)return;
  const ziele=tagesEintraege(c).filter(p=>p.lat!=null);
  c._poiDist=c._poiDist||{};
  for(const p of ziele){
    const key=basis.lat+","+basis.lon+">"+p.lat+","+p.lon;
    if(c._poiDist[key] && c._poiDist[key]!=="err") continue;
    try{ c._poiDist[key]=await routeBetween(basis,p); }
    catch(e){ c._poiDist[key]="err"; }
    if(CURRENT==="urlaub" && DETAIL_OPEN===rid) renderReiseDetail(r);
  }
};

      const adrFehlt = !p.adresse && !cleanLink(p.link) && p.lat==null;
      const resTxt = p.resDatum ? `🍽️ Reservierung: ${fmtDate(p.resDatum)}${p.resZeit?" · "+p.resZeit+" Uhr":""}` : "";
      const resToggle = reservierbar ? `<span class="res-toggle">

      return `<div class="poi ${fremd?'poi-fremd':''}">
      ${p.foto?`<img class="poi-foto" src="${p.foto}" onclick="zoomFoto('${rid}',${ci},'${key}',${pi})">`:""}
      <div class="pn">${esc(p.name)}${warnAdresse(adrFehlt, "Adresse fehlt – bitte ergänzen")}${p.adresse?`<small>${esc(p.adresse)}</small>`:""}
      ${p.hinweis?`<small class="poi-hint">📌 ${esc(p.hinweis)}</small>`:""}
      ${resTxt?`<small style="display:block;color:var(--accent);font-weight:600;margin-top:2px">${resTxt}</small>`:""}
      ${p.kosten!=null?`<small style="display:block;font-weight:600;margin-top:2px">💶 ${fmtEuro(p.kosten)}</small>`:""}
      ${resToggle}

      ${tgt?`<a class="maplink" href="${esc(tgt)}" target="_blank" rel="noopener">${ICON.pin} ${cleanLink(p.link)?"Link öffnen":"Karte"}</a>`:""}
      <a class="maplink" onclick="editPoi('${rid}',${ci},'${key}',${pi})" style="cursor:pointer">✎ Bearbeiten</a>
      ${(key==="restaurants")?`<a class="maplink" onclick="reservierungBearbeiten('${rid}',${ci},${pi})" style="cursor:pointer">📅 ${p.resDatum?"Reservierung ändern":"Reservierung"}</a>`:""}
      ${(key==="restaurants"&&p.resDatum)?`<a class="maplink" onclick="reservierungZuKalender('${rid}',${ci},${pi})" style="cursor:pointer">In Kalender</a>`:""}
      </span>
      ${p.autor?`<small class="poi-autor">${fremd?'von '+esc(p.autor):'von dir'}</small>`:""}</div>
      <div class="pdel" onclick="delPoi('${rid}',${ci},'${key}',${pi})">×</div></div>`;}).join("")
      : `<div style="color:var(--ink2);font-size:12.5px">—</div>`}</div>`;
}

// ---- Detaillierte Tagesplanung pro Aufenthaltstag ----
// Typen der Tagesplanung
const TAGES_TYPEN = [
  {key:"sehen",     label:"Sehenswürdigkeit", ic:"🏛️"},
  {key:"restaurant",label:"Restaurant",       ic:"🍽️"},
  {key:"wanderung", label:"Wanderung",        ic:"🥾"},
  {key:"aktivitaet",label:"Aktivität",        ic:"🎯"}
];
function tagTypInfo(t){ return TAGES_TYPEN.find(x=>x.key===t) || {label:t, ic:"•"}; }
// Alle Tagesplan-Einträge einer Stadt (über alle Tage) flach einsammeln
function tagesEintraege(c){
  const tp=c.tagesplan||{}; const out=[];
  Object.keys(tp).forEach(d=>(tp[d]||[]).forEach(e=>{ if(!e.deleted) out.push(Object.assign({_datum:d},e)); }));
  return out;
}
function renderTagesplan(r,c,i){
  c.tagesplan = c.tagesplan || {};
  const tage = datumsListe(c.von, c.bis);
  // Ohne Aufenthaltsdatum: Hinweis, Planung erst nach Datumseingabe
  if(!tage.length){
    return `<div class="tagesplan"><div class="tagesplan-h">Tagesplanung</div>
      <div style="color:var(--ink2);font-size:12.5px">Trage oben unter „Bearbeiten“ das Aufenthaltsdatum (von – bis) ein, dann erscheint hier für jeden Tag eine eigene Planung.</div></div>`;
  }
  let html = `<div class="tagesplan"><div class="tagesplan-h">Tagesplanung</div>`;
  tage.forEach((d,di)=>{
    const eintraege = c.tagesplan[d] || [];
    const wt = new Date(d+"T00:00:00").toLocaleDateString("de-DE",{weekday:"long"});
    const tagSumme = eintraege.reduce((s,e)=>s+((!e.deleted&&e.kosten!=null)?e.kosten:0),0);
    html += `<div class="tag-card">
      <div class="tag-titel">📅 Tag ${di+1} · ${wt}, ${fmtDate(d)}${tagSumme>0?` <span style="margin-left:auto;color:var(--accent)">${fmtEuro(tagSumme)}</span>`:""}</div>`;
    const sichtbar = eintraege.filter(e=>!e.deleted);
    if(sichtbar.length){
      eintraege.forEach((e,ei)=>{
        if(e.deleted) return;
        const info=tagTypInfo(e.typ);
        const tgt=openTarget(e);
        const adrFehlt = !e.adresse && !cleanLink(e.link) && e.lat==null;
        html += `<div class="tag-zeile" style="--kat:var(--kat-${esc(e.typ)},var(--accent));--kat-soft:var(--kat-${esc(e.typ)}-soft,var(--accent-soft))">
          <span class="tz-ic">${info.ic}</span>
          <span class="tz-tx">${esc(e.name)}${warnAdresse(adrFehlt,"Adresse fehlt – bitte ergänzen")}
            ${e.adresse?`<small>${esc(e.adresse)}</small>`:""}
            ${e.hinweis?`<small>📌 ${esc(e.hinweis)}</small>`:""}
            ${e.resDatum?`<small style="color:var(--accent);font-weight:600">🍽️ Reservierung: ${fmtDate(e.resDatum)}${e.resZeit?" · "+e.resZeit+" Uhr":""}</small>`:""}
            ${e.kosten!=null?`<small style="font-weight:600">💶 ${fmtEuro(e.kosten)}</small>`:""}
            <span style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:2px">
            <span style="font-size:11px;color:var(--ink2);font-weight:600">${info.label}</span>
            ${tgt?`<a class="maplink" href="${esc(tgt)}" target="_blank" rel="noopener">${ICON.pin} ${cleanLink(e.link)?"Link":"Karte"}</a>`:""}
            <a class="maplink" onclick="editTagEintrag('${r.id}',${i},'${d}',${ei})" style="cursor:pointer">✎ Bearbeiten</a>
            ${(e.typ==="restaurant")?`<a class="maplink" onclick="setTagRes('${r.id}',${i},'${d}',${ei},'ja')" style="cursor:pointer;color:${e.resStatus==="ja"?"#16a34a":"var(--ink2)"}">✓ Reserviert</a>
            <a class="maplink" onclick="setTagRes('${r.id}',${i},'${d}',${ei},'nein')" style="cursor:pointer;color:${e.resStatus==="nein"?"#dc2626":"var(--ink2)"}">✕ Nicht möglich</a>`:""}
            </span>
          </span>
          <span class="tz-del" onclick="delTagEintrag('${r.id}',${i},'${d}',${ei})">×</span>
        </div>`;
      });
    } else {
      html += `<div style="color:var(--ink2);font-size:12px;padding:2px 0">Noch nichts geplant.</div>`;
    }
    html += `<div class="tag-add">
      ${TAGES_TYPEN.map(t=>`<button style="--kat:var(--kat-${t.key},var(--accent))" onclick="addTagEintrag('${r.id}',${i},'${d}','${t.key}')">+ ${t.ic} ${t.label}</button>`).join("")}
    </div>`;
    // Am letzten Tag der Station: Abreisezeit erfassen (z.B. Platz raeumen bis 11 Uhr)
    if(di === tage.length-1){
      html += `<div class="tag-abreise" onclick="setAbreise('${r.id}',${i})">🚐 ${c.abreiseZeit
        ? `Abreise bis ${esc(c.abreiseZeit)} Uhr${c.abreiseHinweis?` <small>· ${esc(c.abreiseHinweis)}</small>`:""}`
        : `Abreise bis … <small>Uhrzeit eintragen</small>`}</div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

// Prueft die Datumskette zweier aufeinanderfolgender Stationen.
// Konvention: Der Abreisetag einer Station ist der Anreisetag der naechsten.
//   b.von > a.bis  -> Luecke, die Naechte dazwischen sind nicht verplant
//   b.von < a.bis  -> Ueberschneidung, beide Stationen belegen dieselben Tage
// Ohne Datum auf einer der beiden Seiten wird nicht geprueft.
function datumsLuecke(a,b){
  if(!a || !b) return null;
  const ende = a.bis || a.von;
  const start = b.von;
  if(!ende || !start) return null;
  const tage = Math.round(
    (new Date(start+"T00:00:00") - new Date(ende+"T00:00:00")) / 86400000
  );
  if(tage === 0) return null;
  return tage > 0
    ? { art:"luecke", naechte:tage, von:ende, bis:start }
    : { art:"ueberschneidung", tage:-tage };
}
function renderLeg(r,i,j){
  if(j==null) j=i+1;                       // Fallback: direkter Nachbar
  const a=r.staedte[i], b=r.staedte[j];
  if(!a||!b) return "";
  r._legs = r._legs||{};
  // Nur nicht geloeschte Zwischenstopps, Originalindex fuer Aktionen mitfuehren
  const stops = (a.stopps||[]).map((s,si)=>({s,si})).filter(x=>!x.s.deleted);
  const key = a.lat+","+a.lon+">"+b.lat+","+b.lon;
  const cached = r._legs[key];
  let info;
  if(a.lat==null||b.lat==null) info = `<span class="linfo">Etappe nicht berechenbar – Koordinaten fehlen</span>`;
  else if(cached==="err") info = `<span class="linfo" id="leg_${i}" onclick="calcLeg('${r.id}',${i},${j})" style="cursor:pointer;color:var(--accent)">Berechnung fehlgeschlagen – erneut ›</span>`;
  else if(cached) info = `<span class="linfo">${ICON.car} ${cached.km.toFixed(0)} km · ${fmtDauer(cached.min)} <small>(${cached.profil})</small></span>`;
  else info = `<span class="linfo" id="leg_${i}" style="color:var(--ink2)">berechne…</span>`;
  // Google-Maps-Routenlink (führt optional über die Zwischenstopps)
  const routeHref = mapsRouteLink(a, b, stops.map(x=>x.s));
  const stopsHtml = stops.length ? `<div class="stops">${stops.map(({s,si})=>{
    const tgt = openTarget(s) || (s.lat!=null?mapsLink(s.lat+","+s.lon):(s.name?mapsLink(s.name):""));
    const meta = [s.entfernung, s.dauer].filter(Boolean).join(" · ");
    return `<div class="stop"><span class="si">${ICON.pin}</span>
      <div class="sn">${esc(s.name)}${warnAdresse(s.lat==null && !cleanLink(s.link), "Adresse fehlt")}
        ${meta?`<small>${ICON.car?"":""}${esc(meta)}</small>`:""}
        ${s.hinweis?`<small>📌 ${esc(s.hinweis)}</small>`:""}
        ${tgt?`<a class="smap" href="${esc(tgt)}" target="_blank" rel="noopener">Karte öffnen</a>`:""}
        <a class="sconv" onclick="stopZuStation('${r.id}',${i},${si},${j})">Zur Station machen</a></div>
      <span class="sdel" onclick="delStop('${r.id}',${i},${si})">×</span></div>`;
  }).join("")}</div>` : "";
  const luecke = datumsLuecke(a,b);
  const warnHtml = luecke ? `<div class="legwarn"><span class="lw-ic">⚠︎</span><span>${
    luecke.art==="luecke"
      ? `${luecke.naechte} ${luecke.naechte===1?"Nacht ist":"Nächte sind"} nicht verplant: ${fmtDate(luecke.von)} – ${fmtDate(luecke.bis)}`
      : `Überschneidung: „${esc(b.name)}“ beginnt ${luecke.tage} ${luecke.tage===1?"Tag":"Tage"} vor der Abreise aus „${esc(a.name)}“`
  }</span></div>` : "";
  return `<div class="leg">
    <div class="legrow"><div class="lline"></div>${info}<div class="lline"></div></div>
    ${warnHtml}
    ${stopsHtml}
    <div class="legacts">
      <a href="${esc(routeHref)}" target="_blank" rel="noopener">🗺️ Route in Google Maps</a>
      <a onclick="insertCity('${r.id}',${j})">+ Station</a>
      <a class="muted" onclick="addStop('${r.id}',${i})">+ Zwischenstopp</a>
    </div>
  </div>`;
}
// Alle noch nicht berechneten Etappen automatisch nacheinander rechnen
window.autoCalcLegs = async rid => {
  const r=DB.urlaub.find(x=>x.id===rid); if(!r||!r.staedte)return;
  const sichtbar = r.staedte.filter(c=>!c.deleted);
  for(let i=0;i<sichtbar.length-1;i++){
    const a=sichtbar[i], b=sichtbar[i+1];
    if(a.lat==null||b.lat==null) continue;
    const key=a.lat+","+a.lon+">"+b.lat+","+b.lon;
    if(r._legs && r._legs[key] && r._legs[key]!=="err") continue;
    try{
      const res=await routeBetween(a,b);
      r._legs=r._legs||{}; r._legs[key]=res;
    }catch(e){ r._legs=r._legs||{}; r._legs[key]="err"; }
    if(CURRENT==="urlaub" && DETAIL_OPEN===rid) renderReiseDetail(r);
  }
};
window.calcLeg = async (rid,i,j) => {
  const r=DB.urlaub.find(x=>x.id===rid); const a=r.staedte[i], b=r.staedte[j==null?i+1:j];
  if(!a||!b) return;
  const el=document.getElementById("leg_"+i); if(el)el.textContent="berechne…";
  const key=a.lat+","+a.lon+">"+b.lat+","+b.lon;
  try{
    const res = await routeBetween(a,b);
    r._legs = r._legs||{}; r._legs[key] = res;
    renderReiseDetail(r);
  }catch(e){ r._legs=r._legs||{}; r._legs[key]="err"; renderReiseDetail(r); }
};

window.saveStop = async () => {
  const { rid, i } = window._stopCtx;
  const r = DB.urlaub.find(x=>x.id===rid); if(!r) return;
  if(!pruefeFormular({ st_name: pflicht("Bitte einen Namen eingeben.") })) return;
  const name = document.getElementById("st_name").value.trim();
  const linkRaw = document.getElementById("st_link").value.trim();
  const hinweis = document.getElementById("st_hint").value.trim();
  const link = cleanLink(linkRaw);
  const st = document.getElementById("st_geo"); st.textContent="Suche Koordinaten & Entfernung…";
  const g = parseGeo(linkRaw);
  let lat=g.lat, lon=g.lon;
  if(lat==null){
    try{ const geo = await geocode([name, linkRaw].filter(Boolean).join(", ")); lat=geo.lat; lon=geo.lon; }
    catch(e){ /* ohne Koordinaten speichern */ }
  }
  const stop = { id:uid(), name, link, hinweis, lat, lon, adresse:g.label||(link?"":linkRaw) };
  // Entfernung & Fahrzeit vom vorherigen Ort (Stadt i) zum Stopp – wie in der App üblich
  const a = r.staedte[i];
  if(a && a.lat!=null && lat!=null){
    try{ const res = await routeBetween(a, stop);
      stop.entfernung = res.km.toFixed(0)+" km"; stop.dauer = fmtDauer(res.min); }
    catch(e){ /* keine Route ermittelbar */ }
  }
  const c = r.staedte[i];

function vorherigesBisDatum(r, i, insertAt){
  const sicht = r.staedte.map((c,idx)=>({c,idx})).filter(x=>!x.c.deleted);
  let pos;
  if(insertAt!=null)      pos = sicht.filter(x=>x.idx < insertAt).length - 1;
  else if(i!=null)        pos = sicht.findIndex(x=>x.idx===i) - 1;
  else                    pos = sicht.length - 1;   // wird hinten angehaengt
  if(pos < 0 || !sicht[pos]) return "";
  const v = sicht[pos].c;
  return v.bis || v.von || "";
}

window.saveCity = async () => {
  const { rid, i, insertAt } = window._cityCtx;
  const r = DB.urlaub.find(x=>x.id===rid);
  const name = document.getElementById("c_name").value.trim();
  const plz  = document.getElementById("c_plz").value.trim();
  const land = document.getElementById("c_land").value.trim();
  const link = cleanLink(document.getElementById("c_link").value);
  const von = document.getElementById("c_von").value;
  const bis = document.getElementById("c_bis").value;
  const hinweis = document.getElementById("c_hinweis").value.trim();
  const foto = window._cityFoto||"";
  if(!name){ document.getElementById("c_geo").textContent="Bitte einen Stadtnamen eingeben."; return; }
  if(von && bis && bis < von){ document.getElementById("c_geo").textContent="Das Bis-Datum liegt vor dem Von-Datum."; return; }
  const st = document.getElementById("c_geo"); st.textContent="Suche Koordinaten…";
  // Suchtext für Geocoding: Name + PLZ + Land
  const query = [name, plz, land].filter(Boolean).join(", ");
  let lat=null, lon=null;
  try{ const geo = await geocode(query); lat=geo.lat; lon=geo.lon; }
  catch(e){ /* offline / file:// – ohne Koordinaten speichern */ }
  if(i!=null){
    const c = r.staedte[i];
    c.name=name; c.plz=plz; c.land=land; c.link=link; c.von=von; c.bis=bis; c.hinweis=hinweis; c.foto=foto;
    if(lat!=null){ c.lat=lat; c.lon=lon; }
    c.updatedAt=now();
  } else {
    const neu = { id:uid(), name, plz, land, link, lat, lon, von, bis, hinweis, foto,
      stellplaetze:[], sehens:[], restaurants:[], stopps:[], tagesplan:{}, _open:true, updatedAt:now() };
    if(insertAt!=null && insertAt>=0 && insertAt<=r.staedte.length) r.staedte.splice(insertAt,0,neu);
    else r.staedte.push(neu);
  }
  r._legs = {};            // Etappen neu berechnen lassen
  r.updatedAt=now(); save(); closeModal();
  openReiseDetail(rid);
  // Etappen automatisch berechnen, sobald Koordinaten da sind
  autoCalcLegs(rid);
};

// Drag&Drop Sortierung (nur Tour)
function enableCityDrag(r){
  const list=document.getElementById("cityList"); if(!list)return;
  let dragIdx=null;
  list.querySelectorAll(".cdrag").forEach(h=>{
    const card=h.closest(".city");
    h.addEventListener("pointerdown", e=>{
      e.preventDefault(); dragIdx=+h.dataset.drag; card.classList.add("dragging");
      const move=ev=>{
        const el=document.elementFromPoint(ev.clientX,ev.clientY);
        const tc=el&&el.closest(".city"); list.querySelectorAll(".city").forEach(c=>c.classList.remove("drop-target"));
        if(tc&&tc!==card) tc.classList.add("drop-target");
      };
      const up=ev=>{
        document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up);
        card.classList.remove("dragging");
        const el=document.elementFromPoint(ev.clientX,ev.clientY);
        const tc=el&&el.closest(".city");
        list.querySelectorAll(".city").forEach(c=>c.classList.remove("drop-target"));
        if(tc&&tc!==card){ const to=+tc.dataset.i;
          const [m]=r.staedte.splice(dragIdx,1); r.staedte.splice(to,0,m);
          r._legs={}; r.updatedAt=now(); save(); renderReiseDetail(r); }
      };
      document.addEventListener("pointermove",move); document.addEventListener("pointerup",up);
    });
  });
}

// Leaflet erst laden, wenn die Karte gebraucht wird (spart Start-Zeit und Daten).
let _leafletPromise = null;
function ladeLeaflet(){
  if(window.L) return Promise.resolve(true);
  if(_leafletPromise) return _leafletPromise;
  _leafletPromise = new Promise((resolve,reject)=>{
    const css=document.createElement("link");
    css.rel="stylesheet";
    css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    css.onerror=()=>{ css.onerror=null; css.href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"; };
    document.head.appendChild(css);
    const laden=(src,fallback)=>{
      const s=document.createElement("script");
      s.src=src;
      s.onload=()=>resolve(true);
      s.onerror=()=>{ if(fallback) laden(fallback,null); else { _leafletPromise=null; reject(new Error("Leaflet konnte nicht geladen werden")); } };
      document.head.appendChild(s);
    };
    laden("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js","https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js");
  });
  return _leafletPromise;
}
let _karte=null;                 // aktive Leaflet-Instanz
const _karteGeoCache={};         // Routen-Geometrien (nur im Speicher, nicht im Sync)
window.openReiseKarte = async id => {
  const r=DB.urlaub.find(x=>x.id===id); if(!r) return;
  // Alle Punkte mit Koordinaten einsammeln
  const punkte=[];
  aktiv(r.staedte).forEach((c,i)=>{
    if(c.lat!=null) punkte.push({lat:c.lat,lon:c.lon,art:"stadt",nr:i+1,name:c.name});
    aktiv(c.stellplaetze).forEach(p=>{ if(p.lat!=null) punkte.push({lat:p.lat,lon:p.lon,art:"unterkunft",name:p.name,stadt:c.name}); });
    aktiv(c.stopps).forEach(s=>{ if(s.lat!=null) punkte.push({lat:s.lat,lon:s.lon,art:"stopp",name:s.name}); });
    tagesEintraege(c).forEach(e=>{ if(e.lat!=null) punkte.push({lat:e.lat,lon:e.lon,art:"tag",typ:e.typ,name:e.name,datum:e._datum}); });
  });
  if(!punkte.length){
    alert("Für diese Reise sind noch keine Koordinaten hinterlegt. Bei Orten und Einträgen unter „Bearbeiten\" eine Adresse eintragen – die Koordinaten werden dann gesucht.");
    return;
  }
  const panel=document.getElementById("kartePanel");
  document.getElementById("karteTitel").textContent="Karte — "+(r.titel||"Reise");
  document.getElementById("karteHint").textContent="Karte: © OpenStreetMap";
  panel.style.display="flex";
  pushNav();   // Zurück-Taste schließt die Karte
  try{ await ladeLeaflet(); }
  catch(e){ panel.style.display="none"; alert("Die Kartenbibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen."); return; }
  if(_karte){ _karte.remove(); _karte=null; }
  _karte=L.map("karteMap",{zoomControl:true});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(_karte);
  const TAG_ICONS={sehen:"🏛️",restaurant:"🍽️",wanderung:"🥾",aktivitaet:"🎯"};
  const bounds=[];
  punkte.forEach(p=>{
    let icon;
    if(p.art==="stadt") icon=L.divIcon({className:"",html:`<div class="kmark">${p.nr}</div>`,iconSize:[26,26],iconAnchor:[13,13]});
    else if(p.art==="unterkunft") icon=L.divIcon({className:"",html:`<div class="kemoji">${r.unterkunft==="wohnmobil"?"🚐":"🛏️"}</div>`,iconSize:[22,22],iconAnchor:[11,11]});
    else if(p.art==="stopp") icon=L.divIcon({className:"",html:`<div class="kemoji">📍</div>`,iconSize:[22,22],iconAnchor:[11,20]});
    else icon=L.divIcon({className:"",html:`<div class="kemoji">${TAG_ICONS[p.typ]||"🎯"}</div>`,iconSize:[22,22],iconAnchor:[11,11]});
    const sub = p.art==="stadt"?"Station "+p.nr
      : p.art==="unterkunft"?(r.unterkunft==="wohnmobil"?"Stellplatz":"Hotel")+(p.stadt?" · "+p.stadt:"")
      : p.art==="stopp"?"Zwischenstopp"
      : (tagTypInfo(p.typ).label+(p.datum?" · "+fmtDate(p.datum):""));
    L.marker([p.lat,p.lon],{icon}).addTo(_karte)
      .bindPopup(`<b>${esc(p.name||"")}</b><br><span style="color:#647089">${esc(sub)}</span><br><a href="${esc(mapsLink(p.lat+","+p.lon))}" target="_blank" rel="noopener">In Google Maps öffnen</a>`);
    bounds.push([p.lat,p.lon]);
  });
  _karte.fitBounds(bounds,{padding:[36,36],maxZoom:14});
  // Routenlinie zwischen den Stationen (inkl. Zwischenstopps), Straßenverlauf via OSRM (PKW)
  const staedteMitKoord=aktiv(r.staedte).filter(c=>c.lat!=null);
  if(staedteMitKoord.length>=2){
    const seq=[];
    aktiv(r.staedte).forEach(c=>{
      if(c.lat==null) return;
      seq.push([c.lon,c.lat]);
      aktiv(c.stopps).forEach(s=>{ if(s.lat!=null) seq.push([s.lon,s.lat]); });
    });
    // letzter Eintrag darf kein Stopp hinter der letzten Stadt sein
    const letzteStadt=staedteMitKoord[staedteMitKoord.length-1];
    while(seq.length && (seq[seq.length-1][0]!==letzteStadt.lon || seq[seq.length-1][1]!==letzteStadt.lat)) seq.pop();
    if(seq.length>=2){
      const key=seq.map(p=>p.join(",")).join(";");
      try{
        let geo=_karteGeoCache[key];
        if(!geo){
          const url=`https://router.project-osrm.org/route/v1/driving/${key}?overview=full&geometries=geojson`;
          const resp=await fetch(url);
          if(!resp.ok) throw new Error("Route "+resp.status);
          const j=await resp.json();
          if(!j.routes||!j.routes.length) throw new Error("keine Route");
          geo=j.routes[0].geometry.coordinates.map(p=>[p[1],p[0]]);
          _karteGeoCache[key]=geo;
        }
        if(_karte){
          L.polyline(geo,{color:"#1d4ed8",weight:4,opacity:.75}).addTo(_karte);
          document.getElementById("karteHint").textContent="Route: PKW-Straßenverlauf (OSRM) · Karte: © OpenStreetMap";
        }
      }catch(e){
        // Fallback: gestrichelte Luftlinie zwischen den Stationen
        if(_karte){
          L.polyline(seq.map(p=>[p[1],p[0]]),{color:"#1d4ed8",weight:3,opacity:.6,dashArray:"8 8"}).addTo(_karte);
          document.getElementById("karteHint").textContent="Straßenroute nicht abrufbar – gestrichelte Linie zeigt die Reihenfolge · Karte: © OpenStreetMap";
        }
      }
    }
  }
};

// Dateiname ohne Sonderzeichen
function dateiName(text, ersatz){
  const n = (text||"").replace(/[^a-z0-9]+/gi,"_").replace(/^_+|_+$/g,"");
  return n || ersatz || "termine";
}
// Ein ganztaegiger Termin je Station (von – bis). Stationen ohne Datum
// koennen nicht eingetragen werden und werden uebersprungen.
function stationsTermine(r){
  const utyp = r.unterkunft==="wohnmobil" ? "Stellplatz" : "Hotel";
  return aktiv(r.staedte).filter(c=>c.von).map(c=>{
    const unterkunft = aktiv(c.stellplaetze).map(x=>x.name).filter(Boolean);
    const details = [
      unterkunft.length ? utyp+": "+unterkunft.join(", ") : "",
      c.abreiseZeit ? "Abreise bis "+c.abreiseZeit+" Uhr" : "",
      c.abreiseHinweis || "",
      c.hinweis || ""
    ].filter(Boolean).join(" · ");
    return {
      // Stations-ID als UID: ein erneuter Export aktualisiert den Termin,
      // statt ihn ein zweites Mal anzulegen.
      uid: c.id,
      titel: (r.titel ? r.titel+" · " : "") + c.name,
      start: c.von,
      end: c.bis || c.von,
      details
    };
  });
}
window.reiseStationenICS = id => {

  downloadICS(termine, dateiName((r.titel||"reise")+"_stationen","reise_stationen"));

};
